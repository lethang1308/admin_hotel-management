<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Mazer Admin</title>

    <link rel="shortcut icon" th:href="@{/admin/assets/static/images/logo/favicon.svg}" type="image/x-icon">
    <link rel="shortcut icon" th:href="@{/admin/assets/static/images/logo/favicon.png}" type="image/png">

    <link rel="stylesheet" th:href="@{/admin/assets/compiled/css/app.css}">
    <link rel="stylesheet" th:href="@{/admin/assets/compiled/css/app-dark.css}">
    <link rel="stylesheet" th:href="@{/admin/assets/compiled/css/error.css}">
    <link rel="stylesheet" th:href="@{/admin/assets/static/css/cms-typography.css}">
</head>

<body>
<script th:src="@{/admin/assets/static/js/initTheme.js}"></script>
<div id="error">
    <div class="error-page container">
        <div class="col-md-8 col-12 offset-md-2">
            <div class="text-center">
                <img class="img-error" th:src="@{/admin/assets/static/images/samples/error-404.svg}" alt="Not Found">
                <h1 class="error-title">Not Found</h1>
                <p class="fs-5 text-gray-600">The page you are looking for was not found.</p>
                <a th:href="@{/admin}" class="btn btn-lg btn-outline-primary mt-3">Go Home</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
