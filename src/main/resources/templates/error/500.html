<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>500 Internal Error</title>
    <link rel="stylesheet" th:href="@{/admin/css/admin.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="card auth-card" style="text-align:center;">
        <h1 style="margin:0; color:var(--danger);">500</h1>
        <h2 style="margin:0.5rem 0;">Unexpected Error</h2>
        <p style="color:var(--text-muted); margin-bottom:1.5rem;">
            Something went wrong while processing your request. Please try again later.
        </p>
        <a th:href="@{/admin}" class="btn btn-primary">Go to Dashboard</a>
    </div>
</div>
</body>
</html>
