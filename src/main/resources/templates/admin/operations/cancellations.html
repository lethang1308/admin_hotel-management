<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{admin/layouts/main :: layout(#{ops.cancellations},~{::#operations-page},~{::#operations-scripts})}">
<body>
<section id="operations-page">
<div class="hotel-heading mb-4">
  <div><p class="hotel-eyebrow" th:text="#{ops.workspace}"></p><h3 th:text="#{ops.cancellations}"></h3></div>
  <div class="d-flex gap-2 flex-wrap"></div>
</div><div class="card mb-4" >
  
  <div class="card-body">
<form method="get" th:action="@{/admin/cancellations}"  class="mb-3">
<div class="row g-3 align-items-end"><div class="col-12 col-md"><label class="form-label d-block mb-0"><span th:text="#{ops.kind}"></span><select class="form-select" name="kind" >
<option value="" th:text="#{cms.all}"></option>
<option value="CANCEL" th:selected="${(param.kind != null ? param.kind[0] : '') == 'CANCEL'}" th:text="#{ops.CANCEL}"></option>
<option value="NO_SHOW" th:selected="${(param.kind != null ? param.kind[0] : '') == 'NO_SHOW'}" th:text="#{ops.NO_SHOW}"></option>
<option value="EXPIRED" th:selected="${(param.kind != null ? param.kind[0] : '') == 'EXPIRED'}" th:text="#{ops.EXPIRED}"></option>
</select></label></div>
<div class="col-12 col-md"><label class="form-label d-block mb-0"><span th:text="#{ops.actor}"></span><select class="form-select" name="actor" >
<option value="" th:text="#{cms.all}"></option>
<option th:each="a:${actors}" th:value="${a.id('id')}" th:text="${a.s('email')}" th:selected="${a.s('id') == (param.actor != null ? param.actor[0] : '')}"></option>
</select></label></div>
<div class="col-12 col-md"><label class="form-label d-block mb-0">
  <span th:text="#{ops.from}"></span>
  <input class="form-control" type="date" name="from" th:value="${param.from != null ? param.from[0] : ''}" >
</label></div>
<div class="col-12 col-md"><label class="form-label d-block mb-0">
  <span th:text="#{ops.until}"></span>
  <input class="form-control" type="date" name="until" th:value="${param.until != null ? param.until[0] : ''}" >
</label></div>
<div class="col-12 col-md"><button class="btn btn-primary mt-2" th:text="#{ops.filter}" ></button></div></div>
</form><div class="table-responsive">
<table class="table align-middle mb-0">
<thead><tr><th scope="col" th:text="#{ops.bookingCode}"></th><th scope="col" th:text="#{ops.kind}"></th><th scope="col" th:text="#{ops.day}"></th><th scope="col" th:text="#{ops.actor}"></th><th scope="col" th:text="#{ops.reason}"></th><th scope="col" th:text="#{ops.roomAmount}"></th><th scope="col" th:text="#{ops.fee}"></th><th scope="col" th:text="#{ops.refundDue}"></th><th scope="col" th:text="#{ops.policy}"></th></tr></thead>
<tbody>
  <tr th:if="${#lists.isEmpty(page.rows)}"><td colspan="9" class="text-center text-muted py-3" th:text="#{cms.empty}"></td></tr>
  <tr th:each="r:${page.rows}"><td><a th:href="@{/admin/bookings/{id}(id=${r.id('booking_id')})}" th:text="${r.s('booking_code')}"></a></td><td><span class="badge bg-light-primary" th:text="#{${'ops.'+r.s('kind')}}"></span></td><td><span th:text="${r.data['processed_at']}"></span></td><td><span th:text="${r.data['actor']}"></span></td><td><span th:text="${r.data['reason']}"></span></td><td><span class="text-nowrap" th:text="${#numbers.formatDecimal(r.money('cancelled_room_amount'),1,'COMMA',0,'POINT')+' VND'}"></span></td><td><span class="text-nowrap" th:text="${#numbers.formatDecimal(r.money('cancellation_fee'),1,'COMMA',0,'POINT')+' VND'}"></span></td><td><span class="text-nowrap" th:text="${#numbers.formatDecimal(r.money('proposed_refund_amount'),1,'COMMA',0,'POINT')+' VND'}"></span></td><td><details><summary th:text="#{ops.policy}"></summary><pre class="small" th:text="${r.s('policy_snapshot')}"></pre></details></td></tr>
</tbody></table>
</div><nav class="d-flex gap-2 align-items-center mt-3" th:aria-label="#{ops.paging}">
  <a th:if="${previous != null}" th:href="${previous}" class="btn btn-light" th:text="#{ops.previous}"></a>
  <span class="text-muted" th:text="${(page.index + 1) + ' · ' + page.total}"></span>
  <a th:if="${next != null}" th:href="${next}" class="btn btn-light" th:text="#{ops.next}"></a>
</nav>
  </div>
</div>
</section>
<th:block id="operations-scripts"></th:block>
</body>
</html>
