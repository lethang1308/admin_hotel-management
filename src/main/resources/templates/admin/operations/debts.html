<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{admin/layouts/main :: layout(#{ops.debts},~{::#operations-page},~{::#operations-scripts})}">
<body>
<section id="operations-page">
<div class="hotel-heading mb-4">
  <div><p class="hotel-eyebrow" th:text="#{ops.workspace}"></p><h3 th:text="#{ops.debts}"></h3></div>
  <div class="d-flex gap-2 flex-wrap"><a class="btn btn-outline-primary" th:href="@{/admin/payments}" th:text="#{ops.payments}" ></a></div>
</div><div class="card mb-4" >
  
  <div class="card-body">
<form method="get" th:action="@{/admin/debts}"  class="mb-3">
<div class="row g-3 align-items-end"><div class="col-12 col-md"><label class="form-label d-block mb-0"><span th:text="#{ops.kind}"></span><select class="form-select" name="direction" >
<option value="" th:text="#{cms.all}"></option>
<option value="DEBT" th:selected="${(param.direction != null ? param.direction[0] : '') == 'DEBT'}" th:text="#{ops.DEBT}"></option>
<option value="REFUND" th:selected="${(param.direction != null ? param.direction[0] : '') == 'REFUND'}" th:text="#{ops.REFUND}"></option>
</select></label></div>
<div class="col-12 col-md"><button class="btn btn-primary mt-2" th:text="#{ops.filter}" ></button></div></div>
</form><div class="table-responsive">
<table class="table align-middle mb-0">
<thead><tr><th scope="col" th:text="#{ops.bookingCode}"></th><th scope="col" th:text="#{ops.customer}"></th><th scope="col" th:text="#{ops.status}"></th><th scope="col" th:text="#{ops.total}"></th><th scope="col" th:text="#{ops.paid}"></th><th scope="col" th:text="#{ops.balance}"></th></tr></thead>
<tbody>
  <tr th:if="${#lists.isEmpty(page.rows)}"><td colspan="6" class="text-center text-muted py-3" th:text="#{cms.empty}"></td></tr>
  <tr th:each="r:${page.rows}"><td><a th:href="@{/admin/bookings/{id}(id=${r.id('booking_id')})}" th:text="${r.s('booking_code')}"></a></td><td><span th:text="${r.data['contact_name']}"></span></td><td><span class="badge bg-light-primary" th:text="#{${'ops.'+r.s('status')}}"></span></td><td><span class="text-nowrap" th:text="${#numbers.formatDecimal(r.money('total'),1,'COMMA',0,'POINT')+' VND'}"></span></td><td><span class="text-nowrap" th:text="${#numbers.formatDecimal(r.money('paid'),1,'COMMA',0,'POINT')+' VND'}"></span></td><td><span class="text-nowrap" th:text="${#numbers.formatDecimal(r.money('balance'),1,'COMMA',0,'POINT')+' VND'}"></span></td></tr>
</tbody></table>
</div><nav class="d-flex gap-2 align-items-center mt-3" th:aria-label="#{ops.paging}">
  <a th:if="${previous != null}" th:href="${previous}" class="btn btn-light" th:text="#{ops.previous}"></a>
  <span class="text-muted" th:text="${(page.index + 1) + ' · ' + page.total}"></span>
  <a th:if="${next != null}" th:href="${next}" class="btn btn-light" th:text="#{ops.next}"></a>
</nav>
  </div>
</div>
</section>
<th:block id="operations-scripts"></th:block>
</body>
</html>
