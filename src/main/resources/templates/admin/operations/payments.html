<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{admin/layouts/main :: layout(#{ops.payments},~{::#operations-page},~{::#operations-scripts})}">
<body>
<section id="operations-page">
<div class="hotel-heading mb-4">
  <div><p class="hotel-eyebrow" th:text="#{ops.workspace}"></p><h3 th:text="#{ops.payments}"></h3></div>
  <div class="d-flex gap-2 flex-wrap"><a class="btn btn-outline-primary" th:href="@{/admin/debts}" th:text="#{ops.debts}" ></a></div>
</div><div class="card mb-4" >
  <div class="card-header pb-2"><h5 th:text="#{ops.shifts}"></h5></div>
  <div class="card-body">
<div class="mb-3" th:with="open=${!#lists.isEmpty(shifts) and shifts[0].time('closed_at') == null}">
<form method="post" th:action="@{/admin/payments/shift/open}"  th:unless="${open}">
<div class="row g-3 align-items-end"><div class="col-12 col-md"><label class="form-label d-block mb-0">
  <span th:text="#{ops.openingCash}"></span>
  <input class="form-control" type="number" name="cash" th:value="${0}" min="0" step="1" required>
</label></div>
<div class="col-12 col-md"><button class="btn btn-primary mt-2" th:text="#{ops.openShift}" ></button></div></div>
</form>
<form method="post" th:action="@{/admin/payments/shift/close}"  th:if="${open}">
<div class="row g-3 align-items-end"><div class="col-12 col-md"><label class="form-label d-block mb-0">
  <span th:text="#{ops.countedCash}"></span>
  <input class="form-control" type="number" name="cash"  min="0" step="1" required>
</label></div>
<div class="col-12 col-md"><label class="form-label"><span th:text="#{reception.shiftNotes}"></span><input class="form-control" name="notes" maxlength="1000"></label><button class="btn btn-outline-primary mt-2" th:text="#{ops.closeShift}" ></button></div></div>
</form>
</div><div class="table-responsive">
<table class="table align-middle mb-0">
<thead><tr><th scope="col" th:text="#{ops.openShift}"></th><th scope="col" th:text="#{ops.closeShift}"></th><th scope="col" th:text="#{ops.openingCash}"></th><th scope="col" th:text="#{ops.expectedCash}"></th><th scope="col" th:text="#{ops.countedCash}"></th></tr></thead>
<tbody>
  <tr th:if="${#lists.isEmpty(shifts)}"><td colspan="5" class="text-center text-muted py-3" th:text="#{cms.empty}"></td></tr>
  <tr th:each="r:${shifts}"><td><span th:text="${r.data['opened_at']}"></span></td><td><span th:text="${r.data['closed_at']}"></span></td><td><span class="text-nowrap" th:text="${#numbers.formatDecimal(r.money('opening_cash'),1,'COMMA',0,'POINT')+' VND'}"></span></td><td><span class="text-nowrap" th:text="${#numbers.formatDecimal(r.money('expected_cash'),1,'COMMA',0,'POINT')+' VND'}"></span></td><td><span th:text="${r.data['counted_closing_cash']}"></span></td></tr>
</tbody></table>
</div>
  </div>
</div><div class="card mb-4" >
  
  <div class="card-body">
<form method="get" th:action="@{/admin/payments}"  class="mb-3">
<div class="row g-3 align-items-end"><div class="col-12 col-md"><label class="form-label d-block mb-0"><span th:text="#{ops.kind}"></span><select class="form-select" name="kind" >
<option value="" th:text="#{cms.all}"></option>
<option value="DEPOSIT" th:selected="${(param.kind != null ? param.kind[0] : '') == 'DEPOSIT'}" th:text="#{ops.DEPOSIT}"></option>
<option value="PAYMENT" th:selected="${(param.kind != null ? param.kind[0] : '') == 'PAYMENT'}" th:text="#{ops.PAYMENT}"></option>
<option value="REFUND" th:selected="${(param.kind != null ? param.kind[0] : '') == 'REFUND'}" th:text="#{ops.REFUND}"></option>
</select></label></div>
<div class="col-12 col-md"><label class="form-label d-block mb-0"><span th:text="#{ops.status}"></span><select class="form-select" name="status" >
<option value="" th:text="#{cms.all}"></option>
<option value="PENDING" th:selected="${(param.status != null ? param.status[0] : '') == 'PENDING'}" th:text="#{ops.PENDING}"></option>
<option value="SUCCEEDED" th:selected="${(param.status != null ? param.status[0] : '') == 'SUCCEEDED'}" th:text="#{ops.SUCCEEDED}"></option>
<option value="FAILED" th:selected="${(param.status != null ? param.status[0] : '') == 'FAILED'}" th:text="#{ops.FAILED}"></option>
<option value="CANCELLED" th:selected="${(param.status != null ? param.status[0] : '') == 'CANCELLED'}" th:text="#{ops.CANCELLED}"></option>
</select></label></div>
<div class="col-12 col-md"><label class="form-label d-block mb-0"><span th:text="#{ops.method}"></span><select class="form-select" name="method" >
<option value="" th:text="#{cms.all}"></option>
<option value="CASH" th:selected="${(param.method != null ? param.method[0] : '') == 'CASH'}" th:text="#{ops.CASH}"></option>
<option value="BANK_TRANSFER" th:selected="${(param.method != null ? param.method[0] : '') == 'BANK_TRANSFER'}" th:text="#{ops.BANK_TRANSFER}"></option>
<option value="ONLINE_GATEWAY" th:selected="${(param.method != null ? param.method[0] : '') == 'ONLINE_GATEWAY'}" th:text="#{ops.ONLINE_GATEWAY}"></option>
</select></label></div>
<div class="col-12 col-md"><label class="form-label d-block mb-0">
  <span th:text="#{ops.from}"></span>
  <input class="form-control" type="date" name="from" th:value="${param.from != null ? param.from[0] : ''}" >
</label></div>
<div class="col-12 col-md"><label class="form-label d-block mb-0">
  <span th:text="#{ops.until}"></span>
  <input class="form-control" type="date" name="until" th:value="${param.until != null ? param.until[0] : ''}" >
</label></div>
<div class="col-12 col-md"><button class="btn btn-primary mt-2" th:text="#{ops.filter}" ></button></div></div>
</form><div class="table-responsive">
<table class="table align-middle mb-0">
<thead><tr><th scope="col" th:text="#{ops.code}"></th><th scope="col" th:text="#{ops.bookingCode}"></th><th scope="col" th:text="#{ops.kind}"></th><th scope="col" th:text="#{ops.status}"></th><th scope="col" th:text="#{ops.method}"></th><th scope="col" th:text="#{ops.total}"></th><th scope="col" th:text="#{ops.day}"></th><th scope="col" th:text="#{ops.reason}"></th></tr></thead>
<tbody>
  <tr th:if="${#lists.isEmpty(page.rows)}"><td colspan="8" class="text-center text-muted py-3" th:text="#{cms.empty}"></td></tr>
  <tr th:each="r:${page.rows}"><td><span th:text="${r.data['transaction_code']}"></span></td><td><a th:href="@{/admin/bookings/{id}(id=${r.id('booking_id')})}" th:text="${r.s('booking_code')}"></a></td><td><span class="badge bg-light-primary" th:text="#{${'ops.'+r.s('kind')}}"></span></td><td><span class="badge bg-light-primary" th:text="#{${'ops.'+r.s('status')}}"></span></td><td><span class="badge bg-light-primary" th:text="#{${'ops.'+r.s('method')}}"></span></td><td><span class="text-nowrap" th:text="${#numbers.formatDecimal(r.money('amount'),1,'COMMA',0,'POINT')+' VND'}"></span></td><td><span th:text="${r.data['paid_at']}"></span></td><td><span th:text="${r.data['reason']}"></span></td></tr>
</tbody></table>
</div><nav class="d-flex gap-2 align-items-center mt-3" th:aria-label="#{ops.paging}">
  <a th:if="${previous != null}" th:href="${previous}" class="btn btn-light" th:text="#{ops.previous}"></a>
  <span class="text-muted" th:text="${(page.index + 1) + ' · ' + page.total}"></span>
  <a th:if="${next != null}" th:href="${next}" class="btn btn-light" th:text="#{ops.next}"></a>
</nav>
  </div>
</div>
</section>
<th:block id="operations-scripts"></th:block>
</body>
</html>
