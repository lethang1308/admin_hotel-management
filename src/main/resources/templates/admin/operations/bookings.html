<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{admin/layouts/main :: layout(#{ops.bookings},~{::#operations-page},~{::#operations-scripts})}">
<body>
<section id="operations-page">
<div class="hotel-heading mb-4">
  <div><p class="hotel-eyebrow" th:text="#{ops.workspace}"></p><h3 th:text="#{ops.bookings}"></h3></div>
  <div class="d-flex gap-2 flex-wrap"><a class="btn btn-outline-primary" th:href="@{/admin/bookings/calendar}" th:text="#{ops.calendar}" ></a><a class="btn btn-primary" th:href="@{/admin/bookings/create}" th:text="#{ops.newBooking}" sec:authorize="hasAuthority('booking.create')"></a></div>
</div><div class="card mb-4" >
  
  <div class="card-body">
<nav class="booking-chips" th:aria-label="#{deskBook.quickFilters}">
<a class="btn btn-sm" th:classappend="${quick == 'ALL' ? 'btn-primary' : 'btn-outline-primary'}" th:href="@{/admin/bookings(quick='ALL',q=${param.q != null ? param.q[0] : null},status=${param.status != null ? param.status[0] : null},source=${param.source != null ? param.source[0] : null},typeId=${param.typeId != null ? param.typeId[0] : null},from=${param.from != null ? param.from[0] : null},until=${param.until != null ? param.until[0] : null})}"><span th:text="#{deskBook.quick.ALL}"></span> <span class="badge bg-light-secondary" th:text="${quickCounts.get('ALL')}"></span></a>
<a class="btn btn-sm" th:classappend="${quick == 'ARRIVALS' ? 'btn-primary' : 'btn-outline-primary'}" th:href="@{/admin/bookings(quick='ARRIVALS',q=${param.q != null ? param.q[0] : null},status=${param.status != null ? param.status[0] : null},source=${param.source != null ? param.source[0] : null},typeId=${param.typeId != null ? param.typeId[0] : null},from=${param.from != null ? param.from[0] : null},until=${param.until != null ? param.until[0] : null})}"><span th:text="#{deskBook.quick.ARRIVALS}"></span> <span class="badge bg-light-secondary" th:text="${quickCounts.get('ARRIVALS')}"></span></a>
<a class="btn btn-sm" th:classappend="${quick == 'DEPARTURES' ? 'btn-primary' : 'btn-outline-primary'}" th:href="@{/admin/bookings(quick='DEPARTURES',q=${param.q != null ? param.q[0] : null},status=${param.status != null ? param.status[0] : null},source=${param.source != null ? param.source[0] : null},typeId=${param.typeId != null ? param.typeId[0] : null},from=${param.from != null ? param.from[0] : null},until=${param.until != null ? param.until[0] : null})}"><span th:text="#{deskBook.quick.DEPARTURES}"></span> <span class="badge bg-light-secondary" th:text="${quickCounts.get('DEPARTURES')}"></span></a>
<a class="btn btn-sm" th:classappend="${quick == 'PENDING' ? 'btn-primary' : 'btn-outline-primary'}" th:href="@{/admin/bookings(quick='PENDING',q=${param.q != null ? param.q[0] : null},status=${param.status != null ? param.status[0] : null},source=${param.source != null ? param.source[0] : null},typeId=${param.typeId != null ? param.typeId[0] : null},from=${param.from != null ? param.from[0] : null},until=${param.until != null ? param.until[0] : null})}"><span th:text="#{deskBook.quick.PENDING}"></span> <span class="badge bg-light-secondary" th:text="${quickCounts.get('PENDING')}"></span></a>
<a class="btn btn-sm" th:classappend="${quick == 'IN_HOUSE' ? 'btn-primary' : 'btn-outline-primary'}" th:href="@{/admin/bookings(quick='IN_HOUSE',q=${param.q != null ? param.q[0] : null},status=${param.status != null ? param.status[0] : null},source=${param.source != null ? param.source[0] : null},typeId=${param.typeId != null ? param.typeId[0] : null},from=${param.from != null ? param.from[0] : null},until=${param.until != null ? param.until[0] : null})}"><span th:text="#{deskBook.quick.IN_HOUSE}"></span> <span class="badge bg-light-secondary" th:text="${quickCounts.get('IN_HOUSE')}"></span></a>
</nav><form method="get" th:action="@{/admin/bookings}" class="mb-3">
<input type="hidden" name="quick" th:value="${quick}">
<div class="row g-3 align-items-end"><div class="col-12 col-md"><label class="form-label d-block mb-0">
  <span th:text="#{ops.bookingSearch}"></span>
  <input class="form-control" type="search" name="q" th:value="${param.q != null ? param.q[0] : ''}" maxlength="150">
</label></div>
<div class="col-12 col-md"><label class="form-label d-block mb-0"><span th:text="#{ops.status}"></span><select class="form-select" name="status" >
<option value="" th:text="#{cms.all}"></option>
<option value="PENDING" th:selected="${(param.status != null ? param.status[0] : '') == 'PENDING'}" th:text="#{ops.PENDING}"></option>
<option value="CONFIRMED" th:selected="${(param.status != null ? param.status[0] : '') == 'CONFIRMED'}" th:text="#{ops.CONFIRMED}"></option>
<option value="CHECKED_IN" th:selected="${(param.status != null ? param.status[0] : '') == 'CHECKED_IN'}" th:text="#{ops.CHECKED_IN}"></option>
<option value="CHECKED_OUT" th:selected="${(param.status != null ? param.status[0] : '') == 'CHECKED_OUT'}" th:text="#{ops.CHECKED_OUT}"></option>
<option value="CANCELLED" th:selected="${(param.status != null ? param.status[0] : '') == 'CANCELLED'}" th:text="#{ops.CANCELLED}"></option>
<option value="REJECTED" th:selected="${(param.status != null ? param.status[0] : '') == 'REJECTED'}" th:text="#{ops.REJECTED}"></option>
<option value="NO_SHOW" th:selected="${(param.status != null ? param.status[0] : '') == 'NO_SHOW'}" th:text="#{ops.NO_SHOW}"></option>
</select></label></div>
<div class="col-12 col-md"><label class="form-label d-block mb-0"><span th:text="#{ops.source}"></span><select class="form-select" name="source" >
<option value="" th:text="#{cms.all}"></option>
<option value="ONLINE" th:selected="${(param.source != null ? param.source[0] : '') == 'ONLINE'}" th:text="#{ops.ONLINE}"></option>
<option value="PHONE" th:selected="${(param.source != null ? param.source[0] : '') == 'PHONE'}" th:text="#{ops.PHONE}"></option>
<option value="WALK_IN" th:selected="${(param.source != null ? param.source[0] : '') == 'WALK_IN'}" th:text="#{ops.WALK_IN}"></option>
</select></label></div>
<div class="col-12 col-md"><label class="form-label d-block mb-0"><span th:text="#{ops.roomType}"></span><select class="form-select" name="typeId" >
<option value="" th:text="#{cms.all}"></option>
<option th:each="t:${types}" th:value="${t.id('id')}" th:text="${t.s('name')}" th:selected="${t.s('id') == (param.typeId != null ? param.typeId[0] : '')}"></option>
</select></label></div>
<div class="col-12 col-md"><label class="form-label d-block mb-0">
  <span th:text="#{ops.from}"></span>
  <input class="form-control" type="date" name="from" th:value="${param.from != null ? param.from[0] : ''}" >
</label></div>
<div class="col-12 col-md"><label class="form-label d-block mb-0">
  <span th:text="#{ops.until}"></span>
  <input class="form-control" type="date" name="until" th:value="${param.until != null ? param.until[0] : ''}" >
</label></div>
<div class="col-12 col-md"><button class="btn btn-primary mt-2" th:text="#{ops.filter}" ></button></div></div>
</form><div class="table-responsive"><table class="table align-middle mb-0">
<thead><tr><th th:text="#{ops.bookingCode}"></th><th th:text="#{ops.customer}"></th><th th:text="#{ops.physicalRoom}"></th>
<th th:text="#{price.period}"></th><th th:text="#{ops.total}"></th><th th:text="#{ops.status}"></th><th th:text="#{ops.actions}"></th></tr></thead>
<tbody><tr th:if="${#lists.isEmpty(page.rows)}"><td colspan="7" class="py-5 text-center text-muted" th:text="#{cms.empty}"></td></tr>
<tr th:each="r:${page.rows}">
<td><a class="fw-semibold" th:href="@{/admin/bookings/{id}(id=${r.id('id')})}" th:text="${r.s('booking_code')}"></a>
<small class="d-block text-muted" th:text="#{${'ops.'+r.s('source')}}"></small>
<small th:if="${r.s('status') == 'PENDING'}" class="d-block text-warning" data-booking-countdown th:data-until="${r.time('hold_expires_at')}" th:text="${r.time('hold_expires_at')}"></small></td>
<td><strong th:text="${r.s('contact_name')}"></strong><small class="d-block text-muted" th:text="${r.s('contact_phone')}"></small></td>
<td class="booking-rooms-cell"><div th:each="room:${assignments.get(r.id('id'))}">
<span th:text="${room.s('room_number') ?: '—'}"></span> · <span th:text="${room.s('room_type_name_snapshot')}"></span>
<small class="badge" th:if="${room.s('room_status') != null}" th:classappend="${room.s('room_status') == 'AVAILABLE' ? 'bg-light-success' : room.s('room_status') == 'CLEANING' ? 'bg-light-warning' : 'bg-light-danger'}" th:text="#{${'hotel.status.'+room.s('room_status')}}"></small>
</div></td>
<td class="text-nowrap"><span th:text="${r.s('arrival')}"></span><small class="d-block text-muted" th:text="${r.s('departure')}"></small></td>
<td class="text-nowrap"><strong th:text="${#numbers.formatDecimal(r.money('total_due'),1,'COMMA',0,'POINT')}+' ₫'"></strong>
<small class="d-block"><span th:text="#{ops.paid}"></span> <span th:text="${#numbers.formatDecimal(r.money('net_paid'),1,'COMMA',0,'POINT')}"></span></small>
<small class="d-block"><span th:text="#{ops.balance}"></span> <span th:text="${#numbers.formatDecimal(r.money('total_due').subtract(r.money('net_paid')),1,'COMMA',0,'POINT')}"></span></small></td>
<td><span class="badge bg-light-primary" th:text="#{${'ops.'+r.s('status')}}"></span></td>
<td><div class="d-flex flex-wrap gap-1 mb-1" th:each="room:${assignments.get(r.id('id'))}">
<a class="btn btn-sm btn-outline-primary" sec:authorize="hasAuthority('booking.checkin')"
 th:if="${room.s('status') == 'CONFIRMED' and room.date('check_in_date') == today}"
 th:href="@{/admin/receptionist(booking=${r.id('id')},line=${room.id('id')},action='checkin')}" th:text="#{reception.checkin}"></a>
<a class="btn btn-sm btn-outline-primary" sec:authorize="hasAuthority('booking.checkout')"
 th:if="${room.s('status') == 'CHECKED_IN'}"
 th:href="@{/admin/receptionist(booking=${r.id('id')},line=${room.id('id')},action='checkout')}" th:text="#{reception.checkout}"></a>
</div><a class="btn btn-sm btn-light" th:href="@{/admin/bookings/{id}(id=${r.id('id')})}" th:text="#{reception.details}"></a></td>
</tr></tbody></table></div><nav class="d-flex gap-2 align-items-center mt-3" th:aria-label="#{ops.paging}">
  <a th:if="${previous != null}" th:href="${previous}" class="btn btn-light" th:text="#{ops.previous}"></a>
  <span class="text-muted" th:text="${(page.index + 1) + ' · ' + page.total}"></span>
  <a th:if="${next != null}" th:href="${next}" class="btn btn-light" th:text="#{ops.next}"></a>
</nav>
  </div>
</div>
</section>
<th:block id="operations-scripts"><script th:src="@{/admin/assets/static/js/cms-booking-list.js}"></script></th:block>
</body>
</html>
