<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
 th:replace="~{admin/layouts/main :: layout(#{cms.changePassword}, ~{::#cms-page}, ~{})}"><body><div id="cms-page">
 <div class="page-heading"><h3 th:text="#{cms.changePassword}"></h3></div>
<div class="card cms-form-card"><div class="card-body"><div th:if="${formError}" class="alert alert-light-danger" role="alert" th:text="${formError}"></div><p class="text-muted" th:text="#{cms.revokeWarning}"></p><form th:action="@{/admin/profile/password}" th:object="${passwordForm}" method="post"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-light-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><ul class="mb-0"><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div><div class="mb-3"><label class="form-label" for="currentPassword" th:text="#{cms.currentPassword}"></label><input id="currentPassword" name="currentPassword" type="password" class="form-control" autocomplete="current-password" maxlength="72" required></div><div class="mb-3"><label class="form-label" for="newPassword" th:text="#{cms.newPassword}"></label><input id="newPassword" name="newPassword" type="password" class="form-control" autocomplete="new-password" minlength="8" maxlength="72" required></div><div class="mb-3"><label class="form-label" for="confirmPassword" th:text="#{cms.confirmPassword}"></label><input id="confirmPassword" name="confirmPassword" type="password" class="form-control" autocomplete="new-password" maxlength="72" required></div><p class="small text-muted" th:text="#{cms.passwordHelp}"></p><div class="d-flex gap-2 justify-content-end"><a class="btn btn-light-secondary" th:href="@{/admin}" th:text="#{cms.back}"></a><button class="btn btn-primary" type="submit" th:text="#{cms.save}"></button></div></form></div></div>
</div></body></html>
