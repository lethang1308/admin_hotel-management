<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layouts/main :: layout(#{admin.users.editTitle(${targetUser.id})}, ~{::#user-edit-page}, ~{})}">
<body>
<div id="user-edit-page">
    <div class="page-heading">
        <div class="page-title">
            <div class="row">
                <div class="col-12 col-md-6 order-md-1 order-last">
                    <h3 th:text="#{admin.users.editTitle(${targetUser.id})}">Edit User</h3>
                    <p class="text-subtitle text-muted" th:text="#{admin.users.editSubtitle}">
                        Update profile details and assigned RBAC roles
                    </p>
                </div>
                <div class="col-12 col-md-6 order-md-2 order-first">
                    <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/admin}" th:text="#{admin.nav.dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/admin/users}" th:text="#{admin.nav.users}">Users</a></li>
                            <li class="breadcrumb-item active" aria-current="page"
                                th:text="'#' + ${targetUser.id}">Edit</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>

        <section id="basic-vertical-layouts">
            <div class="row">
                <div class="col-lg-8 col-12">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h4 class="card-title mb-0" th:text="#{admin.users.profileAndRoles}">Profile &amp; Role Assignment</h4>
                            <a th:href="@{/admin/users}" class="btn btn-sm btn-light-secondary">
                                <i class="bi bi-arrow-left me-1"></i> <span th:text="#{admin.btn.backToUsers}">Back to Users</span>
                            </a>
                        </div>
                        <div class="card-content">
                            <div class="card-body">
                                <div th:if="${formError}" class="alert alert-light-danger color-danger mb-4">
                                    <i class="bi bi-exclamation-circle me-2"></i>
                                    <span th:text="${formError}">Validation error</span>
                                </div>

                                <form class="form form-vertical"
                                      th:action="@{/admin/users/{id}(id=${targetUser.id})}"
                                      th:object="${userForm}"
                                      method="post">
                                    <input type="hidden" th:if="${_csrf != null}"
                                           th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                                    <div class="form-body">
                                        <div class="row">
                                            <div class="col-12">
                                                <div class="form-group has-icon-left mb-3">
                                                    <label for="fullName" class="form-label" th:text="#{admin.form.fullName}">Full Name</label>
                                                    <div class="position-relative">
                                                        <input id="fullName" type="text" class="form-control"
                                                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                                               th:field="*{fullName}" required>
                                                        <div class="form-control-icon">
                                                            <i class="bi bi-person"></i>
                                                        </div>
                                                    </div>
                                                    <div class="text-danger small mt-1"
                                                         th:if="${#fields.hasErrors('fullName')}"
                                                         th:errors="*{fullName}"></div>
                                                </div>
                                            </div>

                                            <div class="col-12">
                                                <div class="form-group has-icon-left mb-3">
                                                    <label for="email" class="form-label" th:text="#{admin.form.email}">Email Address</label>
                                                    <div class="position-relative">
                                                        <input id="email" type="email" class="form-control"
                                                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                                               th:field="*{email}" required>
                                                        <div class="form-control-icon">
                                                            <i class="bi bi-envelope"></i>
                                                        </div>
                                                    </div>
                                                    <div class="text-danger small mt-1"
                                                         th:if="${#fields.hasErrors('email')}"
                                                         th:errors="*{email}"></div>
                                                </div>
                                            </div>

                                            <div class="col-12">
                                                <div class="form-group mb-3">
                                                    <label class="form-label d-block" th:text="#{admin.form.assignedRoles}">Assigned Roles</label>
                                                    <div class="d-flex gap-4 flex-wrap pt-1">
                                                        <div class="form-check" th:each="r : ${allRoles}">
                                                            <input class="form-check-input" type="checkbox"
                                                                   th:field="*{roles}"
                                                                   th:value="${r.code}"
                                                                   th:id="${'role_' + r.code}">
                                                            <label class="form-check-label" th:for="${'role_' + r.code}">
                                                                <span class="fw-semibold" th:text="${r.code}">USER</span>
                                                                <span class="text-muted small" th:text="'(' + ${r.name} + ')'">(Standard User)</span>
                                                            </label>
                                                        </div>
                                                    </div>
                                                    <div class="text-danger small mt-1"
                                                         th:if="${#fields.hasErrors('roles')}"
                                                         th:errors="*{roles}"></div>
                                                </div>
                                            </div>

                                            <div class="col-12 d-flex justify-content-end gap-2 mt-3">
                                                <a th:href="@{/admin/users}" class="btn btn-light-secondary" th:text="#{admin.btn.cancel}">
                                                    Cancel
                                                </a>
                                                <button type="submit" class="btn btn-primary">
                                                    <i class="bi bi-check-lg me-1"></i> <span th:text="#{admin.btn.save}">Save Changes</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4 col-12">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="card-title mb-0" th:text="#{admin.users.accountSummary}">Account Summary</h4>
                        </div>
                        <div class="card-body">
                            <div class="d-flex align-items-center mb-4">
                                <div class="avatar avatar-xl">
                                    <img th:src="@{/admin/assets/static/images/faces/2.jpg}" alt="Avatar">
                                </div>
                                <div class="ms-3 overflow-hidden">
                                    <h5 class="font-bold text-truncate mb-1" th:text="${targetUser.fullName}">User</h5>
                                    <p class="text-muted text-truncate small mb-0" th:text="${targetUser.email}">user@example.com</p>
                                </div>
                            </div>

                            <ul class="list-group list-group-flush">
                                <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                                    <span class="text-muted" th:text="#{admin.users.userId}">User ID</span>
                                    <span class="fw-bold" th:text="'#' + ${targetUser.id}">#1</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                                    <span class="text-muted" th:text="#{admin.users.currentStatus}">Current Status</span>
                                    <span class="badge"
                                          th:classappend="${targetUser.status.name() == 'ACTIVE'} ? 'bg-light-success' : (${targetUser.status.name() == 'LOCKED'} ? 'bg-light-danger' : 'bg-light-secondary')"
                                          th:text="#{${'admin.status.' + targetUser.status.name()}}">ACTIVE</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                                    <span class="text-muted" th:text="#{admin.table.created}">Created (UTC)</span>
                                    <span class="small" th:text="${@dateFmt.utc(targetUser.createdAt)}">2026-11-02</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
</body>
</html>
