<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layouts/main :: layout('Edit User', ~{::section})}">
<body>
<section>
    <div class="page-toolbar">
        <h1 class="page-title" th:text="'Edit User #' + ${targetUser.id}">Edit User</h1>
        <a th:href="@{/admin/users}" class="btn btn-outline">&larr; Back to Users</a>
    </div>

    <div class="card" style="max-width:640px;">
        <div th:if="${formError}" class="alert alert-error" th:text="${formError}"></div>

        <form th:action="@{/admin/users/{id}(id=${targetUser.id})}" th:object="${userForm}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <input id="fullName" type="text" class="form-control" th:field="*{fullName}" required>
                <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input id="email" type="email" class="form-control" th:field="*{email}" required>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Assigned Roles</label>
                <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                    <label th:each="r : ${allRoles}" style="display:flex; align-items:center; gap:0.35rem;">
                        <input type="checkbox" th:field="*{roles}" th:value="${r.code}">
                        <span th:text="${r.code} + ' (' + ${r.name} + ')'">USER</span>
                    </label>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}"></div>
            </div>

            <div style="display:flex; gap:0.75rem; margin-top:1.25rem;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a th:href="@{/admin/users}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
