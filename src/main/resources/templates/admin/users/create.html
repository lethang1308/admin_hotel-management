<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layouts/main :: layout(#{admin.users.createTitle}, ~{::#user-create-page}, ~{})}">
<body>
<div id="user-create-page">
    <div class="page-heading">
        <div class="page-title">
            <div class="row">
                <div class="col-12 col-md-6 order-md-1 order-last">
                    <h3 th:text="#{admin.users.createTitle}">Create User Account</h3>
                    <p class="text-subtitle text-muted" th:text="#{admin.users.createSubtitle}">
                        Provision a new account and assign RBAC system roles
                    </p>
                </div>
                <div class="col-12 col-md-6 order-md-2 order-first">
                    <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/admin}" th:text="#{admin.nav.dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/admin/users}" th:text="#{admin.nav.users}">Users</a></li>
                            <li class="breadcrumb-item active" aria-current="page" th:text="#{admin.nav.createUser}">Create User</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>

        <section id="basic-vertical-layouts">
            <div class="row">
                <div class="col-lg-8 col-12">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h4 class="card-title mb-0" th:text="#{admin.users.accountInfo}">Account Information</h4>
                            <a th:href="@{/admin/users}" class="btn btn-sm btn-light-secondary">
                                <i class="bi bi-arrow-left me-1"></i> <span th:text="#{admin.btn.backToUsers}">Back to Users</span>
                            </a>
                        </div>
                        <div class="card-content">
                            <div class="card-body">
                                <div th:if="${formError}" class="alert alert-light-danger color-danger mb-4">
                                    <i class="bi bi-exclamation-circle me-2"></i>
                                    <span th:text="${formError}">Validation error</span>
                                </div>

                                <form class="form form-vertical" th:action="@{/admin/users}" th:object="${userForm}" method="post">
                                    <input type="hidden" th:if="${_csrf != null}"
                                           th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                                    <div class="form-body">
                                        <div class="row">
                                            <div class="col-12">
                                                <div class="form-group has-icon-left mb-3">
                                                    <label for="fullName" class="form-label" th:text="#{admin.form.fullName}">Full Name</label>
                                                    <div class="position-relative">
                                                        <input id="fullName" type="text" class="form-control"
                                                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                                               th:field="*{fullName}"
                                                               th:placeholder="#{admin.form.fullNamePlaceholder}" required>
                                                        <div class="form-control-icon">
                                                            <i class="bi bi-person"></i>
                                                        </div>
                                                    </div>
                                                    <div class="text-danger small mt-1"
                                                         th:if="${#fields.hasErrors('fullName')}"
                                                         th:errors="*{fullName}"></div>
                                                </div>
                                            </div>

                                            <div class="col-12">
                                                <div class="form-group has-icon-left mb-3">
                                                    <label for="email" class="form-label" th:text="#{admin.form.email}">Email Address</label>
                                                    <div class="position-relative">
                                                        <input id="email" type="email" class="form-control"
                                                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                                               th:field="*{email}"
                                                               th:placeholder="#{admin.form.emailPlaceholder}" required>
                                                        <div class="form-control-icon">
                                                            <i class="bi bi-envelope"></i>
                                                        </div>
                                                    </div>
                                                    <div class="text-danger small mt-1"
                                                         th:if="${#fields.hasErrors('email')}"
                                                         th:errors="*{email}"></div>
                                                </div>
                                            </div>

                                            <div class="col-12">
                                                <div class="form-group has-icon-left mb-3">
                                                    <label for="password" class="form-label" th:text="#{admin.form.password}">Password</label>
                                                    <div class="position-relative">
                                                        <input id="password" type="password" class="form-control"
                                                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                                               th:field="*{password}"
                                                               th:placeholder="#{admin.form.passwordPlaceholder}"
                                                               required>
                                                        <div class="form-control-icon">
                                                            <i class="bi bi-lock"></i>
                                                        </div>
                                                    </div>
                                                    <div class="text-danger small mt-1"
                                                         th:if="${#fields.hasErrors('password')}"
                                                         th:errors="*{password}"></div>
                                                </div>
                                            </div>

                                            <div class="col-12 col-md-6">
                                                <div class="form-group mb-3">
                                                    <label for="status" class="form-label" th:text="#{admin.form.initialStatus}">Initial Account Status</label>
                                                    <select id="status" class="form-select" th:field="*{status}">
                                                        <option th:each="st : ${statuses}"
                                                                th:value="${st}"
                                                                th:text="#{${'admin.status.' + st.name()}}"></option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div class="col-12">
                                                <div class="form-group mb-3">
                                                    <label class="form-label d-block" th:text="#{admin.form.assignedRoles}">Assigned Roles</label>
                                                    <div class="d-flex gap-4 flex-wrap pt-1">
                                                        <div class="form-check" th:each="r : ${allRoles}">
                                                            <input class="form-check-input" type="checkbox"
                                                                   th:field="*{roles}"
                                                                   th:value="${r.code}"
                                                                   th:id="${'role_' + r.code}">
                                                            <label class="form-check-label" th:for="${'role_' + r.code}">
                                                                <span class="fw-semibold" th:text="${r.code}">USER</span>
                                                                <span class="text-muted small" th:text="'(' + ${r.name} + ')'">(Standard User)</span>
                                                            </label>
                                                        </div>
                                                    </div>
                                                    <div class="text-danger small mt-1"
                                                         th:if="${#fields.hasErrors('roles')}"
                                                         th:errors="*{roles}"></div>
                                                </div>
                                            </div>

                                            <div class="col-12 d-flex justify-content-end gap-2 mt-3">
                                                <a th:href="@{/admin/users}" class="btn btn-light-secondary" th:text="#{admin.btn.cancel}">
                                                    Cancel
                                                </a>
                                                <button type="submit" class="btn btn-primary">
                                                    <i class="bi bi-check-lg me-1"></i> <span th:text="#{admin.btn.create}">Create User</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
</body>
</html>
