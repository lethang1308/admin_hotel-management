<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layouts/main :: layout('User Management', ~{::section})}">
<body>
<section>
    <div class="page-toolbar">
        <div>
            <h1 class="page-title">User Management</h1>
            <p style="margin:0.25rem 0 0 0; color:var(--text-muted); font-size:0.9rem;">
                Search, filter, assign roles, and control user account status
            </p>
        </div>
        <a th:href="@{/admin/users/create}" class="btn btn-primary">+ Create User</a>
    </div>

    <div class="card">
        <form th:action="@{/admin/users}" method="get" class="filter-bar">
            <input type="text" name="search" class="form-control" placeholder="Search name or email..."
                   th:value="${search}">

            <select name="status" class="form-control">
                <option value="">All Statuses</option>
                <option th:each="st : ${statuses}"
                        th:value="${st}"
                        th:text="${st}"
                        th:selected="${selectedStatus == st}"></option>
            </select>

            <select name="role" class="form-control">
                <option value="">All Roles</option>
                <option th:each="r : ${allRoles}"
                        th:value="${r.code}"
                        th:text="${r.code}"
                        th:selected="${selectedRole != null and selectedRole.equalsIgnoreCase(r.code)}"></option>
            </select>

            <button type="submit" class="btn btn-primary">Filter</button>
            <a th:href="@{/admin/users}" class="btn btn-outline">Reset</a>
        </form>

        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Roles</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(userPage.items)}">
                    <td colspan="7" style="text-align:center; color:var(--text-muted);">
                        No matching users found.
                    </td>
                </tr>
                <tr th:each="u : ${userPage.items}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.fullName}">User</td>
                    <td th:text="${u.email}">user@example.com</td>
                    <td>
                        <span th:each="r : ${u.roles}" class="badge badge-role" th:text="${r}">USER</span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${u.status.name() == 'ACTIVE'} ? 'badge-active' : (${u.status.name() == 'LOCKED'} ? 'badge-locked' : 'badge-inactive')"
                              th:text="${u.status}">ACTIVE</span>
                    </td>
                    <td th:text="${@dateFmt.utc(u.createdAt)}">2026-11-02</td>
                    <td style="display:flex; gap:0.4rem; flex-wrap:wrap;">
                        <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-outline btn-sm">Edit</a>

                        <form th:if="${u.status.name() == 'ACTIVE'}"
                              th:action="@{/admin/users/{id}/status(id=${u.id})}"
                              method="post"
                              data-confirm="Deactivate this user account?"
                              style="margin:0;">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="status" value="INACTIVE"/>
                            <button type="submit" class="btn btn-danger-outline btn-sm">Deactivate</button>
                        </form>

                        <form th:if="${u.status.name() != 'ACTIVE'}"
                              th:action="@{/admin/users/{id}/status(id=${u.id})}"
                              method="post"
                              style="margin:0;">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="status" value="ACTIVE"/>
                            <button type="submit" class="btn btn-outline btn-sm">Activate</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${userPage.totalPages > 0}">
            <span>
                Page <strong th:text="${userPage.page + 1}">1</strong> of
                <strong th:text="${userPage.totalPages}">1</strong>
                (<span th:text="${userPage.totalElements}">0</span> total users)
            </span>
            <div style="display:flex; gap:0.5rem;">
                <a th:if="${userPage.hasPrevious}"
                   th:href="@{/admin/users(page=${userPage.page - 1}, size=${userPage.size}, sort=${sort}, search=${search}, status=${selectedStatus}, role=${selectedRole})}"
                   class="btn btn-outline btn-sm">&laquo; Previous</a>
                <a th:if="${userPage.hasNext}"
                   th:href="@{/admin/users(page=${userPage.page + 1}, size=${userPage.size}, sort=${sort}, search=${search}, status=${selectedStatus}, role=${selectedRole})}"
                   class="btn btn-outline btn-sm">Next &raquo;</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
