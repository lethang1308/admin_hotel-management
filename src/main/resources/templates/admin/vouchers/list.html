<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{price.vouchers.title},~{::#pricing-page},~{::#pricing-scripts})}"><body><div id="pricing-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{price.workspace}"></p><h3 th:text="#{price.vouchers.title}"></h3><p class="text-muted mb-0" th:text="#{price.vouchers.title.subtitle}"></p></div><div class="d-flex flex-wrap gap-2"><a class="btn btn-primary" th:href="@{/admin/vouchers/create}" th:text="#{price.voucher.add}"></a></div></div><div class="card"><div class="card-body"><form class="row g-3 align-items-end mb-4" method="get" th:action="@{/admin/vouchers}"><div class="col-md"><label class="form-label" for="search" th:text="#{cms.search}"></label><input class="form-control" id="search" name="search" th:value="${search}" maxlength="150"></div><div class="col-md"><label class="form-label" for="active" th:text="#{cms.status}"></label><select class="form-select" id="active" name="active"><option value="" th:text="#{cms.all}"></option><option value="true" th:selected="${active==true}" th:text="#{price.active}"></option><option value="false" th:selected="${active==false}" th:text="#{price.inactive}"></option></select></div><div class="col-md"><label class="form-label" for="discountType" th:text="#{price.discountType}"></label><select class="form-select" id="discountType" name="discountType"><option value="" th:text="#{cms.all}"></option><option th:each="t:${discountTypes}" th:value="${t}" th:selected="${t==discountType}" th:text="#{${'price.valueType.'+t.name()}}"></option></select></div><div class="col-md"><label class="form-label" for="validity" th:text="#{price.validity}"></label><select class="form-select" id="validity" name="validity"><option value="" th:text="#{cms.all}"></option><option th:each="v:${ {'CURRENT','UPCOMING','EXPIRED'} }" th:value="${v}" th:selected="${v==validity}" th:text="#{${'price.validity.'+v}}"></option></select></div><div class="col-md-auto"><button class="btn btn-primary" th:text="#{cms.filter}"></button></div></form><div class="table-responsive"><table class="table align-middle"><thead><tr><th th:text="#{price.voucher}"></th><th th:text="#{price.discountValue}"></th><th th:text="#{price.period}"></th><th th:text="#{price.quota}"></th><th th:text="#{cms.status}"></th><th th:text="#{cms.actions}"></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(rows)}"><td colspan="6" class="text-muted text-center py-5" th:text="#{cms.empty}"></td></tr><tr th:each="v:${rows}"><td><strong th:text="${v.form.code}"></strong><small class="d-block text-muted" th:text="${v.form.name}"></small></td><td><span th:text="${#numbers.formatDecimal(v.form.discountValue,0,'COMMA',0,'POINT')}"></span><small th:text="${v.form.discountType.name()=='PERCENT'?' %':' VND'}"></small><small class="d-block text-muted" th:if="${v.form.maxDiscountAmount}" th:text="#{price.capLabel(${#numbers.formatDecimal(v.form.maxDiscountAmount,0,'COMMA',0,'POINT')})}"></small></td><td class="small"><div th:text="${#temporals.format(v.form.startsAt,'dd/MM/yyyy HH:mm')}"></div><div th:text="${#temporals.format(v.form.expiresAt,'dd/MM/yyyy HH:mm')}"></div></td><td><small class="d-block" th:text="#{price.voucherCounts(${v.reserved},${v.redeemed},${v.released})}"></small><span th:text="#{price.remainingLabel(${v.remaining==null?'∞':v.remaining})}"></span><div class="progress mt-2" th:if="${v.form.maxUses != null}" style="height:5px"><div class="progress-bar" th:style="'width:'+${v.usagePercent}+'%'" role="progressbar" th:attr="aria-valuenow=${v.reserved+v.redeemed},aria-valuemin=0,aria-valuemax=${v.form.maxUses},aria-label=#{price.quota}"></div></div></td><td><span class="badge" th:classappend="${v.form.active?'bg-light-success':'bg-light-secondary'}" th:text="${v.form.active}?#{price.active}:#{price.inactive}"></span></td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/vouchers/{id}/edit(id=${v.id})}" th:text="#{cms.edit}"></a><form method="post" th:action="@{/admin/vouchers/{id}/toggle(id=${v.id})}"><button class="btn btn-sm btn-light" th:text="${v.form.active}?#{price.disable}:#{price.enable}"></button></form><form method="post" th:action="@{/admin/vouchers/{id}/delete(id=${v.id})}" data-pricing-confirm th:attr="data-confirm-message=#{hotel.confirmDelete}"><button class="btn btn-sm btn-outline-danger" th:disabled="${v.used}" th:text="#{hotel.delete}"></button></form></div></td></tr></tbody></table></div></div></div></div><th:block id="pricing-scripts"><script th:src="@{/admin/assets/static/js/cms-pricing.js}"></script></th:block></body></html>
