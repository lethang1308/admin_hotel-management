<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{price.vouchers.title},~{::#pricing-page},~{::#pricing-scripts})}"><body><div id="pricing-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{price.workspace}"></p><h3 th:text="#{price.vouchers.title}"></h3><p class="text-muted mb-0" th:text="#{price.vouchers.title.subtitle}"></p></div><div class="d-flex flex-wrap gap-2"><a class="btn btn-light" th:href="@{/admin/vouchers}" th:text="#{price.back}"></a></div></div><div class="card"><div class="card-body"><form method="post" th:action="@{${formAction}}" th:object="${form}"><div class="alert alert-light-danger" th:if="${formError}" th:text="${formError}"></div><div th:if="${#fields.hasErrors('*')}" class="alert alert-light-danger"><ul class="mb-0"><li th:each="err:${#fields.errors('*')}" th:text="${err}"></li></ul></div><div class="alert alert-light-warning" th:if="${used}" th:text="#{price.voucherUsedHint}"></div><div th:if="${used}" class="pricing-used-summary mb-4"><strong th:text="${form.code}+' · '+${form.name}"></strong><p class="mb-0"><span th:text="${form.discountValue}"></span> <span th:text="${form.discountType.name()=='PERCENT'?'%':'VND'}"></span></p><small th:text="#{price.voucherCounts(${target.reserved},${target.redeemed},${target.released})}"></small></div><fieldset th:classappend="${used}?'d-none':''"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="code" th:text="#{price.code}"></label><input id="code" class="form-control" type="text" th:field="*{code}" required pattern="[A-Za-z0-9_-]+" maxlength="50" th:readonly="${targetId != null}"><small class="text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></small></div><div class="col-md-6"><label class="form-label" for="name" th:text="#{price.name}"></label><input id="name" class="form-control" type="text" th:field="*{name}" required maxlength="150"><small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small></div><div class="col-12"><label class="form-label" for="description" th:text="#{price.description}"></label><textarea id="description" class="form-control" th:field="*{description}" rows="3" maxlength="20000"></textarea><small class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small></div><div class="col-md-6"><label class="form-label" for="discountType" th:text="#{price.discountType}"></label><select id="discountType" class="form-select" th:field="*{discountType}" required><option th:each="o:${discountTypes}" th:value="${o}" th:text="#{${'price.valueType.'+o.name()}}"></option></select></div><div class="col-md-6"><label class="form-label" for="discountValue" th:text="#{price.discountValue}"></label><input id="discountValue" class="form-control" type="number" th:field="*{discountValue}" required min="0.01" step="0.01"><small class="text-danger" th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}"></small></div><div class="col-md-6"><label class="form-label" for="maxDiscountAmount" th:text="#{price.maxDiscountAmount}"></label><input id="maxDiscountAmount" class="form-control" type="number" th:field="*{maxDiscountAmount}" min="0.01" step="0.01"><small class="text-danger" th:if="${#fields.hasErrors('maxDiscountAmount')}" th:errors="*{maxDiscountAmount}"></small></div><div class="col-md-6"><label class="form-label" for="minRoomSubtotal" th:text="#{price.minSubtotal}"></label><input id="minRoomSubtotal" class="form-control" type="number" th:field="*{minRoomSubtotal}" required min="0" step="0.01"><small class="text-danger" th:if="${#fields.hasErrors('minRoomSubtotal')}" th:errors="*{minRoomSubtotal}"></small></div><div class="col-md-6"><label class="form-label" for="startsAt" th:text="#{price.startsAt}"></label><input id="startsAt" class="form-control" type="datetime-local" th:field="*{startsAt}" required step="1"><small class="text-danger" th:if="${#fields.hasErrors('startsAt')}" th:errors="*{startsAt}"></small></div><div class="col-md-6"><label class="form-label" for="maxUsesPerCustomer" th:text="#{price.maxUsesPerCustomer}"></label><input id="maxUsesPerCustomer" class="form-control" type="number" th:field="*{maxUsesPerCustomer}" required min="1"><small class="text-danger" th:if="${#fields.hasErrors('maxUsesPerCustomer')}" th:errors="*{maxUsesPerCustomer}"></small></div><div class="col-md-6"><label class="form-label" for="stayFrom" th:text="#{price.stayFrom}"></label><input id="stayFrom" class="form-control" type="date" th:field="*{stayFrom}" ><small class="text-danger" th:if="${#fields.hasErrors('stayFrom')}" th:errors="*{stayFrom}"></small></div><div class="col-md-6"><label class="form-label" for="stayUntil" th:text="#{price.stayUntil}"></label><input id="stayUntil" class="form-control" type="date" th:field="*{stayUntil}" ><small class="text-danger" th:if="${#fields.hasErrors('stayUntil')}" th:errors="*{stayUntil}"></small></div><div class="col-md-6"><div class="form-check mt-3"><input id="combinableWithLengthDiscount" class="form-check-input" type="checkbox" th:field="*{combinableWithLengthDiscount}"><label for="combinableWithLengthDiscount" class="form-check-label" th:text="#{price.combinable}"></label></div></div><div class="col-12"><div class="d-flex justify-content-between align-items-center mb-2"><h6 class="mb-0" th:text="#{price.roomTypes}"></h6><button type="button" class="btn btn-light btn-sm" data-all-types th:text="#{price.selectAll}"></button></div><p class="small text-muted" th:text="#{price.voucherTypesHint}"></p><div class="row g-2"><div class="col-md-4" th:each="t:${types}"><div class="form-check"><input type="checkbox" class="form-check-input pricing-type-checkbox" th:field="*{roomTypeIds}" th:value="${t.id}" th:disabled="${!t.active and !form.roomTypeIds.contains(t.id)}"><label class="form-check-label" th:for="${#ids.prev('roomTypeIds')}"><span th:text="${t.name}"></span> <small th:unless="${t.active}" th:text="#{hotel.inactive}"></small></label></div></div></div></div></div></fieldset><div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label" for="expiresAt" th:text="#{price.expiresAt}"></label><input id="expiresAt" class="form-control" type="datetime-local" th:field="*{expiresAt}" required step="1"><small class="text-danger" th:if="${#fields.hasErrors('expiresAt')}" th:errors="*{expiresAt}"></small></div><div class="col-md-6"><label class="form-label" for="maxUses" th:text="#{price.maxUses}"></label><input id="maxUses" class="form-control" type="number" th:field="*{maxUses}" min="1"><small class="text-danger" th:if="${#fields.hasErrors('maxUses')}" th:errors="*{maxUses}"></small></div><div class="col-md-6"><div class="form-check mt-3"><input id="active" class="form-check-input" type="checkbox" th:field="*{active}"><label for="active" class="form-check-label" th:text="#{price.active}"></label></div></div><div class="col-12"><p class="hotel-note mb-0"><span th:text="#{price.zone}"></span>: <strong th:text="${hotelZone}"></strong>. <span th:text="#{price.voucherHint}"></span></p></div><div class="col-12 d-flex gap-2 mt-4"><button class="btn btn-primary" th:text="#{cms.save}"></button><a class="btn btn-light" th:href="@{/admin/vouchers}" th:text="#{price.back}"></a></div></div></form></div></div></div><th:block id="pricing-scripts"><script th:src="@{/admin/assets/static/js/cms-pricing.js}"></script></th:block></body></html>
