<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{hotel.settings.title}, ~{::#hotel-page}, ~{})}"><body><div id="hotel-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{hotel.workspace}"></p><h3 th:text="#{hotel.settings.title}"></h3><p class="text-muted mb-0" th:text="#{hotel.settings.subtitle}"></p></div><div class="d-flex gap-2 flex-wrap"></div></div><div class="card"><div class="card-body"><form method="post" enctype="multipart/form-data" th:action="@{/admin/hotel}" th:object="${form}"><div class="alert alert-light-danger" th:if="${formError}" th:text="${formError}"></div><div class="alert alert-light-danger" th:if="${#fields.hasErrors('*')}"><ul class="mb-0"><li th:each="err:${#fields.errors('*')}" th:text="${err}"></li></ul></div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name" th:text="#{hotel.name}"></label><input class="form-control" type="text" id="name" th:field="*{name}" required maxlength="200"><small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small></div><div class="col-md-6"><label class="form-label" for="hotline" th:text="#{hotel.hotline}"></label><input class="form-control" type="text" id="hotline" th:field="*{hotline}" maxlength="30"><small class="text-danger" th:if="${#fields.hasErrors('hotline')}" th:errors="*{hotline}"></small></div><div class="col-md-6"><label class="form-label" for="email" th:text="#{hotel.email}"></label><input class="form-control" type="email" id="email" th:field="*{email}" maxlength="150"><small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small></div><div class="col-md-6"><label class="form-label" for="address" th:text="#{hotel.address}"></label><input class="form-control" type="text" id="address" th:field="*{address}" required maxlength="500"><small class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></small></div><div class="col-12"><label class="form-label" for="description" th:text="#{hotel.description}"></label><textarea class="form-control" rows="4" id="description" th:field="*{description}" ></textarea><small class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small></div><div class="col-md-6"><label class="form-label" for="logoUrl" th:text="#{hotel.logoUrl}"></label><input class="form-control" type="text" id="logoUrl" th:field="*{logoUrl}" maxlength="500"><small class="text-danger" th:if="${#fields.hasErrors('logoUrl')}" th:errors="*{logoUrl}"></small></div><div class="col-md-6"><label class="form-label" for="logo" th:text="#{hotel.logoUpload}"></label><input type="file" id="logo" name="logo" class="form-control" accept="image/png,image/jpeg"><small class="text-muted" th:text="#{hotel.imageHint}"></small></div><div class="col-12" th:if="${form.logoUrl != null and !form.logoUrl.isBlank()}"><img class="hotel-logo-preview" th:src="${form.logoUrl}" th:alt="${form.name}" referrerpolicy="no-referrer"></div><div class="col-md-6"><label class="form-label" for="standardCheckIn" th:text="#{hotel.checkIn}"></label><input class="form-control" type="time" id="standardCheckIn" th:field="*{standardCheckIn}" required><small class="text-danger" th:if="${#fields.hasErrors('standardCheckIn')}" th:errors="*{standardCheckIn}"></small></div><div class="col-md-6"><label class="form-label" for="standardCheckOut" th:text="#{hotel.checkOut}"></label><input class="form-control" type="time" id="standardCheckOut" th:field="*{standardCheckOut}" required><small class="text-danger" th:if="${#fields.hasErrors('standardCheckOut')}" th:errors="*{standardCheckOut}"></small></div><div class="col-md-6"><label class="form-label" for="bookingHoldMinutes" th:text="#{hotel.holdMinutes}"></label><input class="form-control" type="number" id="bookingHoldMinutes" th:field="*{bookingHoldMinutes}" required min="1" max="1440"><small class="text-danger" th:if="${#fields.hasErrors('bookingHoldMinutes')}" th:errors="*{bookingHoldMinutes}"></small></div><div class="col-md-6"><label class="form-label" for="defaultTaxPercent" th:text="#{hotel.tax}"></label><input class="form-control" type="number" id="defaultTaxPercent" th:field="*{defaultTaxPercent}" required min="0" max="100" step="0.01"><small class="text-danger" th:if="${#fields.hasErrors('defaultTaxPercent')}" th:errors="*{defaultTaxPercent}"></small></div><div class="col-md-6"><label class="form-label" for="defaultDepositPolicyId" th:text="#{hotel.depositPolicy}"></label><select class="form-select" id="defaultDepositPolicyId" th:field="*{defaultDepositPolicyId}" required><option th:each="o:${depositPolicies}" th:value="${o.id}" th:text="${o.name}"></option></select></div><div class="col-md-6"><label class="form-label" for="defaultCancellationPolicyId" th:text="#{hotel.cancellationPolicy}"></label><select class="form-select" id="defaultCancellationPolicyId" th:field="*{defaultCancellationPolicyId}" required><option th:each="o:${cancellationPolicies}" th:value="${o.id}" th:text="${o.name}"></option></select></div><div class="col-12"><div class="hotel-note"><span th:text="#{hotel.timezone}"></span>: <strong th:text="${hotel.timezone}"></strong> · <span th:text="#{hotel.currency}"></span>: <strong th:text="${hotel.currency}"></strong></div></div><div class="col-12 d-flex gap-2 mt-4"><button class="btn btn-primary" th:text="#{cms.save}"></button><a class="btn btn-light" th:href="@{/admin}" th:text="#{hotel.back}"></a></div></div></form></div></div></div></body></html>
