<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
 th:replace="~{admin/layouts/main :: layout(#{cms.employees.edit}, ~{::#cms-page}, ~{})}"><body><div id="cms-page">
 <div class="page-heading"><h3 th:text="#{cms.employees.edit}"></h3></div>
<div th:if="${formError}" class="alert alert-light-danger" role="alert" th:text="${formError}"></div>
<div class="d-flex gap-3 flex-wrap align-items-center mb-4"><span class="badge bg-light-primary" th:text="${target.employeeCode}"></span><span class="badge bg-light-secondary" th:text="#{${'admin.status.' + target.status.name()}}"></span><span class="text-muted small" th:text="#{cms.lastLoginValue(${@dateFmt.local(target.lastLoginAt)})}"></span></div>
<div class="row"><div class="col-xl-7"><div class="card"><div class="card-body"><form th:action="@{/admin/employees/{id}(id=${target.id})}" th:object="${employeeForm}" method="post"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-light-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><ul class="mb-0"><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div><div class="mb-3"><label class="form-label" for="employeeCode" th:text="#{cms.employeeCode}"></label><input class="form-control" id="employeeCode" type="text" th:field="*{employeeCode}" maxlength="30" th:classappend="${#fields.hasErrors('employeeCode')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('employeeCode')}" th:errors="*{employeeCode}"></div></div><p class="small text-muted" th:text="#{cms.autoCode}"></p><div class="mb-3"><label class="form-label" for="fullName" th:text="#{cms.fullName}"></label><input class="form-control" id="fullName" type="text" th:field="*{fullName}" required maxlength="120" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div></div><div class="mb-3"><label class="form-label" for="email" th:text="#{cms.email}"></label><input class="form-control" id="email" type="email" th:field="*{email}" required maxlength="150" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div></div><div class="mb-3"><label class="form-label" for="phone" th:text="#{cms.phone}"></label><input class="form-control" id="phone" type="tel" th:field="*{phone}" maxlength="20" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div></div><div class="mb-3"><label class="form-label" for="position" th:text="#{cms.position}"></label><input class="form-control" id="position" type="text" th:field="*{position}" maxlength="100" th:classappend="${#fields.hasErrors('position')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('position')}" th:errors="*{position}"></div></div><div class="row"><div class="col-md-6"><div class="mb-3"><label class="form-label" for="hiredOn" th:text="#{cms.hiredOn}"></label><input class="form-control" id="hiredOn" type="date" th:field="*{hiredOn}"  th:classappend="${#fields.hasErrors('hiredOn')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('hiredOn')}" th:errors="*{hiredOn}"></div></div></div><div class="col-md-6"><div class="mb-3"><label class="form-label" for="endedOn" th:text="#{cms.endedOn}"></label><input class="form-control" id="endedOn" type="date" th:field="*{endedOn}"  th:classappend="${#fields.hasErrors('endedOn')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('endedOn')}" th:errors="*{endedOn}"></div></div></div></div><div class="mb-3"><label class="form-label" for="reason" th:text="#{cms.reason}"></label><input class="form-control" id="reason" type="text" th:field="*{reason}" maxlength="1000" th:classappend="${#fields.hasErrors('reason')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></div></div><div class="d-flex gap-2 justify-content-end"><a class="btn btn-light-secondary" th:href="@{/admin/employees}" th:text="#{cms.back}"></a><button class="btn btn-primary" type="submit" th:text="#{cms.save}"></button></div></form></div></div></div>
<div class="col-xl-5"><div class="card"><div class="card-header"><h4 th:text="#{cms.accountStatus}"></h4></div><div class="card-body"><form th:action="@{/admin/employees/{id}/status(id=${target.id})}" th:object="${statusForm}" method="post"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-light-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><ul class="mb-0"><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div>
<div class="mb-3"><label class="form-label" for="status" th:text="#{cms.status}"></label><select id="status" th:field="*{status}" class="form-select"><option th:each="s:${statuses}" th:value="${s}" th:text="#{${'admin.status.' + s.name()}}"></option></select></div>
<div class="mb-3"><label class="form-label" for="lockedUntil" th:text="#{cms.lockedUntil}"></label><input class="form-control" id="lockedUntil" type="datetime-local" th:field="*{lockedUntil}"  th:classappend="${#fields.hasErrors('lockedUntil')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('lockedUntil')}" th:errors="*{lockedUntil}"></div></div><p class="small text-muted" th:text="#{cms.lockHelp}"></p><div class="mb-3"><label class="form-label" for="statusReason" th:text="#{cms.reason}"></label><input id="statusReason" name="reason" class="form-control" maxlength="1000" required></div><button class="btn btn-outline-danger" th:text="#{cms.updateStatus}"></button></form></div></div>
<div class="card" sec:authorize="hasRole('ADMIN')"><div class="card-header"><h4 th:text="#{cms.resetPassword}"></h4></div><div class="card-body"><p class="small text-muted" th:text="#{cms.revokeWarning}"></p><form th:action="@{/admin/employees/{id}/password(id=${target.id})}" th:object="${passwordForm}" method="post"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-light-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><ul class="mb-0"><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div><div class="mb-3"><label class="form-label" for="newPassword" th:text="#{cms.newPassword}"></label><input id="newPassword" name="newPassword" type="password" class="form-control" autocomplete="new-password" minlength="8" maxlength="72" required></div><div class="mb-3"><label class="form-label" for="confirmPassword" th:text="#{cms.confirmPassword}"></label><input id="confirmPassword" name="confirmPassword" type="password" class="form-control" autocomplete="new-password" maxlength="72" required></div><p class="small text-muted" th:text="#{cms.passwordHelp}"></p><div class="mb-3"><label for="resetReason" class="form-label" th:text="#{cms.reason}"></label><input id="resetReason" name="reason" class="form-control" maxlength="1000" required></div><div class="d-flex gap-2 flex-wrap"><button type="button" class="btn btn-light-secondary" data-generate-password th:text="#{cms.generatePassword}"></button><button class="btn btn-outline-danger" th:text="#{cms.resetPassword}"></button></div><output class="d-block mt-3 text-break" aria-live="polite" data-generated-password></output></form></div></div>
</div></div>
</div></body></html>
