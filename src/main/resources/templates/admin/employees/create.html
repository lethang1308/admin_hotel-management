<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
 th:replace="~{admin/layouts/main :: layout(#{cms.employees.create}, ~{::#cms-page}, ~{})}"><body><div id="cms-page">
 <div class="page-heading"><h3 th:text="#{cms.employees.create}"></h3></div>
<div class="card cms-form-card"><div class="card-body"><div th:if="${formError}" class="alert alert-light-danger" role="alert" th:text="${formError}"></div><form th:action="@{/admin/employees}" th:object="${employeeForm}" method="post"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-light-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><ul class="mb-0"><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div><div class="mb-3"><label class="form-label" for="employeeCode" th:text="#{cms.employeeCode}"></label><input class="form-control" id="employeeCode" type="text" th:field="*{employeeCode}" maxlength="30" th:classappend="${#fields.hasErrors('employeeCode')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('employeeCode')}" th:errors="*{employeeCode}"></div></div><p class="small text-muted" th:text="#{cms.autoCode}"></p><div class="mb-3"><label class="form-label" for="fullName" th:text="#{cms.fullName}"></label><input class="form-control" id="fullName" type="text" th:field="*{fullName}" required maxlength="120" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div></div><div class="mb-3"><label class="form-label" for="email" th:text="#{cms.email}"></label><input class="form-control" id="email" type="email" th:field="*{email}" required maxlength="150" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div></div><div class="mb-3"><label class="form-label" for="phone" th:text="#{cms.phone}"></label><input class="form-control" id="phone" type="tel" th:field="*{phone}" maxlength="20" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div></div><div class="mb-3"><label class="form-label" for="position" th:text="#{cms.position}"></label><input class="form-control" id="position" type="text" th:field="*{position}" maxlength="100" th:classappend="${#fields.hasErrors('position')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('position')}" th:errors="*{position}"></div></div><div class="row"><div class="col-md-6"><div class="mb-3"><label class="form-label" for="hiredOn" th:text="#{cms.hiredOn}"></label><input class="form-control" id="hiredOn" type="date" th:field="*{hiredOn}"  th:classappend="${#fields.hasErrors('hiredOn')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('hiredOn')}" th:errors="*{hiredOn}"></div></div></div><div class="col-md-6"><div class="mb-3"><label class="form-label" for="endedOn" th:text="#{cms.endedOn}"></label><input class="form-control" id="endedOn" type="date" th:field="*{endedOn}"  th:classappend="${#fields.hasErrors('endedOn')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('endedOn')}" th:errors="*{endedOn}"></div></div></div></div><div class="mb-3"><label class="form-label" for="password" th:text="#{cms.initialPassword}"></label><input id="password" name="password" type="password" class="form-control" autocomplete="new-password" minlength="8" maxlength="72" required><div class="form-text" th:text="#{cms.passwordHelp}"></div></div><p class="small text-muted" th:text="#{cms.receptionistDefault}"></p><div class="d-flex gap-2 justify-content-end"><a class="btn btn-light-secondary" th:href="@{/admin/employees}" th:text="#{cms.back}"></a><button class="btn btn-primary" type="submit" th:text="#{cms.save}"></button></div></form></div></div>
</div></body></html>
