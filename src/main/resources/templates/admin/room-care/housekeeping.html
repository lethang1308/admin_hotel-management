<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{care.housekeeping},~{::#care-page},~{})}"><body><section id="care-page">
<div class="hotel-heading mb-4"><div><p class="hotel-eyebrow" th:text="#{reception.title}"></p><h3 th:text="#{care.housekeeping}"></h3></div><a class="btn btn-outline-primary" th:href="@{/admin/rooms/grid}" th:text="#{hotel.grid.title}"></a></div>
<div class="d-flex flex-wrap gap-2 mb-4"><a class="btn btn-light" th:href="@{/admin/receptionist/housekeeping}" th:text="#{care.activeTasks}"></a><a class="btn btn-light" th:each="s:${ {'PENDING','IN_PROGRESS','COMPLETED','VERIFIED','CANCELLED'}}" th:href="@{/admin/receptionist/housekeeping(status=${s})}" th:classappend="${selectedStatus==s}?'btn-primary'" th:text="#{${'care.'+s}}"></a></div>
<div class="card card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th th:text="#{reception.room}"></th><th th:text="#{ops.status}"></th><th th:text="#{care.cleaner}"></th><th th:text="#{care.times}"></th><th th:text="#{ops.notes}"></th><th th:text="#{ops.actions}"></th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(tasks)}"><td colspan="6" th:text="#{reception.emptyQueue}"></td></tr>
<tr th:each="t:${tasks}"><td><a th:href="@{/admin/rooms/{id}(id=${t.id('room_id')})}" th:text="${t.s('room_number')}"></a><small class="d-block" th:text="#{${'care.'+t.s('task_kind')}}"></small><span th:if="${t.s('priority')=='HIGH'}" class="badge bg-light-danger" th:text="#{care.HIGH}"></span></td><td><span class="badge bg-light-primary" th:text="#{${'care.'+t.s('status')}}"></span></td>
<td th:text="${t.s('cleaner') ?: '—'}"></td><td class="small"><span th:text="${t.time('started_at')}"></span><br><span th:text="${t.time('completed_at')}"></span><br><span th:text="${t.time('verified_at')}"></span><small class="d-block text-muted">UTC</small></td><td style="max-width:280px;white-space:pre-wrap" th:text="${t.s('notes')}"></td>
<td sec:authorize="hasAuthority('room.status.update')"><form method="post" th:if="${ {'PENDING','IN_PROGRESS','COMPLETED'}.contains(t.s('status'))}" th:with="action=${t.s('status')=='PENDING'?'start':t.s('status')=='IN_PROGRESS'?'complete':'verify'}" th:action="@{/admin/receptionist/housekeeping/{id}/{action}(id=${t.id('id')},action=${action})}"><label class="form-label small"><span th:text="#{ops.reason}"></span><input class="form-control form-control-sm" name="reason" maxlength="500" required></label><button class="btn btn-sm btn-primary" th:text="#{${'care.'+action}}"></button></form></td></tr>
</tbody></table></div><p class="text-muted small" th:text="#{care.housekeepingHint}"></p></div></section></body></html>
