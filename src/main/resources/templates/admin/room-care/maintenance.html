<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{care.maintenance},~{::#care-page},~{})}"><body><section id="care-page">
<div class="hotel-heading mb-4"><div><p class="hotel-eyebrow" th:text="#{reception.title}"></p><h3 th:text="#{care.maintenance}"></h3></div><a class="btn btn-outline-primary" th:href="@{/admin/rooms/grid}" th:text="#{hotel.grid.title}"></a></div>
<details class="card card-body mb-4" th:open="${selectedRoom!=null}"><summary class="fw-semibold" th:text="#{care.report}"></summary>
<form class="pt-3" method="post" th:action="@{/admin/maintenance}"><input type="hidden" name="key" th:value="${requestKey}">
<div class="booking-input-grid"><label class="form-label"><span th:text="#{reception.room}"></span><select name="room" class="form-select" required><option th:each="r:${rooms}" th:value="${r.id('id')}" th:selected="${selectedRoom==r.id('id')}" th:text="${r.s('room_number')+' · '+r.s('status')}"></option></select></label><label class="form-label"><span th:text="#{care.priority}"></span><select name="priority" class="form-select"><option th:each="p:${ {'LOW','NORMAL','HIGH','URGENT'}}" th:value="${p}" th:selected="${p=='NORMAL'}" th:text="#{${'care.'+p}}"></option></select></label></div>
<label class="form-label d-block"><span th:text="#{care.faultTitle}"></span><input name="title" class="form-control" maxlength="200" required></label><label class="form-label d-block"><span th:text="#{care.description}"></span><textarea name="description" class="form-control" maxlength="5000" rows="3"></textarea></label>
<fieldset class="border rounded p-3 mb-3" sec:authorize="hasAuthority('room.status.update')"><label class="form-check-label"><input type="checkbox" name="block" value="true" class="form-check-input me-2"><span th:text="#{care.blockRoom}"></span></label>
<div class="booking-input-grid mt-3"><label class="form-label"><span th:text="#{ops.from}"></span><input class="form-control" type="date" name="from" th:value="${today}" th:min="${today}"></label><label class="form-label"><span th:text="#{ops.until}"></span><input class="form-control" type="date" name="until" th:value="${today.plusDays(1)}" th:min="${today.plusDays(1)}"></label></div><label class="form-label d-block"><span th:text="#{hotel.reason}"></span><input name="reason" class="form-control" maxlength="500"></label><small th:text="#{care.blockHint}" class="text-muted"></small></fieldset>
<button class="btn btn-primary" th:text="#{care.report}"></button></form></details>
<div class="d-flex flex-wrap gap-2 mb-3"><a class="btn btn-light" th:href="@{/admin/maintenance}" th:text="#{care.activeTasks}"></a><a class="btn btn-light" th:each="s:${ {'OPEN','IN_PROGRESS','RESOLVED','CANCELLED'}}" th:href="@{/admin/maintenance(status=${s})}" th:classappend="${selectedStatus==s}?'btn-primary'" th:text="#{${'care.'+s}}"></a></div>
<div class="card card-body"><p th:if="${#lists.isEmpty(requests)}" th:text="#{reception.emptyQueue}"></p><article class="border rounded p-3 mb-3" th:each="r:${requests}">
<div class="d-flex justify-content-between flex-wrap gap-2"><h5 th:text="${r.s('room_number')+' · '+r.s('title')}"></h5><div><span class="badge bg-light-danger me-2" th:text="#{${'care.'+r.s('priority')}}"></span><span class="badge bg-light-primary" th:text="#{${'care.'+r.s('status')}}"></span></div></div>
<p style="white-space:pre-wrap" th:text="${r.s('description')}"></p><small class="text-muted" th:text="${r.s('reporter')+' · '+r.time('created_at')+' UTC'}"></small>
<p class="small mt-2" th:if="${r.id('block_id')!=null}" th:text="${'#'+r.id('block_id')+' · '+r.s('from_date')+' → '+r.s('to_date')+' · '+r.s('block_status')}"></p><p th:text="${r.s('resolution')}"></p>
<form method="post" th:if="${r.s('status')=='OPEN' or r.s('status')=='IN_PROGRESS'}" th:action="@{/admin/maintenance/{id}/{action}(id=${r.id('id')},action='resolve')}"><label class="form-label d-block"><span th:text="#{care.resolution}"></span><input name="resolution" class="form-control" maxlength="500" required></label>
<button class="btn btn-primary btn-sm" th:text="#{care.resolve}"></button><button th:if="${r.s('status')=='OPEN'}" class="btn btn-outline-primary btn-sm" th:formaction="@{/admin/maintenance/{id}/start(id=${r.id('id')})}" th:text="#{care.startRepair}"></button><button class="btn btn-outline-danger btn-sm" th:formaction="@{/admin/maintenance/{id}/cancel(id=${r.id('id')})}" th:text="#{care.cancelRequest}"></button></form></article></div>
</section></body></html>
