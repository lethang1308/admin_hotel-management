<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{price.policies.cancellations},~{::#pricing-page},~{::#pricing-scripts})}"><body><div id="pricing-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{price.workspace}"></p><h3 th:text="#{price.policies.cancellations}"></h3><p class="text-muted mb-0" th:text="#{price.policies.cancellations.subtitle}"></p></div><div class="d-flex flex-wrap gap-2"><a class="btn btn-light" th:href="@{/admin/policies}" th:text="#{price.back}"></a></div></div><div class="card"><div class="card-body"><form method="post" th:action="@{${formAction}}" th:object="${form}"><div class="alert alert-light-danger" th:if="${formError}" th:text="${formError}"></div><div th:if="${#fields.hasErrors('*')}" class="alert alert-light-danger"><ul class="mb-0"><li th:each="err:${#fields.errors('*')}" th:text="${err}"></li></ul></div><div class="alert alert-light-warning" th:if="${targetId != null and target.referenced}" th:text="#{price.versionHint}"></div><div class="alert alert-light-secondary" th:if="${targetId != null and !target.latest}" th:text="#{price.oldVersionHint}"></div><fieldset th:disabled="${targetId != null and !target.latest}"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="code" th:text="#{price.code}"></label><input id="code" class="form-control" type="text" th:field="*{code}" required maxlength="30" pattern="[A-Za-z0-9_-]+" th:readonly="${targetId != null}"><small class="text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></small></div><div class="col-md-6"><label class="form-label" for="name" th:text="#{price.name}"></label><input id="name" class="form-control" type="text" th:field="*{name}" required maxlength="150"><small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small></div><div class="col-12"><label class="form-label" for="description" th:text="#{price.description}"></label><textarea id="description" class="form-control" th:field="*{description}" rows="3" maxlength="20000"></textarea><small class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small></div><div class="col-md-6"><div class="form-check mt-3"><input id="customerCanCancel" type="checkbox" class="form-check-input" th:field="*{customerCanCancel}"><label class="form-check-label" for="customerCanCancel" th:text="#{price.customerCanCancel}"></label></div></div><div class="col-md-6"><label class="form-label" for="customerCancelDeadlineHours" th:text="#{price.customerCancelDeadlineHours}"></label><input id="customerCancelDeadlineHours" class="form-control" type="number" th:field="*{customerCancelDeadlineHours}" required min="0" max="100000"><small class="text-danger" th:if="${#fields.hasErrors('customerCancelDeadlineHours')}" th:errors="*{customerCancelDeadlineHours}"></small></div><div class="col-md-6"><label class="form-label" for="noShowFeeType" th:text="#{price.noShowFeeType}"></label><select class="form-select" id="noShowFeeType" th:field="*{noShowFeeType}" required><option th:each="o:${feeTypes}" th:value="${o}" th:text="#{${'price.fee.'+o.name()}}"></option></select></div><div class="col-md-6"><label class="form-label" for="noShowFeeValue" th:text="#{price.noShowFeeValue}"></label><input id="noShowFeeValue" class="form-control" type="number" th:field="*{noShowFeeValue}" required min="0" step="0.01"><small class="text-danger" th:if="${#fields.hasErrors('noShowFeeValue')}" th:errors="*{noShowFeeValue}"></small></div><div class="col-md-6"><div class="form-check mt-3"><input id="active" type="checkbox" class="form-check-input" th:field="*{active}"><label class="form-check-label" for="active" th:text="#{price.active}"></label></div></div><div class="col-12"><div class="d-flex justify-content-between align-items-center my-3"><h6 class="mb-0" th:text="#{price.tiers}"></h6><button class="btn btn-outline-primary btn-sm" type="button" data-add-tier th:text="#{price.addTier}"></button></div><p class="hotel-note" th:text="#{price.tierHint}"></p><div id="cancellation-tiers"><div class="row g-3 align-items-end pricing-tier mb-3" th:each="r,iter:*{rules}"><div class="col-md-4"><label class="form-label" th:for="'tier-'+${iter.index}+'-hours'" data-label="minHoursBeforeCheckin" th:text="#{price.minHours}"></label><input class="form-control" type="number" data-tier-field="minHoursBeforeCheckin" th:id="'tier-'+${iter.index}+'-hours'" th:field="*{rules[__${iter.index}__].minHoursBeforeCheckin}" min="0" max="100000" required></div><div class="col-md-4"><label class="form-label" th:for="'tier-'+${iter.index}+'-type'" data-label="feeType" th:text="#{price.feeType}"></label><select class="form-select" data-tier-field="feeType" th:id="'tier-'+${iter.index}+'-type'" th:field="*{rules[__${iter.index}__].feeType}"><option th:each="t:${feeTypes}" th:value="${t}" th:text="#{${'price.fee.'+t.name()}}"></option></select></div><div class="col-md-3"><label class="form-label" th:for="'tier-'+${iter.index}+'-value'" data-label="feeValue" th:text="#{price.amountValue}"></label><input class="form-control" type="number" data-tier-field="feeValue" th:id="'tier-'+${iter.index}+'-value'" th:field="*{rules[__${iter.index}__].feeValue}" min="0" step="0.01" required></div><div class="col-md-1"><button class="btn btn-outline-danger" type="button" data-remove-tier th:attr="aria-label=#{hotel.delete}"><i class="bi bi-trash"></i></button></div></div></div><template id="cancellation-tier-template"><div class="row g-3 align-items-end pricing-tier mb-3"><div class="col-md-4"><label class="form-label" data-label="minHoursBeforeCheckin" th:text="#{price.minHours}"></label><input class="form-control" type="number" data-tier-field="minHoursBeforeCheckin" value="0" min="0" max="100000" required></div><div class="col-md-4"><label class="form-label" data-label="feeType" th:text="#{price.feeType}"></label><select class="form-select" data-tier-field="feeType"><option th:each="t:${feeTypes}" th:value="${t}" th:text="#{${'price.fee.'+t.name()}}"></option></select></div><div class="col-md-3"><label class="form-label" data-label="feeValue" th:text="#{price.amountValue}"></label><input class="form-control" type="number" data-tier-field="feeValue" value="0" min="0" step="0.01" required></div><div class="col-md-1"><button class="btn btn-outline-danger" type="button" data-remove-tier th:attr="aria-label=#{hotel.delete}"><i class="bi bi-trash"></i></button></div></div></template></div><div class="col-12 d-flex gap-2 mt-4"><button class="btn btn-primary" th:text="#{cms.save}"></button><a class="btn btn-light" th:href="@{/admin/policies}" th:text="#{price.back}"></a></div></div></fieldset></form></div></div></div><th:block id="pricing-scripts"><script th:src="@{/admin/assets/static/js/cms-pricing.js}"></script></th:block></body></html>
