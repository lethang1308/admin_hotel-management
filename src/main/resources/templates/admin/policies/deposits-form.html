<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{price.policies.deposits},~{::#pricing-page},~{::#pricing-scripts})}"><body><div id="pricing-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{price.workspace}"></p><h3 th:text="#{price.policies.deposits}"></h3><p class="text-muted mb-0" th:text="#{price.policies.deposits.subtitle}"></p></div><div class="d-flex flex-wrap gap-2"><a class="btn btn-light" th:href="@{/admin/policies}" th:text="#{price.back}"></a></div></div><div class="card"><div class="card-body"><form method="post" th:action="@{${formAction}}" th:object="${form}"><div class="alert alert-light-danger" th:if="${formError}" th:text="${formError}"></div><div th:if="${#fields.hasErrors('*')}" class="alert alert-light-danger"><ul class="mb-0"><li th:each="err:${#fields.errors('*')}" th:text="${err}"></li></ul></div><div class="alert alert-light-warning" th:if="${targetId != null and target.referenced}" th:text="#{price.versionHint}"></div><div class="alert alert-light-secondary" th:if="${targetId != null and !target.latest}" th:text="#{price.oldVersionHint}"></div><fieldset th:disabled="${targetId != null and !target.latest}"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="code" th:text="#{price.code}"></label><input id="code" class="form-control" type="text" th:field="*{code}" required maxlength="30" pattern="[A-Za-z0-9_-]+" th:readonly="${targetId != null}"><small class="text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></small></div><div class="col-md-6"><label class="form-label" for="name" th:text="#{price.name}"></label><input id="name" class="form-control" type="text" th:field="*{name}" required maxlength="150"><small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small></div><div class="col-md-6"><label class="form-label" for="amountType" th:text="#{price.amountType}"></label><select class="form-select" id="amountType" th:field="*{amountType}" required><option th:each="o:${amountTypes}" th:value="${o}" th:text="#{${'price.deposit.'+o.name()}}"></option></select></div><div class="col-md-6"><label class="form-label" for="amountValue" th:text="#{price.amountValue}"></label><input id="amountValue" class="form-control" type="number" th:field="*{amountValue}" required min="0" step="0.01"><small class="text-danger" th:if="${#fields.hasErrors('amountValue')}" th:errors="*{amountValue}"></small></div><div class="col-md-6"><label class="form-label" for="paymentDueMinutes" th:text="#{price.paymentDueMinutes}"></label><input id="paymentDueMinutes" class="form-control" type="number" th:field="*{paymentDueMinutes}" required min="1" max="525600"><small class="text-danger" th:if="${#fields.hasErrors('paymentDueMinutes')}" th:errors="*{paymentDueMinutes}"></small></div><div class="col-md-6"><div class="form-check mt-3"><input id="active" type="checkbox" class="form-check-input" th:field="*{active}"><label class="form-check-label" for="active" th:text="#{price.active}"></label></div></div><div class="col-12"><p class="hotel-note" th:text="#{price.depositHint}"></p></div><div class="col-12 d-flex gap-2 mt-4"><button class="btn btn-primary" th:text="#{cms.save}"></button><a class="btn btn-light" th:href="@{/admin/policies}" th:text="#{price.back}"></a></div></div></fieldset></form></div></div></div><th:block id="pricing-scripts"><script th:src="@{/admin/assets/static/js/cms-pricing.js}"></script></th:block></body></html>
