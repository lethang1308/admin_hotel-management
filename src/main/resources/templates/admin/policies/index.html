<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{price.policies.title},~{::#pricing-page},~{::#pricing-scripts})}"><body><div id="pricing-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{price.workspace}"></p><h3 th:text="#{price.policies.title}"></h3><p class="text-muted mb-0" th:text="#{price.policies.title.subtitle}"></p></div><div class="d-flex flex-wrap gap-2"></div></div><section class="card"><div class="card-header d-flex justify-content-between align-items-center"><h5 class="mb-0" th:text="#{price.policies.deposits}"></h5><a class="btn btn-primary btn-sm" th:href="@{/admin/policies/deposits/create}" th:text="#{price.add}"></a></div><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th th:text="#{price.policy}"></th><th th:text="#{price.terms}"></th><th th:text="#{cms.status}"></th><th th:text="#{cms.actions}"></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(deposits)}"><td colspan="4" class="text-center text-muted py-4" th:text="#{cms.empty}"></td></tr><tr th:each="r:${deposits}"><td><strong th:text="${r.form.name}"></strong><small class="d-block text-muted"><span th:text="${r.form.code}"></span> · v<span th:text="${r.version}"></span></small><span th:if="${r.hotelDefault}" class="badge bg-light-primary mt-1" th:text="#{price.hotelDefault}"></span></td><td class="small"><span th:text="#{${'price.deposit.'+r.form.amountType.name()}}"></span> · <span th:text="${r.form.amountValue}"></span><small class="d-block text-muted" th:text="#{price.dueMinutesLabel(${r.form.paymentDueMinutes})}"></small></td><td><span class="badge" th:classappend="${r.form.active?'bg-light-success':'bg-light-secondary'}" th:text="${r.form.active}?#{price.active}:#{price.inactive}"></span></td><td><div class="d-flex flex-wrap gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/policies/deposits/{id}/edit(id=${r.id})}" th:text="#{cms.edit}"></a><form method="post" th:action="@{/admin/policies/deposits/{id}/toggle(id=${r.id})}"><button class="btn btn-sm btn-light" th:disabled="${r.hotelDefault or (!r.latest and !r.form.active)}" th:text="${r.form.active}?#{price.disable}:#{price.enable}"></button></form><form method="post" th:action="@{/admin/policies/deposits/{id}/default(id=${r.id})}" th:unless="${r.hotelDefault}"><button class="btn btn-sm btn-outline-success" th:disabled="${!r.form.active or !r.latest}" th:text="#{price.makeDefault}"></button></form><form method="post" th:action="@{/admin/policies/deposits/{id}/delete(id=${r.id})}" data-pricing-confirm th:attr="data-confirm-message=#{hotel.confirmDelete}"><button class="btn btn-sm btn-outline-danger" th:disabled="${r.referenced or r.hotelDefault}" th:text="#{hotel.delete}"></button></form></div></td></tr></tbody></table></div></div></section><section class="card"><div class="card-header d-flex justify-content-between align-items-center"><h5 class="mb-0" th:text="#{price.policies.cancellations}"></h5><a class="btn btn-primary btn-sm" th:href="@{/admin/policies/cancellations/create}" th:text="#{price.add}"></a></div><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th th:text="#{price.policy}"></th><th th:text="#{price.terms}"></th><th th:text="#{cms.status}"></th><th th:text="#{cms.actions}"></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(cancellations)}"><td colspan="4" class="text-center text-muted py-4" th:text="#{cms.empty}"></td></tr><tr th:each="r:${cancellations}"><td><strong th:text="${r.form.name}"></strong><small class="d-block text-muted"><span th:text="${r.form.code}"></span> · v<span th:text="${r.version}"></span></small><span th:if="${r.hotelDefault}" class="badge bg-light-primary mt-1" th:text="#{price.hotelDefault}"></span></td><td class="small"><div class="small" th:each="tier:${r.form.rules}"><span th:text="'≥ '+${tier.minHoursBeforeCheckin}+' h'"></span> · <span th:text="#{${'price.fee.'+tier.feeType.name()}}"></span> <span th:if="${tier.feeValue.signum()>0}" th:text="${tier.feeValue}"></span></div></td><td><span class="badge" th:classappend="${r.form.active?'bg-light-success':'bg-light-secondary'}" th:text="${r.form.active}?#{price.active}:#{price.inactive}"></span></td><td><div class="d-flex flex-wrap gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/policies/cancellations/{id}/edit(id=${r.id})}" th:text="#{cms.edit}"></a><form method="post" th:action="@{/admin/policies/cancellations/{id}/toggle(id=${r.id})}"><button class="btn btn-sm btn-light" th:disabled="${r.hotelDefault or (!r.latest and !r.form.active)}" th:text="${r.form.active}?#{price.disable}:#{price.enable}"></button></form><form method="post" th:action="@{/admin/policies/cancellations/{id}/default(id=${r.id})}" th:unless="${r.hotelDefault}"><button class="btn btn-sm btn-outline-success" th:disabled="${!r.form.active or !r.latest}" th:text="#{price.makeDefault}"></button></form><form method="post" th:action="@{/admin/policies/cancellations/{id}/delete(id=${r.id})}" data-pricing-confirm th:attr="data-confirm-message=#{hotel.confirmDelete}"><button class="btn btn-sm btn-outline-danger" th:disabled="${r.referenced or r.hotelDefault}" th:text="#{hotel.delete}"></button></form></div></td></tr></tbody></table></div></div></section><section class="card"><div class="card-header d-flex justify-content-between align-items-center"><h5 class="mb-0" th:text="#{price.policies.surcharges}"></h5><a class="btn btn-primary btn-sm" th:href="@{/admin/policies/surcharges/create}" th:text="#{price.add}"></a></div><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th th:text="#{price.policy}"></th><th th:text="#{price.terms}"></th><th th:text="#{cms.status}"></th><th th:text="#{cms.actions}"></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(surcharges)}"><td colspan="4" class="text-center text-muted py-4" th:text="#{cms.empty}"></td></tr><tr th:each="r:${surcharges}"><td><strong th:text="${r.form.name}"></strong><small class="d-block text-muted"><span th:text="${r.form.code}"></span> · v<span th:text="${r.version}"></span></small><span th:if="${r.hotelDefault}" class="badge bg-light-primary mt-1" th:text="#{price.hotelDefault}"></span></td><td class="small"><span th:text="#{${'price.surchargeKind.'+r.form.kind.name()}}"></span><small class="d-block text-muted"><span th:text="#{${'price.surchargeAmount.'+r.form.amountType.name()}}"></span>: <span th:text="${r.form.amountValue}"></span></small></td><td><span class="badge" th:classappend="${r.form.active?'bg-light-success':'bg-light-secondary'}" th:text="${r.form.active}?#{price.active}:#{price.inactive}"></span></td><td><div class="d-flex flex-wrap gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/policies/surcharges/{id}/edit(id=${r.id})}" th:text="#{cms.edit}"></a><form method="post" th:action="@{/admin/policies/surcharges/{id}/toggle(id=${r.id})}"><button class="btn btn-sm btn-light" th:disabled="${r.hotelDefault or (!r.latest and !r.form.active)}" th:text="${r.form.active}?#{price.disable}:#{price.enable}"></button></form><form method="post" th:action="@{/admin/policies/surcharges/{id}/delete(id=${r.id})}" data-pricing-confirm th:attr="data-confirm-message=#{hotel.confirmDelete}"><button class="btn btn-sm btn-outline-danger" th:disabled="${r.referenced or r.hotelDefault}" th:text="#{hotel.delete}"></button></form></div></td></tr></tbody></table></div></div></section></div><th:block id="pricing-scripts"><script th:src="@{/admin/assets/static/js/cms-pricing.js}"></script></th:block></body></html>
