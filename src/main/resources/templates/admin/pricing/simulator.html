<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{price.simulator.title},~{::#pricing-page},~{::#pricing-scripts})}"><body><div id="pricing-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{price.workspace}"></p><h3 th:text="#{price.simulator.title}"></h3><p class="text-muted mb-0" th:text="#{price.simulator.title.subtitle}"></p></div><div class="d-flex flex-wrap gap-2"><a class="btn btn-light" th:href="@{/admin/pricing}" th:text="#{price.back}"></a></div></div><div class="card"><div class="card-body"><form method="post" th:action="@{/admin/pricing/simulator}" th:object="${form}"><div class="alert alert-light-danger" th:if="${formError}" th:text="${formError}"></div><div th:if="${#fields.hasErrors('*')}" class="alert alert-light-danger"><ul class="mb-0"><li th:each="err:${#fields.errors('*')}" th:text="${err}"></li></ul></div><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0" th:text="#{price.roomsRequest}"></h5><button type="button" class="btn btn-outline-primary btn-sm" data-add-quote-room th:text="#{price.addRoomLine}"></button></div><div id="quote-rooms"><div class="row g-3 align-items-end pricing-room-line mb-3" th:each="r,iter:*{rooms}"><div class="col-md-4"><label class="form-label" data-label="roomTypeId" th:for="'quote-'+${iter.index}+'-type'" th:text="#{hotel.type}"></label><select class="form-select" data-room-field="roomTypeId" th:id="'quote-'+${iter.index}+'-type'" th:field="*{rooms[__${iter.index}__].roomTypeId}" required><option value="" th:text="#{hotel.choose}"></option><option th:each="t:${types}" th:value="${t.id}" th:text="${t.name}"></option></select></div><div class="col-md-3"><label class="form-label" data-label="checkIn" th:for="'quote-'+${iter.index}+'-in'" th:text="#{price.checkInDate}"></label><input class="form-control" type="date" data-room-field="checkIn" th:id="'quote-'+${iter.index}+'-in'" th:field="*{rooms[__${iter.index}__].checkIn}" required></div><div class="col-md-3"><label class="form-label" data-label="checkOut" th:for="'quote-'+${iter.index}+'-out'" th:text="#{price.checkOutDate}"></label><input class="form-control" type="date" data-room-field="checkOut" th:id="'quote-'+${iter.index}+'-out'" th:field="*{rooms[__${iter.index}__].checkOut}" required></div><div class="col-md-1"><label class="form-label" data-label="quantity" th:for="'quote-'+${iter.index}+'-quantity'" th:text="#{price.quantity}"></label><input class="form-control" type="number" data-room-field="quantity" th:id="'quote-'+${iter.index}+'-quantity'" th:field="*{rooms[__${iter.index}__].quantity}" min="1" max="20" required></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger" data-remove-quote-room th:attr="aria-label=#{hotel.delete}"><i class="bi bi-trash"></i></button></div></div></div><template id="quote-room-template"><div class="row g-3 align-items-end pricing-room-line mb-3"><div class="col-md-4"><label class="form-label" data-label="roomTypeId" th:text="#{hotel.type}"></label><select class="form-select" data-room-field="roomTypeId" required><option value="" th:text="#{hotel.choose}"></option><option th:each="t:${types}" th:value="${t.id}" th:text="${t.name}"></option></select></div><div class="col-md-3"><label class="form-label" data-label="checkIn" th:text="#{price.checkInDate}"></label><input class="form-control" type="date" data-room-field="checkIn" required></div><div class="col-md-3"><label class="form-label" data-label="checkOut" th:text="#{price.checkOutDate}"></label><input class="form-control" type="date" data-room-field="checkOut" required></div><div class="col-md-1"><label class="form-label" data-label="quantity" th:text="#{price.quantity}"></label><input class="form-control" type="number" data-room-field="quantity" value="1" min="1" max="20" required></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger" data-remove-quote-room th:attr="aria-label=#{hotel.delete}"><i class="bi bi-trash"></i></button></div></div></template><hr><div class="row g-3"><div class="col-md-6"><label class="form-label" for="voucherCode" th:text="#{price.voucher}"></label><input id="voucherCode" class="form-control" type="text" th:field="*{voucherCode}" maxlength="50"><small class="text-danger" th:if="${#fields.hasErrors('voucherCode')}" th:errors="*{voucherCode}"></small></div><div class="col-md-6"><label class="form-label" for="customerId" th:text="#{price.customerId}"></label><input id="customerId" class="form-control" type="number" th:field="*{customerId}" min="1"><small class="text-danger" th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}"></small></div><div class="col-md-6"><label class="form-label" for="evaluationTime" th:text="#{price.evaluationTime}"></label><input id="evaluationTime" class="form-control" type="datetime-local" th:field="*{evaluationTime}" step="1"><small class="text-danger" th:if="${#fields.hasErrors('evaluationTime')}" th:errors="*{evaluationTime}"></small></div><div class="col-md-6"><label class="form-label" for="cancellationTime" th:text="#{price.cancellationTime}"></label><input id="cancellationTime" class="form-control" type="datetime-local" th:field="*{cancellationTime}" step="1"><small class="text-danger" th:if="${#fields.hasErrors('cancellationTime')}" th:errors="*{cancellationTime}"></small></div><div class="col-12"><div class="hotel-note"><span th:text="#{price.simulatorHint}"></span> <strong th:text="${hotelZone}"></strong>.</div></div><div class="col-12"><button class="btn btn-primary" th:text="#{price.calculate}"></button></div></div></form></div></div>
<section th:if="${quote != null}"><div class="alert alert-light-warning" th:each="key:${quote.warningKeys}" th:text="#{${key}}"></div><div class="pricing-summary"><div class="pricing-summary-item "><small th:text="#{price.nightlySubtotal}"></small><strong><span th:text="${#numbers.formatDecimal(quote.nightlySubtotal,0,'COMMA',0,'POINT')}"></span> <small>VND</small></strong></div><div class="pricing-summary-item "><small th:text="#{price.lengthDiscount}"></small><strong><span th:text="${#numbers.formatDecimal(quote.lengthDiscountTotal,0,'COMMA',0,'POINT')}"></span> <small>VND</small></strong></div><div class="pricing-summary-item "><small th:text="#{price.voucherDiscount}"></small><strong><span th:text="${#numbers.formatDecimal(quote.voucherDiscountTotal,0,'COMMA',0,'POINT')}"></span> <small>VND</small></strong></div><div class="pricing-summary-item "><small th:text="#{price.roomSubtotal}"></small><strong><span th:text="${#numbers.formatDecimal(quote.roomSubtotal,0,'COMMA',0,'POINT')}"></span> <small>VND</small></strong></div><div class="pricing-summary-item "><small th:text="#{price.taxAmount}"></small><strong><span th:text="${#numbers.formatDecimal(quote.taxAmount,0,'COMMA',0,'POINT')}"></span> <small>VND</small></strong></div><div class="pricing-summary-item pricing-summary-total"><small th:text="#{price.totalAmount}"></small><strong><span th:text="${#numbers.formatDecimal(quote.totalAmount,0,'COMMA',0,'POINT')}"></span> <small>VND</small></strong></div><div class="pricing-summary-item pricing-summary-total"><small th:text="#{price.depositRequired}"></small><strong><span th:text="${#numbers.formatDecimal(quote.depositRequired,0,'COMMA',0,'POINT')}"></span> <small>VND</small></strong></div></div><div class="card"><div class="card-header"><h5 th:text="#{price.breakdown}"></h5><p class="text-muted small mb-0" th:text="#{price.breakdownHint}"></p></div><div class="card-body"><div class="table-responsive"><table class="table pricing-breakdown align-middle"><thead><tr><th th:text="#{price.line}"></th><th th:text="#{price.night}"></th><th th:text="#{price.basePrice}"></th><th th:text="#{price.override}"></th><th th:text="#{price.lengthDiscount}"></th><th th:text="#{price.voucherDiscount}"></th><th th:text="#{price.roomSubtotal}"></th><th th:text="#{price.taxAmount}"></th><th th:text="#{price.totalAmount}"></th></tr></thead><tbody><tr th:each="n:${quote.nights}"><td><strong th:text="${n.roomTypeName}"></strong><small class="d-block text-muted" th:text="${n.line}+'.'+${n.room}"></small></td><td class="text-nowrap" th:text="${n.date}"></td><td class="text-end" th:text="${#numbers.formatDecimal(n.basePriceSnapshot,0,'COMMA',0,'POINT')}"></td><td><div class="text-end" th:text="${#numbers.formatDecimal(n.nightlyRate,0,'COMMA',0,'POINT')}"></div><small th:if="${n.overrideRule != null}" class="d-block pricing-rule-label" th:text="${n.overrideRule.code}+' · P'+${n.overrideRule.priority}"></small><small th:unless="${n.overrideRule}" class="text-muted" th:text="#{price.defaultRate}"></small></td><td><div class="text-end" th:text="${#numbers.formatDecimal(n.lengthDiscountAmount,0,'COMMA',0,'POINT')}"></div><small th:if="${n.lengthRule != null}" class="d-block pricing-rule-label" th:text="${n.lengthRule.code}+' · P'+${n.lengthRule.priority}"></small></td><td class="text-end" th:text="${#numbers.formatDecimal(n.voucherDiscountAmount,0,'COMMA',0,'POINT')}"></td><td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(n.netRoomAmount,0,'COMMA',0,'POINT')}"></td><td class="text-end" th:text="${#numbers.formatDecimal(n.taxAmount,0,'COMMA',0,'POINT')}"></td><td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(n.totalAmount,0,'COMMA',0,'POINT')}"></td></tr></tbody><tfoot><tr><th colspan="4" th:text="#{price.total}"></th><td class="text-end" th:text="${#numbers.formatDecimal(quote.lengthDiscountTotal,0,'COMMA',0,'POINT')}"></td><td class="text-end" th:text="${#numbers.formatDecimal(quote.voucherDiscountTotal,0,'COMMA',0,'POINT')}"></td><td class="text-end" th:text="${#numbers.formatDecimal(quote.roomSubtotal,0,'COMMA',0,'POINT')}"></td><td class="text-end" th:text="${#numbers.formatDecimal(quote.taxAmount,0,'COMMA',0,'POINT')}"></td><td class="text-end" th:text="${#numbers.formatDecimal(quote.totalAmount,0,'COMMA',0,'POINT')}"></td></tr></tfoot></table></div></div></div>
<div class="row g-4"><div class="col-lg-5"><div class="card h-100"><div class="card-header"><h5 th:text="#{price.depositTerms}"></h5></div><div class="card-body"><p><strong th:text="${quote.policies.deposit.code}"></strong> · v<span th:text="${quote.policies.deposit.version}"></span></p><p><span th:text="#{${'price.deposit.'+quote.policies.deposit.amountType.name()}}"></span> · <span th:text="${quote.policies.deposit.amountValue}"></span></p><p th:if="${quote.depositDueAt}"><span th:text="#{price.depositDueAt}"></span>: <strong th:text="${@pricingDates.local(quote.depositDueAt,quote.policies.timezone)}"></strong></p><p class="hotel-note" th:text="#{price.depositHint}"></p></div></div></div><div class="col-lg-7"><div class="card h-100"><div class="card-header"><h5 th:text="#{price.cancellationTerms}"></h5></div><div class="card-body"><p><strong th:text="${quote.policies.cancellation.name}"></strong> · v<span th:text="${quote.policies.cancellation.version}"></span></p><p class="hotel-prewrap" th:text="${quote.policies.cancellation.description}"></p><p class="hotel-note" th:text="#{price.refundHint}"></p><p class="small"><span th:text="#{price.cancellationTime}"></span>: <strong th:text="${@pricingDates.local(quote.cancellationTime,quote.policies.timezone)}"></strong></p></div></div></div></div>
<div class="card mt-4"><div class="card-header"><h5 th:text="#{price.cancellationPreview}"></h5><p class="small text-muted mb-0" th:text="#{price.cancellationPreviewHint}"></p></div><div class="card-body"><div th:each="c:${quote.cancellations}" class="pricing-cancellation-room"><div class="d-flex justify-content-between flex-wrap gap-2"><h6 th:text="${c.line}+'.'+${c.room}+' · '+${c.roomTypeName}"></h6><span class="badge" th:classappend="${c.customerCanCancel?'bg-light-success':'bg-light-warning'}" th:text="${c.customerCanCancel}?#{price.customerCancelAllowed}:#{price.customerCancelBlocked}"></span></div><p class="small text-muted"><span th:text="#{price.expectedCheckIn}"></span>: <span th:text="${@pricingDates.local(c.expectedCheckIn,quote.policies.timezone)}"></span> · <span th:text="#{price.cancelDeadline}"></span>: <span th:text="${@pricingDates.local(c.customerCancelDeadline,quote.policies.timezone)}"></span></p><p><span th:text="${c.noShow}?#{price.noShow}:#{price.selectedFee}"></span>: <strong th:text="${#numbers.formatDecimal(c.feeAmount,0,'COMMA',0,'POINT')}+' VND'"></strong> · <span th:text="#{price.roomAmountAfterFee}"></span>: <strong th:text="${#numbers.formatDecimal(c.roomAmountAfterFee,0,'COMMA',0,'POINT')}+' VND'"></strong></p><div class="table-responsive"><table class="table table-sm"><thead><tr><th th:text="#{price.minHours}"></th><th th:text="#{price.thresholdAt}"></th><th th:text="#{price.feeType}"></th><th class="text-end" th:text="#{price.feeAmount}"></th></tr></thead><tbody><tr th:each="band:${c.bands}"><td th:text="'≥ '+${band.minHoursBeforeCheckin}+' h'"></td><td th:text="${@pricingDates.local(band.thresholdAt,quote.policies.timezone)}"></td><td th:text="#{${'price.fee.'+band.feeType.name()}}"></td><td class="text-end" th:text="${#numbers.formatDecimal(band.feeAmount,0,'COMMA',0,'POINT')}"></td></tr><tr><td th:text="#{price.noShow}"></td><td th:text="#{price.afterCheckIn}"></td><td th:text="#{${'price.fee.'+quote.policies.cancellation.noShowFeeType.name()}}"></td><td class="text-end" th:text="${#numbers.formatDecimal(c.noShowFee,0,'COMMA',0,'POINT')}"></td></tr></tbody></table></div></div></div></div></section></div><th:block id="pricing-scripts"><script th:src="@{/admin/assets/static/js/cms-pricing.js}"></script></th:block></body></html>
