<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{price.rules.title},~{::#pricing-page},~{::#pricing-scripts})}"><body><div id="pricing-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{price.workspace}"></p><h3 th:text="#{price.rules.title}"></h3><p class="text-muted mb-0" th:text="#{price.rules.title.subtitle}"></p></div><div class="d-flex flex-wrap gap-2"><a class="btn btn-light" th:href="@{/admin/pricing}" th:text="#{price.back}"></a></div></div><div class="card"><div class="card-body"><form method="post" th:action="@{${formAction}}" th:object="${form}"><div class="alert alert-light-danger" th:if="${formError}" th:text="${formError}"></div><div th:if="${#fields.hasErrors('*')}" class="alert alert-light-danger"><ul class="mb-0"><li th:each="err:${#fields.errors('*')}" th:text="${err}"></li></ul></div><div class="alert alert-light-warning" th:if="${targetId != null and target.referenced}" th:text="#{price.versionHint}"></div><div class="alert alert-light-secondary" th:if="${targetId != null and !target.latest}" th:text="#{price.oldVersionHint}"></div><fieldset th:disabled="${targetId != null and !target.latest}"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="code" th:text="#{price.code}"></label><input id="code" class="form-control" type="text" th:field="*{code}" required pattern="[A-Za-z0-9_-]+" maxlength="40" th:readonly="${targetId != null}"><small class="text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></small></div><div class="col-md-6"><label class="form-label" for="name" th:text="#{price.name}"></label><input id="name" class="form-control" type="text" th:field="*{name}" required maxlength="150"><small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small></div><div class="col-md-6"><label class="form-label" for="kind" th:text="#{price.kind}"></label><select id="kind" class="form-select" th:field="*{kind}" required><option th:each="o:${kinds}" th:value="${o}" th:text="#{${'price.kind.'+o.name()}}"></option></select></div><div class="col-md-6"><label class="form-label" for="valueType" th:text="#{price.valueType}"></label><select id="valueType" class="form-select" th:field="*{valueType}" required><option th:each="o:${valueTypes}" th:value="${o}" th:text="#{${'price.valueType.'+o.name()}}"></option></select></div><div class="col-md-6"><label class="form-label" for="value" th:text="#{price.value}"></label><input id="value" class="form-control" type="number" th:field="*{value}" required min="0" step="0.01"><small class="text-danger" th:if="${#fields.hasErrors('value')}" th:errors="*{value}"></small></div><div class="col-md-6"><label class="form-label" for="priority" th:text="#{price.priority}"></label><input id="priority" class="form-control" type="number" th:field="*{priority}" required min="-100000" max="100000"><small class="text-danger" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></small></div><div class="col-md-6"><label class="form-label" for="startDate" th:text="#{price.startDate}"></label><input id="startDate" class="form-control" type="date" th:field="*{startDate}" required><small class="text-danger" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></small></div><div class="col-md-6"><label class="form-label" for="endDate" th:text="#{price.endDate}"></label><input id="endDate" class="form-control" type="date" th:field="*{endDate}" required><small class="text-danger" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></small></div><div class="col-md-6"><label class="form-label" for="minNights" th:text="#{price.minNights}"></label><input id="minNights" class="form-control" type="number" th:field="*{minNights}" required min="1" max="366"><small class="text-danger" th:if="${#fields.hasErrors('minNights')}" th:errors="*{minNights}"></small></div><div class="col-md-6"><label class="form-label" for="maxNights" th:text="#{price.maxNights}"></label><input id="maxNights" class="form-control" type="number" th:field="*{maxNights}" min="1" max="366"><small class="text-danger" th:if="${#fields.hasErrors('maxNights')}" th:errors="*{maxNights}"></small></div><div class="col-12"><h6 th:text="#{price.weekdays}"></h6><div class="d-flex flex-wrap gap-2 mb-3"><button type="button" class="btn btn-light btn-sm" data-weekday-mask="127" th:text="#{price.week.all}"></button><button type="button" class="btn btn-light btn-sm" data-weekday-mask="96" th:text="#{price.week.weekend}"></button><button type="button" class="btn btn-light btn-sm" data-weekday-mask="112" th:text="#{price.week.longWeekend}"></button><button type="button" class="btn btn-light btn-sm" data-weekday-mask="31" th:text="#{price.week.weekday}"></button></div><div class="d-flex flex-wrap gap-4"><div class="form-check" th:each="day:${#numbers.sequence(1,7)}"><input class="form-check-input pricing-weekday" type="checkbox" th:field="*{weekdays}" th:value="${day}"><label class="form-check-label" th:for="${#ids.prev('weekdays')}" th:text="#{${'price.day.'+day}}"></label></div></div></div><div class="col-12"><div class="d-flex justify-content-between align-items-center mb-2"><h6 class="mb-0" th:text="#{price.roomTypes}"></h6><button type="button" class="btn btn-light btn-sm" data-all-types th:text="#{price.selectAll}"></button></div><p class="small text-muted" th:text="#{price.ruleTypesHint}"></p><div class="row g-2"><div class="col-md-4" th:each="t:${types}"><div class="form-check"><input type="checkbox" class="form-check-input pricing-type-checkbox" th:field="*{roomTypeIds}" th:value="${t.id}" th:disabled="${!t.active and !form.roomTypeIds.contains(t.id)}"><label class="form-check-label" th:for="${#ids.prev('roomTypeIds')}"><span th:text="${t.name}"></span> <small th:unless="${t.active}" th:text="#{hotel.inactive}"></small></label></div></div></div></div><div class="col-md-6"><div class="form-check mt-3"><input id="active" class="form-check-input" type="checkbox" th:field="*{active}"><label for="active" class="form-check-label" th:text="#{price.active}"></label></div></div><div class="col-12"><p class="hotel-note mb-0" th:text="#{price.ruleHint}"></p></div><div class="col-12 d-flex gap-2 mt-4"><button class="btn btn-primary" th:text="#{cms.save}"></button><a class="btn btn-light" th:href="@{/admin/pricing}" th:text="#{price.back}"></a></div></div></fieldset></form></div></div></div><th:block id="pricing-scripts"><script th:src="@{/admin/assets/static/js/cms-pricing.js}"></script></th:block></body></html>
