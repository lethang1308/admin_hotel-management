<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{price.title},~{::#pricing-page},~{::#pricing-scripts})}"><body><div id="pricing-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{price.workspace}"></p><h3 th:text="#{price.title}"></h3><p class="text-muted mb-0" th:text="#{price.title.subtitle}"></p></div><div class="d-flex flex-wrap gap-2"><a class="btn btn-outline-primary" th:href="@{/admin/pricing/simulator}" th:text="#{price.simulator.title}" sec:authorize="hasAnyAuthority('pricing.manage','booking.create')"></a><a class="btn btn-primary" th:href="@{/admin/pricing/rules/create}" th:text="#{price.rule.add}" sec:authorize="hasAuthority('pricing.manage')"></a></div></div><div class="card"><div class="card-header"><h5 th:text="#{price.basePrices}"></h5></div><div class="card-body"><div class="row g-3"><div class="col-md-6 col-xl-4" th:each="t:${types}"><div class="pricing-base-card"><div class="d-flex justify-content-between align-items-center mb-2"><strong th:text="${t.name}"></strong><span class="badge bg-light-secondary" th:text="${t.code}"></span></div><form method="post" th:action="@{/admin/pricing/base-prices}" sec:authorize="hasAnyAuthority('pricing.manage','room.manage')" class="d-flex gap-2"><input type="hidden" name="roomTypeId" th:value="${t.id}"><label class="visually-hidden" th:for="'base-'+${t.id}" th:text="#{price.basePrice}"></label><input class="form-control" type="number" name="basePrice" th:id="'base-'+${t.id}" th:value="${t.basePrice}" min="0" step="0.01" required><button class="btn btn-outline-primary" th:attr="title=#{cms.save}"><i class="bi bi-check2" aria-hidden="true"></i><span class="visually-hidden" th:text="#{cms.save}"></span></button></form><p class="mb-0 fw-semibold" sec:authorize="!hasAnyAuthority('pricing.manage','room.manage')"><span th:text="${#numbers.formatDecimal(t.basePrice,0,'COMMA',0,'POINT')}"></span> VND</p><small class="text-muted" th:text="#{price.nightly}"></small></div></div></div></div></div>
<div class="card" id="rate-calendar"><div class="card-header"><div class="d-flex justify-content-between flex-wrap gap-2"><h5 th:text="#{price.calendar}"></h5><span class="badge bg-light-primary" th:text="#{price.calendar.oneNight}"></span></div><p class="text-muted small mb-0" th:text="#{price.calendarHint}"></p></div><div class="card-body"><form class="row g-3 align-items-end mb-4" method="get" th:action="@{/admin/pricing}"><div class="col-md-4"><label for="from" class="form-label" th:text="#{price.startDate}"></label><input class="form-control" type="date" id="from" name="from" th:value="${from}" required></div><div class="col-md-4"><label for="until" class="form-label" th:text="#{price.endDate}"></label><input class="form-control" type="date" id="until" name="until" th:value="${until}" required></div><div class="col-md-4 d-flex gap-2"><button class="btn btn-primary" th:text="#{price.viewCalendar}"></button><button class="btn btn-light" type="button" data-calendar-days="14">14</button><button class="btn btn-light" type="button" data-calendar-days="30">30</button></div></form><div th:if="${calendarError}" class="alert alert-light-danger" th:text="${calendarError}"></div><div class="table-responsive pricing-calendar" th:if="${calendar != null}"><table class="table table-bordered align-middle mb-0"><thead><tr><th class="pricing-sticky" th:text="#{hotel.type}"></th><th th:each="d:${calendar.dates}" th:classappend="${d.dayOfWeek.value>=6}?'pricing-weekend':''"><span th:text="${#temporals.format(d,'dd/MM')}"></span><small class="d-block" th:text="#{${'price.day.'+d.dayOfWeek.value}}"></small></th></tr></thead><tbody><tr th:each="r:${calendar.rows}"><th class="pricing-sticky" th:text="${r.name}"></th><td th:each="c:${r.cells}" th:classappend="${c.rule != null}?'pricing-override':''"><strong th:text="${#numbers.formatDecimal(c.rate,0,'COMMA',0,'POINT')}"></strong><small class="d-block" th:if="${c.rule != null}" th:title="${c.rule.name}+' · '+${c.rule.priority}" th:text="${c.rule.code}"></small><small class="d-block text-muted" th:unless="${c.rule}" th:text="#{price.defaultRate}"></small></td></tr><tr th:if="${#lists.isEmpty(calendar.rows)}"><td class="text-center py-4" th:colspan="${#lists.size(calendar.dates)+1}" th:text="#{cms.empty}"></td></tr></tbody></table></div></div></div>
<div class="card"><div class="card-header"><h5 th:text="#{price.rules.title}"></h5></div><div class="card-body"><form method="get" th:action="@{/admin/pricing}" class="row g-3 align-items-end mb-4"><input type="hidden" name="from" th:value="${from}"><input type="hidden" name="until" th:value="${until}"><div class="col-md-4"><label for="search" class="form-label" th:text="#{cms.search}"></label><input id="search" name="search" class="form-control" maxlength="150" th:value="${search}"></div><div class="col-md-3"><label for="filterKind" class="form-label" th:text="#{price.kind}"></label><select class="form-select" id="filterKind" name="kind"><option value="" th:text="#{cms.all}"></option><option th:each="k:${kinds}" th:value="${k}" th:selected="${k==kind}" th:text="#{${'price.kind.'+k.name()}}"></option></select></div><div class="col-md-3"><label for="active" class="form-label" th:text="#{cms.status}"></label><select id="active" name="active" class="form-select"><option value="" th:text="#{cms.all}"></option><option value="true" th:selected="${active==true}" th:text="#{price.active}"></option><option value="false" th:selected="${active==false}" th:text="#{price.inactive}"></option></select></div><div class="col-md-2"><button class="btn btn-primary w-100" th:text="#{cms.filter}"></button></div></form><div class="table-responsive"><table class="table align-middle"><thead><tr><th th:text="#{price.rule}"></th><th th:text="#{price.kind}"></th><th th:text="#{price.period}"></th><th th:text="#{price.roomTypes}"></th><th th:text="#{price.value}"></th><th th:text="#{price.priority}"></th><th th:text="#{cms.status}"></th><th th:text="#{cms.actions}"></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(rows)}"><td colspan="8" class="py-5 text-center text-muted" th:text="#{price.noRules}"></td></tr><tr th:each="r:${rows}"><td><strong th:text="${r.form.name}"></strong><small class="d-block text-muted"><span th:text="${r.form.code}"></span> · v<span th:text="${r.version}"></span></small></td><td class="small" th:text="#{${'price.kind.'+r.form.kind.name()}}"></td><td class="small text-nowrap"><span th:text="${r.form.startDate}"></span> → <span th:text="${r.form.endDate}"></span><small class="d-block text-muted" th:text="#{price.nightsRange(${r.form.minNights},${r.form.maxNights==null?'∞':r.form.maxNights})}"></small></td><td class="small" th:text="${#strings.listJoin(r.roomTypeNames,', ')}"></td><td><span th:text="${#numbers.formatDecimal(r.form.value,0,'COMMA',0,'POINT')}"></span><small th:text="${r.form.valueType.name()=='PERCENT'?' %':' VND'}"></small></td><td th:text="${r.form.priority}"></td><td><span class="badge" th:classappend="${r.form.active?'bg-light-success':'bg-light-secondary'}" th:text="${r.form.active}?#{price.active}:#{price.inactive}"></span></td><td><div sec:authorize="hasAuthority('pricing.manage')" class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/pricing/rules/{id}/edit(id=${r.id})}" th:text="#{cms.edit}"></a><form method="post" th:action="@{/admin/pricing/rules/{id}/toggle(id=${r.id})}"><button class="btn btn-sm btn-light" th:disabled="${!r.latest and !r.form.active}" th:text="${r.form.active}?#{price.disable}:#{price.enable}"></button></form><form method="post" th:action="@{/admin/pricing/rules/{id}/delete(id=${r.id})}" data-pricing-confirm th:attr="data-confirm-message=#{hotel.confirmDelete}"><button class="btn btn-sm btn-outline-danger" th:disabled="${r.referenced}" th:text="#{hotel.delete}"></button></form></div></td></tr></tbody></table></div></div></div></div><th:block id="pricing-scripts"><script th:src="@{/admin/assets/static/js/cms-pricing.js}"></script></th:block></body></html>
