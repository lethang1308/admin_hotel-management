<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
 th:replace="~{admin/layouts/main :: layout(#{cms.customers.detail}, ~{::#cms-page}, ~{})}"><body><div id="cms-page">
 <div class="page-heading"><h3 th:text="#{cms.customers.detail}"></h3></div>
<div class="card cms-form-card"><div class="card-body"><div class="d-flex justify-content-between flex-wrap gap-3 mb-4"><div><span class="badge bg-light-primary" th:text="${target.customerCode}"></span><h4 class="mt-3" th:text="${target.fullName}"></h4></div><a sec:authorize="hasAuthority('customer.update')" class="btn btn-outline-primary align-self-start" th:href="@{/admin/customers/{id}/edit(id=${target.id})}" th:text="#{cms.edit}"></a></div><dl class="row cms-details">
<dt class="col-sm-4" th:text="#{cms.email}"></dt><dd class="col-sm-8 text-break" th:text="${target.email} ?: '-'"></dd><dt class="col-sm-4" th:text="#{cms.phone}"></dt><dd class="col-sm-8 text-break" th:text="${target.phone} ?: '-'"></dd><dt class="col-sm-4" th:text="#{cms.dateOfBirth}"></dt><dd class="col-sm-8 text-break" th:text="${target.dateOfBirth} ?: '-'"></dd><dt class="col-sm-4" th:text="#{cms.nationality}"></dt><dd class="col-sm-8 text-break" th:text="${target.nationalityCode} ?: '-'"></dd><dt class="col-sm-4" th:text="#{cms.address}"></dt><dd class="col-sm-8 text-break" th:text="${target.address} ?: '-'"></dd><dt class="col-sm-4" th:text="#{cms.documentType}"></dt><dd class="col-sm-8 text-break" th:text="${target.documentType} ?: '-'"></dd><dt class="col-sm-4" th:text="#{cms.documentNumber}"></dt><dd class="col-sm-8 text-break" th:text="${target.maskedDocument} ?: '-'"></dd><dt class="col-sm-4" th:text="#{cms.notes}"></dt><dd class="col-sm-8 text-break" th:text="${target.notes} ?: '-'"></dd></dl><p class="small text-muted" th:text="#{cms.customerAccountNote}"></p><a class="btn btn-light-secondary" th:href="@{/admin/customers}" th:text="#{cms.back}"></a></div></div>
<div th:replace="~{admin/fragments/guest-care :: customer-history}"></div></div></body></html>
