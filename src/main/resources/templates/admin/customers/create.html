<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
 th:replace="~{admin/layouts/main :: layout(#{cms.customers.create}, ~{::#cms-page}, ~{})}"><body><div id="cms-page">
 <div class="page-heading"><h3 th:text="#{cms.customers.create}"></h3></div>
<div class="card cms-form-card"><div class="card-body"><div th:if="${formError}" class="alert alert-light-danger" role="alert" th:text="${formError}"></div><form method="post" th:action="@{/admin/customers}" th:object="${customerForm}"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-light-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><ul class="mb-0"><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div><div class="mb-3"><label class="form-label" for="fullName" th:text="#{cms.fullName}"></label><input class="form-control" id="fullName" type="text" th:field="*{fullName}" maxlength="150" required th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div></div><div class="row"><div class="col-md-6"><div class="mb-3"><label class="form-label" for="email" th:text="#{cms.email}"></label><input class="form-control" id="email" type="email" th:field="*{email}" maxlength="150" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div></div></div><div class="col-md-6"><div class="mb-3"><label class="form-label" for="phone" th:text="#{cms.phone}"></label><input class="form-control" id="phone" type="tel" th:field="*{phone}" maxlength="20" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div></div></div><div class="col-md-6"><div class="mb-3"><label class="form-label" for="dateOfBirth" th:text="#{cms.dateOfBirth}"></label><input class="form-control" id="dateOfBirth" type="date" th:field="*{dateOfBirth}"  th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div></div></div><div class="col-md-6"><div class="mb-3"><label class="form-label" for="nationalityCode" th:text="#{cms.nationality}"></label><input class="form-control" id="nationalityCode" type="text" th:field="*{nationalityCode}" maxlength="2" placeholder="VN" th:classappend="${#fields.hasErrors('nationalityCode')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('nationalityCode')}" th:errors="*{nationalityCode}"></div></div></div></div><div class="mb-3"><label class="form-label" for="address" th:text="#{cms.address}"></label><input class="form-control" id="address" type="text" th:field="*{address}" maxlength="500" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div></div><div class="mb-3"><label class="form-label" for="notes" th:text="#{cms.notes}"></label><textarea id="notes" class="form-control" th:field="*{notes}" rows="3" maxlength="5000"></textarea></div><hr><div class="row"><div class="col-md-5"><label class="form-label" for="documentType" th:text="#{cms.documentType}"></label><select id="documentType" class="form-select" th:field="*{documentType}"><option value="" th:text="#{cms.none}"></option><option value="CCCD" th:text="#{cms.cccd}"></option><option value="PASSPORT" th:text="#{cms.passport}"></option></select></div><div class="col-md-7 mb-3"><label class="form-label" for="documentNumber" th:text="#{cms.documentNumber}"></label><input id="documentNumber" class="form-control" name="documentNumber" maxlength="50" autocomplete="off"></div></div><p class="small text-muted" th:text="#{cms.identityHelp}"></p><div class="form-check mb-4"><input id="clearDocument" class="form-check-input" type="checkbox" th:field="*{clearDocument}" th:classappend="${#fields.hasErrors('clearDocument')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('clearDocument')}" th:errors="*{clearDocument}"></div><label class="form-check-label" for="clearDocument" th:text="#{cms.clearDocument}"></label></div><div class="mb-3"><label class="form-label" for="reason" th:text="#{cms.reason}"></label><input class="form-control" id="reason" type="text" th:field="*{reason}" maxlength="1000" th:classappend="${#fields.hasErrors('reason')} ? 'is-invalid' : ''"><div class="invalid-feedback" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></div></div><div class="d-flex gap-2 justify-content-end"><a class="btn btn-light-secondary" th:href="@{/admin/customers}" th:text="#{cms.back}"></a><button class="btn btn-primary" type="submit" th:text="#{cms.save}"></button></div></form></div></div>
</div></body></html>
