<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
 th:replace="~{admin/layouts/main :: layout(#{cms.customers.title}, ~{::#cms-page}, ~{})}"><body><div id="cms-page">
 <div class="page-heading"><h3 th:text="#{cms.customers.title}"></h3></div>
<p class="text-muted" th:text="#{cms.customers.subtitle}"></p><div class="card"><div class="card-body"><form method="get" th:action="@{/admin/customers}" class="row g-3 align-items-end mb-4"><div class="col-md-7"><label for="search" class="form-label" th:text="#{cms.search}"></label><input id="search" name="search" class="form-control" maxlength="150" th:value="${search}" th:placeholder="#{cms.customers.search}"></div><div class="col-md-3"><label for="nationality" class="form-label" th:text="#{cms.nationality}"></label><input id="nationality" name="nationality" class="form-control" maxlength="2" th:value="${nationality}" placeholder="VN"></div><div class="col-md-2"><button class="btn btn-primary w-100" th:text="#{cms.filter}"></button></div></form>
<div class="d-flex justify-content-end mb-3"><a sec:authorize="hasAuthority('customer.update')" class="btn btn-primary" th:href="@{/admin/customers/create}" th:text="#{cms.customers.create}"></a></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th th:text="#{cms.customerCode}"></th><th th:text="#{cms.fullName}"></th><th th:text="#{cms.contact}"></th><th th:text="#{cms.nationality}"></th><th th:text="#{cms.actions}"></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(pageData.items)}"><td colspan="5" class="text-center text-muted py-5" th:text="#{cms.empty}"></td></tr>
<tr th:each="c:${pageData.items}"><td class="fw-semibold" th:text="${c.customerCode}"></td><td th:text="${c.fullName}"></td><td><div th:text="${c.phone}"></div><small class="text-muted" th:text="${c.email}"></small></td><td th:text="${c.nationalityCode}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/customers/{id}(id=${c.id})}" th:text="#{cms.view}"></a></td></tr></tbody></table></div><div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mt-3"><span class="text-muted" th:text="#{cms.pageInfo(${pageData.page + 1},${pageData.totalPages == 0 ? 1 : pageData.totalPages},${pageData.totalElements})}"></span><nav th:if="${pageData.totalPages > 1}" class="d-flex gap-2" th:attr="aria-label=#{cms.pagination}"><a class="btn btn-outline-secondary btn-sm" th:if="${pageData.hasPrevious}" th:href="@{/admin/customers(page=${pageData.page - 1},size=${pageData.size},search=${search},nationality=${nationality})}" th:text="#{cms.previous}"></a><a class="btn btn-outline-secondary btn-sm" th:if="${pageData.hasNext}" th:href="@{/admin/customers(page=${pageData.page + 1},size=${pageData.size},search=${search},nationality=${nationality})}" th:text="#{cms.next}"></a></nav></div></div></div>
</div></body></html>
