<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
 th:replace="~{admin/layouts/main :: layout(#{admin.roles.title}, ~{::#cms-page}, ~{})}"><body><div id="cms-page">
 <div class="page-heading"><h3 th:text="#{admin.roles.title}"></h3></div>
<p class="text-muted" th:text="#{cms.rolesHelp}"></p><div class="card"><div class="card-body">
<div class="d-flex gap-3 flex-wrap mb-4"><form th:each="role:${roles}" th:if="${role.code != 'ADMIN'}" th:id="${'roleForm' + role.id}" th:action="@{/admin/roles/{id}/permissions(id=${role.id})}" method="post"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-primary" th:text="#{cms.saveRole(${role.code})}"></button></form></div>
<div class="table-responsive cms-matrix"><table class="table table-hover align-middle"><thead><tr><th th:text="#{cms.permission}"></th><th th:each="role:${roles}" class="text-center" th:text="${role.code}"></th></tr></thead><tbody><tr th:each="permission:${permissions}"><td><div class="fw-semibold" th:text="#{${'cms.permission.' + permission.code}}"></div><code class="small" th:text="${permission.code}"></code></td><td th:each="role:${roles}" class="text-center"><input type="checkbox" class="form-check-input" name="permissions" th:value="${permission.id}" th:attr="form=${'roleForm' + role.id},aria-label=${role.code + ': ' + permission.code}" th:checked="${role.permissionIds.contains(permission.id)}" th:disabled="${role.code == 'ADMIN'}"></td></tr></tbody></table></div>
<p class="small text-muted mt-3 mb-0" th:text="#{cms.adminProtected}"></p></div></div>
</div></body></html>
