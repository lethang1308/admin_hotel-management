<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
 th:replace="~{admin/layouts/main :: layout(#{cms.audit.detail}, ~{::#cms-page}, ~{})}"><body><div id="cms-page">
 <div class="page-heading"><h3 th:text="#{cms.audit.detail}"></h3></div>
<div class="card"><div class="card-body"><div class="d-flex justify-content-between gap-3 flex-wrap mb-4"><div><h4 th:text="${record.action}"></h4><p class="text-muted mb-1" th:text="${record.entityType + ' #' + record.entityId}"></p><p class="small text-muted" th:text="${@dateFmt.local(record.createdAt)}"></p></div><a class="btn btn-light-secondary align-self-start" th:href="@{/admin/audit-logs}" th:text="#{cms.back}"></a></div><dl class="row"><dt class="col-sm-3" th:text="#{cms.actor}"></dt><dd class="col-sm-9" th:text="${record.actorUserId} ?: '-'"></dd><dt class="col-sm-3" th:text="#{cms.reason}"></dt><dd class="col-sm-9 text-break" th:text="${record.reason} ?: '-'"></dd><dt class="col-sm-3" th:text="#{cms.requestId}"></dt><dd class="col-sm-9 text-break" th:text="${record.requestId} ?: '-'"></dd></dl><div class="table-responsive"><table class="table cms-diff"><thead><tr><th th:text="#{cms.field}"></th><th th:text="#{cms.before}"></th><th th:text="#{cms.after}"></th><th th:text="#{cms.change}"></th></tr></thead><tbody><tr th:each="d:${diff}" th:classappend="${d.changed ? 'table-warning' : ''}"><th scope="row" th:text="${d.field}"></th><td class="text-break" th:text="${d.beforeValue}"></td><td class="text-break" th:text="${d.afterValue}"></td><td><span th:if="${d.changed}" class="badge bg-light-warning" th:text="#{cms.changed}"></span><span th:unless="${d.changed}" class="text-muted" th:text="#{cms.unchanged}"></span></td></tr><tr th:if="${#lists.isEmpty(diff)}"><td colspan="4" class="text-muted py-4" th:text="#{cms.noDiff}"></td></tr></tbody></table></div></div></div>
</div></body></html>
