<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
 th:replace="~{admin/layouts/main :: layout(#{cms.audit.title}, ~{::#cms-page}, ~{})}"><body><div id="cms-page">
 <div class="page-heading"><h3 th:text="#{cms.audit.title}"></h3></div>
<p class="text-muted" th:text="#{cms.audit.subtitle}"></p><div class="card"><div class="card-body"><form method="get" th:action="@{/admin/audit-logs}" class="row g-3 align-items-end mb-4">
<div class="col-md-2"><label for="action" class="form-label" th:text="#{cms.action}"></label><input id="action" class="form-control" name="action" type="text" th:value="${action}" maxlength="100"></div><div class="col-md-2"><label for="type" class="form-label" th:text="#{cms.entityType}"></label><input id="type" class="form-control" name="type" type="text" th:value="${type}" maxlength="80"></div><div class="col-md-2"><label for="actor" class="form-label" th:text="#{cms.actor}"></label><input id="actor" class="form-control" name="actor" type="number" th:value="${actor}" min="1"></div><div class="col-md-2"><label for="from" class="form-label" th:text="#{cms.from}"></label><input id="from" class="form-control" name="from" type="date" th:value="${from}" ></div><div class="col-md-2"><label for="to" class="form-label" th:text="#{cms.to}"></label><input id="to" class="form-control" name="to" type="date" th:value="${to}" ></div><div class="col-md-2"><button class="btn btn-primary w-100" th:text="#{cms.filter}"></button></div></form><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th th:text="#{cms.when}"></th><th th:text="#{cms.actor}"></th><th th:text="#{cms.action}"></th><th th:text="#{cms.entityType}"></th><th th:text="#{cms.ip}"></th><th th:text="#{cms.actions}"></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(pageData.items)}"><td colspan="6" class="text-center text-muted py-5" th:text="#{cms.empty}"></td></tr><tr th:each="a:${pageData.items}"><td class="small text-nowrap" th:text="${@dateFmt.local(a.createdAt)}"></td><td th:text="${a.actorUserId} ?: '-'"></td><td><code th:text="${a.action}"></code></td><td th:text="${a.entityType + ' #' + a.entityId}"></td><td class="small" th:text="${a.ipAddress}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/audit-logs/{id}(id=${a.id})}" th:text="#{cms.viewDiff}"></a></td></tr></tbody></table></div><div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mt-3"><span class="text-muted" th:text="#{cms.pageInfo(${pageData.page + 1},${pageData.totalPages == 0 ? 1 : pageData.totalPages},${pageData.totalElements})}"></span><nav th:if="${pageData.totalPages > 1}" class="d-flex gap-2" th:attr="aria-label=#{cms.pagination}"><a class="btn btn-outline-secondary btn-sm" th:if="${pageData.hasPrevious}" th:href="@{/admin/audit-logs(page=${pageData.page - 1},size=${pageData.size},action=${action},type=${type},actor=${actor},from=${from},to=${to})}" th:text="#{cms.previous}"></a><a class="btn btn-outline-secondary btn-sm" th:if="${pageData.hasNext}" th:href="@{/admin/audit-logs(page=${pageData.page + 1},size=${pageData.size},action=${action},type=${type},actor=${actor},from=${from},to=${to})}" th:text="#{cms.next}"></a></nav></div></div></div>
</div></body></html>
