<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{hotel.block.title}, ~{::#hotel-page}, ~{})}"><body><div id="hotel-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{hotel.workspace}"></p><h3 th:text="#{hotel.block.title}"></h3><p class="text-muted mb-0" th:text="#{hotel.block.subtitle}"></p></div><div class="d-flex gap-2 flex-wrap"><a class="btn btn-light" th:href="@{/admin/rooms/grid}" th:text="#{hotel.grid.title}"></a></div></div><div class="card"><div class="card-header"><h5 th:text="#{hotel.block.create}"></h5></div><div class="card-body"><form method="post" th:action="@{/admin/room-blocks}" th:object="${form}"><div class="alert alert-light-danger" th:if="${formError}" th:text="${formError}"></div><div th:if="${#fields.hasErrors('*')}" class="alert alert-light-danger"><ul class="mb-0"><li th:each="e:${#fields.errors('*')}" th:text="${e}"></li></ul></div><div class="row g-3"><div class="col-md-6"><label for="roomId" class="form-label" th:text="#{hotel.roomNumber}"></label><select class="form-select" id="roomId" th:field="*{roomId}" required><option value="" th:text="#{hotel.choose}"></option><option th:each="r:${rooms}" th:value="${r.id}" th:text="${r.roomNumber}+' · '+${r.roomTypeName}+' · '+${r.floorName}"></option></select></div><div class="col-md-6"><label class="form-label" for="blockType" th:text="#{hotel.block.type}"></label><select id="blockType" th:field="*{blockType}" class="form-select"><option value="MAINTENANCE" th:text="#{hotel.block.type.MAINTENANCE}"></option><option value="OUT_OF_SERVICE" th:text="#{hotel.block.type.OUT_OF_SERVICE}"></option></select></div><div class="col-md-6"><label class="form-label" for="fromDate" th:text="#{hotel.fromDate}"></label><input id="fromDate" class="form-control" type="date" th:field="*{fromDate}" th:min="${today}" th:max="${horizon.minusDays(1)}" required></div><div class="col-md-6"><label class="form-label" for="toDate" th:text="#{hotel.toDate}"></label><input id="toDate" class="form-control" type="date" th:field="*{toDate}" th:min="${today.plusDays(1)}" th:max="${horizon}" required></div><div class="col-12"><label class="form-label" for="reason" th:text="#{hotel.reason}"></label><textarea id="reason" class="form-control" th:field="*{reason}" maxlength="500" rows="2" required></textarea><small class="text-muted" th:text="#{hotel.block.dateHint}"></small></div><div class="col-12"><button class="btn btn-primary" th:text="#{hotel.block.create}"></button></div></div></form></div></div><div class="card"><div class="card-header"><h5 th:text="#{hotel.block.history}"></h5></div><div class="card-body"><div th:replace="~{admin/rooms/block-table :: table}"></div></div></div></div></body></html>
