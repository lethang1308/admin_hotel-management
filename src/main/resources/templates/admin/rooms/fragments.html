<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><form th:fragment="filters(action,showSearch)" method="get" th:action="@{${action}}" class="row g-3 align-items-end hotel-filters"><div class="col-md" th:if="${showSearch}"><label class="form-label" for="search" th:text="#{hotel.roomNumber}"></label><input id="search" name="search" maxlength="30" class="form-control" th:value="${search}"></div><div class="col-md"><label class="form-label" for="floorId" th:text="#{hotel.floor}"></label><select class="form-select" id="floorId" name="floorId"><option value="" th:text="#{cms.all}"></option><option th:each="o:${floors}" th:value="${o.id}" th:selected="${floorId == o.id}" th:text="${o.name}"></option></select></div><div class="col-md"><label class="form-label" for="area" th:text="#{hotel.area}"></label><select class="form-select" id="area" name="area"><option value="" th:text="#{cms.all}"></option><option th:each="o:${areas}" th:value="${o}" th:selected="${area == o}" th:text="${o}"></option></select></div><div class="col-md"><label class="form-label" for="typeId" th:text="#{hotel.type}"></label><select class="form-select" id="typeId" name="typeId"><option value="" th:text="#{cms.all}"></option><option th:each="o:${types}" th:value="${o.id}" th:selected="${typeId == o.id}" th:text="${o.name}"></option></select></div><div class="col-md"><label class="form-label" for="status" th:text="#{hotel.status}"></label><select class="form-select" id="status" name="status"><option value="" th:text="#{cms.all}"></option><option th:each="o:${statuses}" th:value="${o}" th:selected="${selectedStatus == o}" th:text="#{${'hotel.status.'+o.name()}}"></option></select></div><div class="col-md-auto"><button class="btn btn-primary" th:text="#{cms.filter}"></button> <a class="btn btn-light" th:href="@{${action}}" th:text="#{hotel.reset}"></a></div></form></body></html>
