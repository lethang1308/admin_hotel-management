<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{hotel.rooms.title}, ~{::#hotel-page}, ~{})}"><body><div id="hotel-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{hotel.workspace}"></p><h3 th:text="#{hotel.rooms.title}"></h3><p class="text-muted mb-0" th:text="#{hotel.rooms.subtitle}"></p></div><div class="d-flex gap-2 flex-wrap"></div></div><div class="card"><div class="card-body"><form method="post" th:action="@{${formAction}}" th:object="${form}"><div class="alert alert-light-danger" th:if="${formError}" th:text="${formError}"></div><div class="alert alert-light-danger" th:if="${#fields.hasErrors('*')}"><ul class="mb-0"><li th:each="err:${#fields.errors('*')}" th:text="${err}"></li></ul></div><div class="row g-3"><input type="hidden" th:field="*{version}"><div class="col-md-6"><label class="form-label" for="roomNumber" th:text="#{hotel.roomNumber}"></label><input class="form-control" type="text" id="roomNumber" th:field="*{roomNumber}" required maxlength="20" pattern="[A-Za-z0-9_-]+"><small class="text-danger" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}"></small></div><div class="col-md-6"><label class="form-label" for="roomTypeId" th:text="#{hotel.type}"></label><select class="form-select" id="roomTypeId" th:field="*{roomTypeId}" required><option value="" th:text="#{hotel.choose}"></option><option th:each="o:${types}" th:value="${o.id}" th:text="${o.name}"></option></select></div><div class="col-md-6"><label class="form-label" for="floorId" th:text="#{hotel.floor}"></label><select class="form-select" id="floorId" th:field="*{floorId}" required><option value="" th:text="#{hotel.choose}"></option><option th:each="o:${floors}" th:value="${o.id}" th:text="${o.name}"></option></select></div><div class="col-md-6"><label class="form-label" for="sellFrom" th:text="#{hotel.sellFrom}"></label><input class="form-control" type="date" id="sellFrom" th:field="*{sellFrom}" required><small class="text-danger" th:if="${#fields.hasErrors('sellFrom')}" th:errors="*{sellFrom}"></small></div><div class="col-md-6"><label class="form-label" for="sellUntil" th:text="#{hotel.sellUntil}"></label><input class="form-control" type="date" id="sellUntil" th:field="*{sellUntil}" ><small class="text-danger" th:if="${#fields.hasErrors('sellUntil')}" th:errors="*{sellUntil}"></small></div><div class="col-12"><label class="form-label" for="notes" th:text="#{hotel.notes}"></label><textarea class="form-control" rows="4" id="notes" th:field="*{notes}" maxlength="5000"></textarea><small class="text-danger" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></small></div><div class="col-12"><p class="hotel-note" th:text="#{hotel.saleHint}"></p></div><div class="col-12 d-flex gap-2 mt-4"><button class="btn btn-primary" th:text="#{cms.save}"></button><a class="btn btn-light" th:href="@{/admin/rooms}" th:text="#{hotel.back}"></a></div></div></form></div></div></div></body></html>
