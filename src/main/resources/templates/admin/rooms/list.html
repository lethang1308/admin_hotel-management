<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{hotel.rooms.title}, ~{::#hotel-page}, ~{})}"><body><div id="hotel-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{hotel.workspace}"></p><h3 th:text="#{hotel.rooms.title}"></h3><p class="text-muted mb-0" th:text="#{hotel.rooms.subtitle}"></p></div><div class="d-flex gap-2 flex-wrap"><a class="btn btn-outline-primary" th:href="@{/admin/rooms/grid}" th:text="#{hotel.grid.title}"></a><a sec:authorize="hasAuthority('room.manage')" class="btn btn-primary" th:href="@{/admin/rooms/create}" th:text="#{hotel.addRoom}"></a></div></div><div class="card"><div class="card-body"><form th:replace="~{admin/rooms/fragments :: filters('/admin/rooms',true)}"></form><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th th:text="#{hotel.roomNumber}"></th><th th:text="#{hotel.type}"></th><th th:text="#{hotel.floor}"></th><th th:text="#{hotel.status}"></th><th th:text="#{hotel.salePeriod}"></th><th th:text="#{cms.actions}"></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(pageData.items)}"><td colspan="6" class="py-5 text-center text-muted" th:text="#{cms.empty}"></td></tr><tr th:each="r:${pageData.items}"><td class="fw-bold"><a th:href="@{/admin/rooms/{id}(id=${r.id})}" th:text="${r.roomNumber}"></a></td><td th:text="${r.roomTypeName}"></td><td><span th:text="${r.floorName}"></span><small class="d-block text-muted" th:text="${r.areaName}"></small></td><td><span class="hotel-state" th:classappend="'state-'+${r.status}" th:text="#{${'hotel.status.'+r.status.name()}}"></span></td><td class="small"><span th:text="${r.sellFrom}"></span> → <span th:text="${r.sellUntil} ?: '∞'"></span></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/rooms/{id}(id=${r.id})}" th:text="#{hotel.detail}"></a></td></tr></tbody></table></div><div class="d-flex justify-content-between align-items-center gap-2 mt-3"><span class="text-muted" th:text="#{cms.pageInfo(${pageData.page+1},${pageData.totalPages==0?1:pageData.totalPages},${pageData.totalElements})}"></span><div class="d-flex gap-2"><a class="btn btn-sm btn-light" th:if="${pageData.hasPrevious}" th:href="@{/admin/rooms(page=${pageData.page-1},size=${pageData.size},floorId=${floorId},area=${area},typeId=${typeId},status=${selectedStatus},search=${search})}" th:text="#{cms.previous}"></a><a class="btn btn-sm btn-light" th:if="${pageData.hasNext}" th:href="@{/admin/rooms(page=${pageData.page+1},size=${pageData.size},floorId=${floorId},area=${area},typeId=${typeId},status=${selectedStatus},search=${search})}" th:text="#{cms.next}"></a></div></div></div></div></div></body></html>
