<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{hotel.grid.title}, ~{::#hotel-page}, ~{::#hotel-scripts})}"><body><div id="hotel-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{hotel.workspace}"></p><h3 th:text="#{hotel.grid.title}"></h3><p class="text-muted mb-0" th:text="#{hotel.grid.subtitle}"></p></div><div class="d-flex gap-2 flex-wrap"><a class="btn btn-outline-primary" sec:authorize="hasAuthority('housekeeping.manage')" th:href="@{/admin/receptionist/housekeeping}" th:text="#{care.housekeeping}"></a><a class="btn btn-outline-primary" sec:authorize="hasAuthority('maintenance.manage')" th:href="@{/admin/maintenance}" th:text="#{care.maintenance}"></a><a class="btn btn-outline-primary" th:href="@{/admin/rooms}" th:text="#{hotel.rooms.title}"></a><a sec:authorize="hasAuthority('room.manage')" class="btn btn-primary" th:href="@{/admin/rooms/create}"><i class="bi bi-plus-lg me-2"></i><span th:text="#{hotel.addRoom}"></span></a></div></div><div class="hotel-kpis"><div class="hotel-kpi hotel-kpi-total"><span th:text="#{hotel.totalRooms}"></span><strong th:text="${grid.total}"></strong><small th:text="#{hotel.filteredRooms}"></small></div><div class="hotel-kpi" th:each="s:${statuses}" th:classappend="'state-'+${s}"><span th:text="#{${'hotel.status.'+s.name()}}"></span><strong th:text="${grid.counts.get(s.name())}"></strong><span class="hotel-kpi-dot" aria-hidden="true"></span></div></div><div class="card"><div class="card-body"><form th:replace="~{admin/rooms/fragments :: filters('/admin/rooms/grid',false)}"></form><div class="hotel-note small d-flex gap-2"><i class="bi bi-info-circle" aria-hidden="true"></i><span th:text="#{hotel.grid.hint}"></span></div></div></div><div class="hotel-empty card card-body" th:if="${grid.total==0}"><i class="bi bi-door-open" aria-hidden="true"></i><h5 th:text="#{hotel.grid.empty}"></h5><p class="text-muted mb-0" th:text="#{hotel.grid.emptyHint}"></p></div><section class="hotel-floor-section" th:each="f:${grid.floors}"><div class="hotel-floor-header"><h5><i class="bi bi-layers me-2" aria-hidden="true"></i><span th:text="${f.name}"></span></h5><span class="text-muted small"><span th:text="${f.areaName}"></span> · <span th:text="#{hotel.roomCountLabel(${#lists.size(f.rooms)})}"></span></span></div><div class="hotel-room-grid"><button type="button" class="hotel-room" th:each="r:${f.rooms}" th:classappend="'state-'+${r.status}" data-bs-toggle="modal" data-bs-target="#roomQuickModal" th:attr="data-room-id=${r.id},data-room-number=${r.roomNumber},data-room-type=${r.roomTypeName},data-room-status=${r.status},data-room-status-label=#{${'hotel.status.'+r.status.name()}},data-room-version=${r.version}"><span class="hotel-room-top"><span class="hotel-room-number" th:text="${r.roomNumber}"></span><i class="bi bi-door-open" aria-hidden="true"></i></span><span class="hotel-room-type" th:text="${r.roomTypeName}"></span><span class="hotel-room-status"><span class="hotel-room-dot"></span><span th:text="#{${'hotel.status.'+r.status.name()}}"></span></span><span class="hotel-room-guest" th:if="${r.guestName}"><i class="bi bi-person me-1"></i><span th:text="${r.guestName}"></span></span><span class="hotel-room-checkout" th:if="${r.expectedCheckout}"><span th:text="#{hotel.checkoutShort}"></span> <span th:text="${r.expectedCheckout}"></span></span></button></div></section>
<div th:replace="~{admin/fragments/room-care-actions :: templates}"></div><div class="modal fade" id="roomQuickModal" tabindex="-1" aria-labelledby="roomQuickTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><div><p class="hotel-eyebrow mb-1" th:text="#{hotel.quickAction}"></p><h4 class="modal-title" id="roomQuickTitle"><span th:text="#{hotel.roomNumber}"></span> <span id="quickRoomNumber"></span></h4></div><button type="button" class="btn-close" data-bs-dismiss="modal" th:attr="aria-label=#{hotel.close}"></button></div><div class="modal-body"><p class="text-muted" id="quickRoomType"></p><span id="quickRoomStatus" class="hotel-state mb-4"></span><div id="room-care-actions"></div><form id="quickStatusForm" method="post" th:action="@{/admin/rooms/0/status}" sec:authorize="hasAuthority('room.status.update')"><input type="hidden" id="quickCanReactivate" value="true" sec:authorize="hasAuthority('room.manage')"><input type="hidden" name="version" id="quickVersion"><input type="hidden" name="returnView" value="grid"><label for="quickNextStatus" class="form-label" th:text="#{hotel.nextStatus}"></label><select class="form-select mb-3" name="status" id="quickNextStatus" required><th:block th:each="s:${statuses}"><option th:if="${s.name()!='INACTIVE' and s.name()!='MAINTENANCE'}" th:value="${s}" th:text="#{${'hotel.status.'+s.name()}}"></option><option th:if="${s.name()=='MAINTENANCE'}" sec:authorize="hasAuthority('room.block.manage')" th:value="${s}" th:text="#{hotel.status.MAINTENANCE}"></option></th:block></select><div id="quickMaintenanceWrap" class="mb-3" hidden><label for="quickMaintenanceUntil" class="form-label" th:text="#{hotel.maintenanceUntil}"></label><input type="date" id="quickMaintenanceUntil" name="maintenanceUntil" class="form-control" th:min="${today.plusDays(1)}"><small class="text-muted" th:text="#{hotel.block.dateHint}"></small></div><label for="quickReason" class="form-label" th:text="#{hotel.reason}"></label><textarea id="quickReason" name="reason" class="form-control mb-3" rows="2" maxlength="500" required></textarea><button class="btn btn-primary w-100" th:text="#{hotel.updateStatus}"></button></form><p sec:authorize="!hasAuthority('room.status.update')" class="text-muted" th:text="#{hotel.readOnly}"></p></div><div class="modal-footer justify-content-between"><a id="quickDetail" class="btn btn-light" th:href="@{/admin/rooms/0}" th:text="#{hotel.detail}"></a><a id="quickBlock" sec:authorize="hasAuthority('room.block.manage')" class="btn btn-outline-danger" th:href="@{/admin/room-blocks}" th:text="#{hotel.block.create}"></a></div></div></div></div></div><th:block id="hotel-scripts"><script th:src="@{/admin/assets/static/js/cms-hotel.js}"></script></th:block></body></html>
