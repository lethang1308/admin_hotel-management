<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{hotel.room.detail}, ~{::#hotel-page}, ~{::#hotel-scripts})}"><body><div id="hotel-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{hotel.room.detail}"></p><h3><span th:text="#{hotel.roomNumber}"></span> <span th:text="${room.roomNumber}"></span></h3><p class="text-muted mb-0"><span th:text="${room.floorName}"></span> · <span th:text="${room.areaName}"></span> · <span th:text="${room.roomTypeName}"></span></p></div><div class="d-flex gap-2"><a class="btn btn-outline-primary" sec:authorize="hasAuthority('room.manage')" th:href="@{/admin/rooms/{id}/edit(id=${room.id})}" th:text="#{cms.edit}"></a><a class="btn btn-light" th:href="@{/admin/rooms/grid}" th:text="#{hotel.grid.title}"></a></div></div><div class="row g-4"><div class="col-xl-8"><div class="card"><div class="card-body"><div class="d-flex justify-content-between mb-4"><h5 th:text="#{hotel.room.info}"></h5><span class="hotel-state" th:classappend="'state-'+${room.status}" th:text="#{${'hotel.status.'+room.status.name()}}"></span></div><div class="row g-3"><div class="col-md-6"><small class="text-muted" th:text="#{hotel.basePrice}"></small><h4 class="mt-1"><span th:text="${#numbers.formatDecimal(room.basePrice,0,'COMMA',0,'POINT')}"></span> <small>VND</small></h4></div><div class="col-md-6"><small class="text-muted" th:text="#{hotel.salePeriod}"></small><p class="mt-1"><span th:text="${room.sellFrom}"></span> → <span th:text="${room.sellUntil} ?: '∞'"></span></p></div><div class="col-12"><p th:text="${type.bedDescription}"></p><p th:text="#{hotel.capacityLabel(${type.maxOccupancy},${type.maxAdults},${type.maxChildren})}"></p><div class="d-flex flex-wrap gap-2"><span class="hotel-amenity" th:each="a:${type.amenities}"><i class="bi" th:classappend="${a.icon}"></i> <span th:text="${a.name}"></span></span></div></div><div class="col-12" th:if="${room.notes}"><small class="text-muted" th:text="#{hotel.notes}"></small><p class="hotel-prewrap" th:text="${room.notes}"></p></div></div></div></div></div><div class="col-xl-4"><div class="card" sec:authorize="hasAuthority('room.status.update')"><div class="card-body"><h5 th:text="#{hotel.updateStatus}"></h5><form method="post" th:action="@{/admin/rooms/{id}/status(id=${room.id})}"><input type="hidden" name="version" th:value="${room.version}"><label class="form-label" for="detailNextStatus" th:text="#{hotel.nextStatus}"></label><select class="form-select mb-3" id="detailNextStatus" name="status" required><th:block th:each="s:${statuses}"><option th:if="${s.name()!='INACTIVE' and s.name()!='MAINTENANCE'}" th:value="${s}" th:text="#{${'hotel.status.'+s.name()}}"></option><option th:if="${s.name()=='MAINTENANCE'}" sec:authorize="hasAuthority('room.block.manage')" th:value="${s}" th:text="#{hotel.status.MAINTENANCE}"></option></th:block></select><label class="form-label" for="detailMaintenanceUntil" th:text="#{hotel.maintenanceUntil}"></label><input id="detailMaintenanceUntil" class="form-control mb-3" type="date" name="maintenanceUntil" th:min="${today.plusDays(1)}"><label class="form-label" for="detailReason" th:text="#{hotel.reason}"></label><textarea class="form-control mb-3" id="detailReason" name="reason" rows="2" maxlength="500" required></textarea><button class="btn btn-primary w-100" th:text="#{cms.save}"></button></form><a sec:authorize="hasAuthority('room.block.manage')" class="btn btn-outline-danger w-100 mt-3" th:href="@{/admin/room-blocks(roomId=${room.id})}" th:text="#{hotel.block.create}"></a></div></div></div></div>
<div class="card"><div class="card-header border-bottom"><ul class="nav nav-tabs card-header-tabs" id="roomHistoryTabs" role="tablist"><li class="nav-item"><button class="nav-link active" id="stays-tab" data-bs-toggle="tab" data-bs-target="#stays-panel" type="button" role="tab" aria-controls="stays-panel" aria-selected="true" th:text="#{hotel.stays}"></button></li><li class="nav-item"><button class="nav-link" id="blocks-tab" data-bs-toggle="tab" data-bs-target="#blocks-panel" type="button" role="tab" aria-controls="blocks-panel" aria-selected="false" th:text="#{hotel.block.history}"></button></li><li class="nav-item"><button class="nav-link" id="status-tab" data-bs-toggle="tab" data-bs-target="#status-panel" type="button" role="tab" aria-controls="status-panel" aria-selected="false" th:text="#{hotel.statusHistory}"></button></li></ul></div><div class="card-body pt-4 tab-content"><section class="tab-pane fade show active" id="stays-panel" role="tabpanel" aria-labelledby="stays-tab"><div class="table-responsive"><table class="table align-middle"><thead><tr><th th:text="#{hotel.bookingCode}"></th><th th:text="#{hotel.guest}"></th><th th:text="#{hotel.plannedStay}"></th><th th:text="#{hotel.actualStay}"></th><th th:text="#{hotel.status}"></th><th th:text="#{hotel.checkedInBy}"></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(stays)}"><td colspan="6" class="py-5 text-center text-muted" th:text="#{hotel.noStays}"></td></tr><tr th:each="s:${stays}"><td th:text="${s.bookingCode}"></td><td><span th:text="${s.guestName}"></span><small class="d-block text-muted" th:text="${s.phone}"></small></td><td class="small"><span th:text="${s.fromDate}"></span> → <span th:text="${s.toDate}"></span></td><td class="small"><div th:text="${@dateFmt.local(s.checkIn)}"></div><div th:text="${@dateFmt.local(s.checkOut)}"></div></td><td th:text="#{${'hotel.allocation.'+s.status}}"></td><td th:text="${s.checkedInBy} ?: '—'"></td></tr></tbody></table></div></section><section class="tab-pane fade" id="blocks-panel" role="tabpanel" aria-labelledby="blocks-tab"><div th:replace="~{admin/rooms/block-table :: table}"></div></section><section class="tab-pane fade" id="status-panel" role="tabpanel" aria-labelledby="status-tab"><div class="table-responsive"><table class="table align-middle"><thead><tr><th th:text="#{hotel.changedAt}"></th><th th:text="#{hotel.transition}"></th><th th:text="#{hotel.actor}"></th><th th:text="#{hotel.reason}"></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(history)}"><td colspan="4" class="py-5 text-center text-muted" th:text="#{cms.empty}"></td></tr><tr th:each="h:${history}"><td class="small text-nowrap" th:text="${@dateFmt.local(h.changedAt)}"></td><td><span th:if="${h.oldStatus}" th:text="#{${'hotel.status.'+h.oldStatus}}"></span><span th:unless="${h.oldStatus}">—</span> → <span th:text="#{${'hotel.status.'+h.newStatus}}"></span></td><td th:text="${h.actorName} ?: #{hotel.system}"></td><td class="small" th:text="${h.reason}"></td></tr></tbody></table></div></section></div></div>
<div class="card" sec:authorize="hasAuthority('room.manage')"><div class="card-body"><h5 th:text="#{hotel.retireTitle}"></h5><p class="text-muted small" th:text="#{hotel.retireHint}"></p><div class="d-flex flex-wrap gap-3"><form method="post" th:action="@{/admin/rooms/{id}/retire(id=${room.id})}" class="d-flex gap-2"><label for="retireReason" class="visually-hidden" th:text="#{hotel.reason}"></label><input id="retireReason" class="form-control" name="reason" maxlength="500" required th:placeholder="#{hotel.reason}"><button class="btn btn-outline-warning text-nowrap" th:text="#{hotel.retire}"></button></form><form method="post" th:action="@{/admin/rooms/{id}/delete(id=${room.id})}" data-confirm-delete th:attr="data-confirm-message=#{hotel.confirmDelete}"><button class="btn btn-outline-danger" th:text="#{hotel.delete}"></button></form></div></div></div></div><th:block id="hotel-scripts"><script th:src="@{/admin/assets/static/js/cms-hotel.js}"></script></th:block></body></html>
