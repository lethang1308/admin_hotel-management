<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><div th:fragment="table"><div class="table-responsive"><table class="table align-middle"><thead><tr><th th:text="#{hotel.roomNumber}"></th><th th:text="#{hotel.block.period}"></th><th th:text="#{hotel.block.type}"></th><th th:text="#{hotel.status}"></th><th th:text="#{hotel.reason}"></th><th th:text="#{hotel.actor}"></th><th th:text="#{cms.actions}"></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(blocks)}"><td colspan="7" class="text-center text-muted py-4" th:text="#{cms.empty}"></td></tr><tr th:each="b:${blocks}"><td><a th:href="@{/admin/rooms/{id}(id=${b.roomId})}" th:text="${b.roomNumber}"></a></td><td class="small text-nowrap"><span th:text="${b.fromDate}"></span> → <span th:text="${b.toDate}"></span></td><td th:text="#{${'hotel.block.type.'+b.blockType}}"></td><td><span class="badge" th:classappend="${b.status=='ACTIVE'?'bg-light-danger':'bg-light-success'}" th:text="#{${'hotel.block.status.'+b.status}}"></span></td><td class="small" th:text="${b.reason}"></td><td class="small"><span th:text="${b.createdBy} ?: #{hotel.system}"></span><small class="d-block text-muted" th:text="${@dateFmt.local(b.createdAt)}"></small></td><td><form th:if="${b.status=='ACTIVE'}" sec:authorize="hasAuthority('room.block.manage')" method="post" th:action="@{/admin/room-blocks/{id}/release(id=${b.id})}" class="d-flex gap-2"><label class="visually-hidden" th:for="'release-'+${b.id}" th:text="#{hotel.reason}"></label><input class="form-control form-control-sm" name="reason" th:id="'release-'+${b.id}" required maxlength="500" th:placeholder="#{hotel.releaseReason}"><button class="btn btn-sm btn-outline-success text-nowrap" th:text="#{hotel.block.release}"></button></form><small th:if="${b.releasedAt}" class="text-muted" th:text="${@dateFmt.local(b.releasedAt)}"></small></td></tr></tbody></table></div></div></body></html>
