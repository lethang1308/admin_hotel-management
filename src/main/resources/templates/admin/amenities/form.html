<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{hotel.amenities.title}, ~{::#hotel-page}, ~{})}"><body><div id="hotel-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{hotel.workspace}"></p><h3 th:text="#{hotel.amenities.title}"></h3><p class="text-muted mb-0" th:text="#{hotel.amenities.subtitle}"></p></div><div class="d-flex gap-2 flex-wrap"></div></div><div class="card"><div class="card-body"><form method="post" th:action="@{${formAction}}" th:object="${form}"><div class="alert alert-light-danger" th:if="${formError}" th:text="${formError}"></div><div class="alert alert-light-danger" th:if="${#fields.hasErrors('*')}"><ul class="mb-0"><li th:each="err:${#fields.errors('*')}" th:text="${err}"></li></ul></div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="code" th:text="#{hotel.code}"></label><input class="form-control" type="text" id="code" th:field="*{code}" required maxlength="30" pattern="[A-Za-z0-9_-]+"><small class="text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></small></div><div class="col-md-6"><label class="form-label" for="name" th:text="#{hotel.name}"></label><input class="form-control" type="text" id="name" th:field="*{name}" required maxlength="100"><small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small></div><div class="col-md-6"><label class="form-label" for="icon" th:text="#{hotel.icon}"></label><input class="form-control" type="text" id="icon" th:field="*{icon}" pattern="bi-[a-z0-9-]{1,60}" maxlength="64"><small class="text-danger" th:if="${#fields.hasErrors('icon')}" th:errors="*{icon}"></small></div><div class="col-md-6"><div class="form-check mt-3"><input class="form-check-input" type="checkbox" id="active" th:field="*{active}"><label class="form-check-label" for="active" th:text="#{hotel.active}"></label></div></div><div class="col-12 d-flex gap-2 mt-4"><button class="btn btn-primary" th:text="#{cms.save}"></button><a class="btn btn-light" th:href="@{/admin/amenities}" th:text="#{hotel.back}"></a></div></div></form></div></div></div></body></html>
