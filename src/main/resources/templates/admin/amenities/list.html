<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{hotel.amenities.title}, ~{::#hotel-page}, ~{::#hotel-scripts})}"><body><div id="hotel-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{hotel.workspace}"></p><h3 th:text="#{hotel.amenities.title}"></h3><p class="text-muted mb-0" th:text="#{hotel.amenities.subtitle}"></p></div><div class="d-flex gap-2 flex-wrap"><a class="btn btn-primary" th:href="@{/admin/amenities/create}" th:text="#{hotel.add}"></a></div></div><div class="card"><div class="card-body"><div class="table-responsive"><table class="table align-middle table-hover"><thead><tr><th th:text="#{hotel.code}"></th><th th:text="#{hotel.name}"></th><th th:text="#{hotel.icon}"></th><th th:text="#{hotel.active}"></th><th th:text="#{cms.actions}"></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(rows)}"><td colspan="8" class="py-5 text-center text-muted" th:text="#{cms.empty}"></td></tr><tr th:each="r:${rows}"><td th:text="${r.code}"></td><td th:text="${r.name}"></td><td><i class="bi me-2" th:classappend="${r.icon}" aria-hidden="true"></i><code th:text="${r.icon}"></code></td><td><span class="badge" th:classappend="${r.active ? 'bg-light-success':'bg-light-secondary'}" th:text="${r.active} ? #{hotel.active} : #{hotel.inactive}"></span></td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/amenities/{id}/edit(id=${r.id})}" th:text="#{cms.edit}"></a><form method="post" th:action="@{/admin/amenities/{id}/delete(id=${r.id})}" data-confirm-delete th:attr="data-confirm-message=#{hotel.confirmDelete}"><button class="btn btn-sm btn-outline-danger" th:text="#{hotel.delete}"></button></form></div></td></tr></tbody></table></div></div></div></div><th:block id="hotel-scripts"><script th:src="@{/admin/assets/static/js/cms-hotel.js}"></script></th:block></body></html>
