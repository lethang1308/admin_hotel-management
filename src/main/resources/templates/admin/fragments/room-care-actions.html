<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><div th:fragment="templates">
<th:block th:each="floor:${grid.floors}"><template th:each="room:${floor.rooms}" th:id="${'room-care-'+room.id}">
<div class="border rounded p-3 mb-3" th:with="o=${occupants.get(room.id)}">
<th:block th:if="${room.status.name()=='AVAILABLE'}"><a sec:authorize="hasAuthority('booking.create')" class="btn btn-primary btn-sm me-2" th:href="@{/admin/bookings/create(typeId=${room.roomTypeId},from=${today},until=${today.plusDays(1)})}" th:text="#{care.walkIn}"></a><a sec:authorize="hasAuthority('booking.read.any')" class="btn btn-outline-primary btn-sm" th:href="@{/admin/bookings(quick='ARRIVALS')}" th:text="#{care.assignArrival}"></a></th:block>
<div th:if="${o!=null}" class="mb-3"><a sec:authorize="hasAuthority('booking.read.any')" th:href="@{/admin/bookings/{id}(id=${o.id('booking_id')})}" th:text="${o.s('booking_code')+' · '+o.s('contact_name')}"></a><p><span th:text="#{ops.balance}"></span> <strong th:text="${o.money('debt')+' VND'}"></strong></p>
<a sec:authorize="hasAuthority('customer.read')" class="btn btn-sm btn-light" th:href="@{/admin/customers/{id}(id=${o.id('customer_id')})}" th:text="#{care.stayHistory}"></a>
<button sec:authorize="hasAuthority('service.usage.manage')" type="button" class="btn btn-sm btn-outline-primary" data-open-cashier th:data-booking="${o.id('booking_id')}" th:text="#{cashier.services}"></button>
<button sec:authorize="hasAuthority('booking.checkout')" type="button" class="btn btn-sm btn-primary" data-stay-action="checkout" th:data-booking="${o.id('booking_id')}" th:data-line="${o.id('line_id')}" th:data-code="${o.s('booking_code')}" th:text="#{reception.checkout}"></button></div>
<form th:if="${room.status.name()!='MAINTENANCE' and room.status.name()!='INACTIVE'}" sec:authorize="hasAuthority('room.status.update') and hasAuthority('housekeeping.manage')" method="post" th:action="@{/admin/rooms/{id}/dirty(id=${room.id})}">
<label class="form-label mt-3 d-block"><span th:text="${room.status.name()=='OCCUPIED'}?#{care.stayOver}:#{care.markDirty}"></span><input name="notes" class="form-control" maxlength="500" required></label><label class="form-check-label me-2 mb-2"><input class="form-check-input me-1" type="checkbox" name="priority" value="true"><span th:text="#{care.HIGH}"></span></label><button class="btn btn-outline-warning btn-sm" th:text="#{care.requestCleaning}"></button></form>
<details sec:authorize="hasAuthority('maintenance.manage')" class="border rounded p-3 mt-3"><summary class="text-danger" th:text="#{care.report}"></summary>
<form method="post" th:action="@{/admin/maintenance}" class="pt-3" data-care-fault>
<input name="key" type="hidden" th:value="${careFaultKey}" data-care-fault-key><input name="room" type="hidden" th:value="${room.id}">
<label class="form-label d-block"><span th:text="#{care.faultTitle}"></span><input name="title" class="form-control" maxlength="200" required></label>
<label class="form-label d-block"><span th:text="#{care.description}"></span><textarea name="description" class="form-control" maxlength="5000"></textarea></label>
<label class="form-label"><span th:text="#{care.priority}"></span><select name="priority" class="form-select"><option value="NORMAL" th:text="#{care.NORMAL}"></option><option value="LOW" th:text="#{care.LOW}"></option><option value="HIGH" th:text="#{care.HIGH}"></option><option value="URGENT" th:text="#{care.URGENT}"></option></select></label>
<div sec:authorize="hasAuthority('room.status.update')"><label class="form-check-label d-block mb-2"><input class="form-check-input me-1" type="checkbox" name="block" value="true"><span th:text="#{care.blockRoom}"></span></label>
<div class="booking-input-grid"><input type="date" name="from" class="form-control" th:value="${today}" th:min="${today}" th:aria-label="#{ops.from}"><input type="date" name="until" class="form-control" th:value="${today.plusDays(1)}" th:min="${today.plusDays(1)}" th:aria-label="#{ops.until}"></div>
<label class="form-label mt-2 d-block"><span th:text="#{ops.reason}"></span><input name="reason" class="form-control" maxlength="500"></label><p class="small text-muted" th:text="#{care.blockHint}"></p></div>
<button class="btn btn-outline-danger btn-sm" th:text="#{care.report}"></button></form></details>
</div></template></th:block></div></body></html>
