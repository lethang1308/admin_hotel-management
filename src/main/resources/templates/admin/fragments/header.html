<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header">
    <nav class="navbar navbar-expand navbar-light navbar-top">
        <div class="container-fluid">
            <a href="#" class="burger-btn d-block">
                <i class="bi bi-justify fs-3"></i>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <div class="ms-3 d-none d-md-block">
                    <span class="badge bg-light-primary" th:text="${appName} ?: #{admin.app.defaultName}">
                        Enterprise Management System
                    </span>
                </div>

                <ul class="navbar-nav ms-auto mb-lg-0 align-items-center">
                    <li id="reception-notifications" class="nav-item dropdown me-2"
                        sec:authorize="hasAnyAuthority('notification.manage','booking.read.any')"
                        th:data-feed="@{/admin/api/receptionist/notifications}"
                        th:data-stream="@{/admin/api/receptionist/stream}"
                        th:data-read="@{/admin/api/receptionist/notifications/read}"
                        th:data-booking-base="@{/admin/bookings/}"
                        th:data-can-read="${#authorization.expression(&quot;hasAuthority('notification.manage')&quot;)}"
                        th:data-can-booking="${#authorization.expression(&quot;hasAuthority('booking.read.any')&quot;)}"
                        th:data-empty="#{reception.notificationsEmpty}"
                        th:data-title="#{reception.notification}"
                        th:data-new="#{reception.newUpdate}"
                        th:data-event-booking-created="#{reception.event.booking_created}"
                        th:data-event-booking-confirmed="#{reception.event.booking_confirmed}"
                        th:data-event-booking-cancelled="#{reception.event.booking_cancelled}"
                        th:data-event-booking-rejected="#{reception.event.booking_rejected}"
                        th:data-event-booking-no-show="#{reception.event.booking_no_show}"
                        th:data-event-booking-changed="#{reception.event.booking_changed}"
                        th:data-event-booking-change-requested="#{reception.event.booking_change_requested}"
                        th:data-event-booking-room-checked-in="#{reception.event.booking_room_checked_in}"
                        th:data-event-booking-room-checked-out="#{reception.event.booking_room_checked_out}"
                        th:data-event-payment-collected="#{reception.event.payment_collected}"
                        th:data-event-payment-refunded="#{reception.event.payment_refunded}">
                        <button class="btn btn-link nav-link position-relative" data-bs-toggle="dropdown"
                                th:aria-label="#{reception.notifications}" aria-expanded="false">
                            <i class="bi bi-bell fs-5" aria-hidden="true"></i>
                            <span class="badge bg-danger" data-unread hidden></span>
                        </button>
                        <div class="dropdown-menu dropdown-menu-end p-0">
                            <div class="p-3 border-bottom d-flex gap-3 justify-content-between align-items-center">
                                <strong th:text="#{reception.notifications}"></strong>
                                <button type="button" class="btn btn-sm btn-light" data-mark-read
                                        sec:authorize="hasAuthority('notification.manage')" th:text="#{reception.markRead}"></button>
                            </div>
                            <div class="reception-bell-list" data-notices></div>
                            <label class="p-3 small d-flex align-items-center gap-2 border-top">
                                <input type="checkbox" class="form-check-input m-0" data-notification-sound>
                                <span th:text="#{reception.sound}"></span>
                            </label>
                        </div>
                    </li>

                    <li class="nav-item me-2" sec:authorize="hasAuthority('booking.read.any')"><button type="button" class="btn btn-sm btn-outline-primary" data-stay-lookup th:aria-label="#{stay.lookup}"><i class="bi bi-search me-1" aria-hidden="true"></i><span class="d-none d-lg-inline" th:text="#{stay.lookup}"></span></button></li>
                        <li class="nav-item me-2" sec:authorize="hasAnyAuthority('room.read','booking.create')">
                        <button type="button" class="btn btn-outline-primary btn-sm" data-open-availability>
                            <i class="bi bi-search me-1" aria-hidden="true"></i><span class="d-none d-md-inline" th:text="#{deskBook.availability}"></span>
                            <span class="visually-hidden d-md-none" th:text="#{deskBook.availability}"></span>
                        </button>
                    </li>
                    <!-- Language Selector Dropdown -->
                    <li class="nav-item dropdown me-3">
                        <a class="nav-link dropdown-toggle text-gray-600 d-flex align-items-center gap-1"
                           href="#" data-bs-toggle="dropdown" aria-expanded="false" title="Language / Ngôn ngữ">
                            <i class="bi bi-translate fs-5"></i>
                            <span class="fw-semibold small ms-1" th:text="${currentLang == 'en' ? 'EN' : 'VI'}">VI</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm" style="min-width: 11rem;">
                            <li>
                                <a class="dropdown-item d-flex align-items-center justify-content-between"
                                   th:classappend="${currentLang != 'en'} ? 'active fw-bold' : ''"
                                   th:href="${langViUrl}">
                                    <span>🇻🇳 Tiếng Việt</span>
                                    <i class="bi bi-check2" th:if="${currentLang != 'en'}"></i>
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item d-flex align-items-center justify-content-between"
                                   th:classappend="${currentLang == 'en'} ? 'active fw-bold' : ''"
                                   th:href="${langEnUrl}">
                                    <span>🇬🇧 English</span>
                                    <i class="bi bi-check2" th:if="${currentLang == 'en'}"></i>
                                </a>
                            </li>
                        </ul>
                    </li>

                    <li class="nav-item me-2" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link text-gray-600" th:href="@{/swagger-ui.html}" target="_blank"
                           rel="noopener" title="OpenAPI Documentation">
                            <i class="bi bi-braces fs-5"></i>
                        </a>
                    </li>
                </ul>

                <div class="dropdown">
                    <a href="#" data-bs-toggle="dropdown" aria-expanded="false" class="text-decoration-none">
                        <div class="user-menu d-flex">
                            <div class="user-name text-end me-3">
                                <h6 class="mb-0 text-gray-600"
                                    th:text="${currentAdminName} ?: 'Administrator'">Administrator</h6>
                                <p class="mb-0 text-sm text-gray-600"
                                   th:text="${currentAdminEmail} ?: 'ADMIN'">ADMIN</p>
                            </div>
                            <div class="user-img d-flex align-items-center">
                                <div class="avatar avatar-md">
                                    <img th:src="@{/admin/assets/static/images/faces/1.jpg}" alt="Admin Avatar">
                                </div>
                            </div>
                        </div>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" style="min-width: 13rem;">
                        <li>
                            <h6 class="dropdown-header"
                                th:text="#{admin.header.signedInAs(${currentAdminName} ?: 'Admin')}">Signed in</h6>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/admin}">
                                <i class="icon-mid bi bi-grid me-2"></i> <span th:text="#{admin.nav.dashboard}">Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" sec:authorize="hasRole('ADMIN') and hasAuthority('account.manage')" th:href="@{/admin/users}">
                                <i class="icon-mid bi bi-people me-2"></i> <span th:text="#{admin.nav.users}">User Management</span>
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" sec:authorize="hasRole('ADMIN') and hasAuthority('role.manage')" th:href="@{/admin/roles}">
                                <i class="icon-mid bi bi-shield-lock me-2"></i> <span th:text="#{admin.nav.roles}">Roles &amp; RBAC</span>
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" sec:authorize="hasAuthority('profile.manage.own')" th:href="@{/admin/profile/password}"><i class="bi bi-key me-2"></i><span th:text="#{cms.changePassword}"></span></a><hr class="dropdown-divider">
                        </li>
                        <li>
                            <form th:action="@{/admin/logout}" method="post" class="m-0">
                                <input type="hidden" th:if="${_csrf != null}"
                                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="icon-mid bi bi-box-arrow-left me-2"></i> <span th:text="#{admin.header.logout}">Logout</span>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
