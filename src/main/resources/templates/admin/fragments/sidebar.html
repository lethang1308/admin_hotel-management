<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div id="sidebar" th:fragment="sidebar">
    <div class="sidebar-wrapper active">
        <div class="sidebar-header position-relative">
            <div class="d-flex justify-content-between align-items-center">
                <div class="logo">
                    <a th:href="@{/admin}" class="d-flex align-items-center text-decoration-none">
                        <img th:src="@{/admin/assets/static/images/logo/logo.svg}" alt="Logo">
                    </a>
                </div>
                <div class="theme-toggle d-flex gap-2 align-items-center mt-2">
                    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img"
                         class="iconify iconify--system-uicons" width="20" height="20"
                         preserveAspectRatio="xMidYMid meet" viewBox="0 0 21 21">
                        <g fill="none" fill-rule="evenodd" stroke="currentColor" stroke-linecap="round"
                           stroke-linejoin="round">
                            <path d="M10.5 14.5c2.219 0 4-1.763 4-3.982a4.003 4.003 0 0 0-4-4.018c-2.219 0-4 1.781-4 4c0 2.219 1.781 4 4 4zM4.136 4.136L5.55 5.55m9.9 9.9l1.414 1.414M1.5 10.5h2m14 0h2M4.135 16.863L5.55 15.45m9.899-9.9l1.414-1.415M10.5 19.5v-2m0-14v-2"
                                  opacity=".3"></path>
                            <g transform="translate(-210 -1)">
                                <path d="M220.5 2.5v2m6.5.5l-1.5 1.5"></path>
                                <circle cx="220.5" cy="11.5" r="4"></circle>
                                <path d="m214 5l1.5 1.5m5 14v-2m6.5-.5l-1.5-1.5M214 18l1.5-1.5m-4-5h2m14 0h2"></path>
                            </g>
                        </g>
                    </svg>
                    <div class="form-check form-switch fs-6">
                        <input class="form-check-input me-0" type="checkbox" id="toggle-dark" style="cursor: pointer">
                        <label class="form-check-label" for="toggle-dark"></label>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img"
                         class="iconify iconify--mdi" width="20" height="20"
                         preserveAspectRatio="xMidYMid meet" viewBox="0 0 24 24">
                        <path fill="currentColor"
                              d="m17.75 4.09l-2.53 1.94l.91 3.06l-2.63-1.81l-2.63 1.81l.91-3.06l-2.53-1.94L12.44 4l1.06-3l1.06 3l3.19.09m3.5 6.91l-1.64 1.25l.59 1.98l-1.7-1.17l-1.7 1.17l.59-1.98L15.75 11l2.06-.05L18.5 9l.69 1.95l2.06.05m-2.28 4.95c.83-.08 1.72 1.1 1.19 1.85c-.32.45-.66.87-1.08 1.27C15.17 23 8.84 23 4.94 19.07c-3.91-3.9-3.91-10.24 0-14.14c.4-.4.82-.76 1.27-1.08c.75-.53 1.93.36 1.85 1.19c-.27 2.86.69 5.83 2.89 8.02a9.96 9.96 0 0 0 8.02 2.89m-1.64 2.02a12.08 12.08 0 0 1-7.8-3.47c-2.17-2.19-3.33-5-3.49-7.82c-2.81 3.14-2.7 7.96.31 10.98c3.02 3.01 7.84 3.12 10.98.31Z">
                        </path>
                    </svg>
                </div>
                <div class="sidebar-toggler x">
                    <a href="#" class="sidebar-hide d-xl-none d-block"><i class="bi bi-x bi-middle"></i></a>
                </div>
            </div>
        </div>

        <div class="sidebar-menu">
            <ul class="menu">
                <li class="sidebar-title" th:text="#{admin.sidebar.menu}">Menu</li>

                <li class="sidebar-item" th:classappend="${currentPath == '/admin'} ? 'active' : ''">
                    <a th:href="@{/admin}" class="sidebar-link">
                        <i class="bi bi-grid-fill"></i>
                        <span th:text="#{admin.nav.dashboard}">Dashboard</span>
                    </a>
                </li>

                <li class="sidebar-title" th:text="#{admin.sidebar.identityAccess}">Identity &amp; Access</li>

                <li class="sidebar-item has-sub" sec:authorize="hasRole('ADMIN') and hasAuthority('account.manage')"
                    th:classappend="${currentPath != null and currentPath.startsWith('/admin/users')} ? 'active' : ''">
                    <a href="#" class="sidebar-link">
                        <i class="bi bi-people-fill"></i>
                        <span th:text="#{admin.nav.users}">User Management</span>
                    </a>
                    <ul class="submenu"
                        th:classappend="${currentPath != null and currentPath.startsWith('/admin/users')} ? 'active submenu-open' : ''">
                        <li class="submenu-item"
                            th:classappend="${currentPath == '/admin/users'} ? 'active' : ''">
                            <a th:href="@{/admin/users}" class="submenu-link" th:text="#{admin.nav.allUsers}">All Users</a>
                        </li>
                        <li class="submenu-item"
                            th:classappend="${currentPath == '/admin/users/create'} ? 'active' : ''">
                            <a th:href="@{/admin/users/create}" class="submenu-link" th:text="#{admin.nav.createUser}">Create User</a>
                        </li>
                    </ul>
                </li>

                <li class="sidebar-item"
                    sec:authorize="hasRole('ADMIN') and hasAuthority('role.manage')"
                    th:classappend="${currentPath != null and currentPath.startsWith('/admin/roles')} ? 'active' : ''">
                    <a th:href="@{/admin/roles}" class="sidebar-link">
                        <i class="bi bi-shield-lock-fill"></i>
                        <span th:text="#{admin.nav.roles}">Roles &amp; RBAC</span>
                    </a>
                </li>

                <li class="sidebar-item" sec:authorize="hasAuthority('account.manage')" th:classappend="${currentPath != null and currentPath.startsWith('/admin/employees')} ? 'active' : ''"><a class="sidebar-link" th:href="@{/admin/employees}"><i class="bi bi-person-badge" aria-hidden="true"></i><span th:text="#{cms.employees.title}"></span></a></li>
<li class="sidebar-item" sec:authorize="hasAuthority('customer.read')" th:classappend="${currentPath != null and currentPath.startsWith('/admin/customers')} ? 'active' : ''"><a class="sidebar-link" th:href="@{/admin/customers}"><i class="bi bi-people" aria-hidden="true"></i><span th:text="#{cms.customers.title}"></span></a></li>
<li class="sidebar-item" sec:authorize="hasAuthority('audit.read')" th:classappend="${currentPath != null and currentPath.startsWith('/admin/audit-logs')} ? 'active' : ''"><a class="sidebar-link" th:href="@{/admin/audit-logs}"><i class="bi bi-clock-history" aria-hidden="true"></i><span th:text="#{cms.audit.title}"></span></a></li>
<li class="sidebar-item" sec:authorize="hasAuthority('profile.manage.own')" th:classappend="${currentPath != null and currentPath.startsWith('/admin/profile/password')} ? 'active' : ''"><a class="sidebar-link" th:href="@{/admin/profile/password}"><i class="bi bi-key" aria-hidden="true"></i><span th:text="#{cms.changePassword}"></span></a></li>
<li class="sidebar-title" sec:authorize="hasRole('ADMIN')" th:text="#{admin.sidebar.developerSystem}">Developer &amp; System</li>

                <li class="sidebar-item" sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/swagger-ui.html}" target="_blank" rel="noopener" class="sidebar-link">
                        <i class="bi bi-file-earmark-code-fill"></i>
                        <span th:text="#{admin.nav.swagger}">OpenAPI / Swagger</span>
                    </a>
                </li>

                <li class="sidebar-item" sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/actuator/health}" target="_blank" rel="noopener" class="sidebar-link">
                        <i class="bi bi-heart-pulse-fill"></i>
                        <span th:text="#{admin.nav.health}">System Health</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
