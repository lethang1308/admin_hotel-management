<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<section th:fragment="requests" class="card card-body mb-4" sec:authorize="hasAuthority('booking.update.any')">
<h5 th:text="#{care.specialRequests}"></h5>
<form method="post" th:action="@{/admin/bookings/{id}/guest-requests(id=${d.booking.id('id')})}" data-guest-preferences th:data-stale="#{ops.error.priceChanged}" th:data-preview="@{/admin/bookings/{id}/guest-requests/preview(id=${d.booking.id('id')})}">
<label class="form-label"><span th:text="#{reception.room}"></span><select name="line" class="form-select" required><option th:each="r:${guestPreferences}" th:value="${r.id('id')}" th:text="${'#'+r.n('line_number')}" th:data-revision="${r.n('revision')}" th:data-tags="${r.s('tags')}" th:data-beds="${r.n('extra_beds')}" th:data-guests="${r.n('extra_guests')}" th:data-notes="${r.s('special_requests') ?: ''}"></option></select></label>
<input type="hidden" name="revision"><input type="hidden" name="token">
<div class="d-flex flex-wrap gap-3 mb-3"><label th:each="tag:${guestTags}" class="form-check-label"><input type="checkbox" name="tags" class="form-check-input me-1" th:value="${tag}"><span th:text="#{${'care.tag.'+tag}}"></span></label></div>
<div class="booking-input-grid"><label class="form-label"><span th:text="#{care.extraBeds}"></span><input name="beds" class="form-control" type="number" min="0" max="10" value="0" required></label><label class="form-label"><span th:text="#{care.extraGuests}"></span><input name="guests" class="form-control" type="number" min="0" max="10" value="0" required></label></div>
<p class="small text-muted" th:text="#{care.addonHint}"></p>
<label class="form-label d-block"><span th:text="#{care.lineRequests}"></span><textarea name="lineNotes" class="form-control" maxlength="5000"></textarea></label>
<label class="form-label d-block"><span th:text="#{care.customerRequests}"></span><textarea name="special" class="form-control" maxlength="5000" th:text="${d.booking.s('special_requests')}"></textarea></label>
<label class="form-label d-block"><span th:text="#{care.internalNotes}"></span><textarea name="internal" class="form-control" maxlength="5000" th:text="${d.booking.s('internal_notes')}"></textarea></label>
<label class="form-label d-block"><span th:text="#{ops.reason}"></span><input name="reason" class="form-control" maxlength="500" required></label>
<button type="button" class="btn btn-outline-primary" data-preview-addons th:text="#{care.previewAddons}"></button><button class="btn btn-primary" data-save-preferences disabled th:text="#{cms.save}"></button><div class="mt-3" data-addon-result role="status"></div>
</form></section>
<section th:fragment="messages" id="guest-messages" class="card card-body mb-4" sec:authorize="hasAuthority('notification.manage')">
<h5 th:text="#{care.guestMessages}"></h5><p class="small text-muted" th:text="#{care.mailHint}"></p>
<form method="post" class="mb-3" th:if="${d.booking.s('status')=='CONFIRMED' or d.booking.s('status')=='CHECKED_IN'}" th:action="@{/admin/bookings/{id}/resend-email(id=${d.booking.id('id')})}">
<input name="key" type="hidden" th:value="${emailKey}"><label class="form-label"><span th:text="#{cms.email}"></span><input name="recipient" type="email" class="form-control" maxlength="150" th:value="${d.booking.s('contact_email')}" required></label><button class="btn btn-outline-primary" th:text="#{care.resend}"></button></form>
<div class="table-responsive"><table class="table table-sm"><thead><tr><th th:text="#{care.message}"></th><th th:text="#{cms.email}"></th><th th:text="#{ops.status}"></th><th th:text="#{care.times}"></th><th th:text="#{care.attempts}"></th></tr></thead><tbody><tr th:each="m:${guestMessages}"><td th:text="${m.s('subject')}"></td><td th:text="${m.s('recipient')}"></td><td><span th:text="#{${'care.mail.'+m.s('status')}}"></span><small class="d-block text-danger" th:text="${m.s('last_error')}"></small></td><td class="small"><span th:text="${m.time('sent_at') ?: m.time('created_at')}"></span><br><span th:if="${m.time('next_retry_at')!=null}" th:text="${m.time('next_retry_at')}"></span> UTC</td><td th:text="${m.n('attempts')}"></td></tr></tbody></table></div></section>
<section th:fragment="customer-history" class="card card-body mt-4">
<h5 th:text="#{care.stayHistory}"></h5><span class="badge bg-light-primary align-self-start" th:text="#{${'care.customer.'+history.tag}}"></span>
<div class="row g-3 my-3"><div class="col"><small th:text="#{care.orders}"></small><strong class="d-block" th:text="${history.bookings}"></strong></div><div class="col"><small th:text="#{care.visits}"></small><strong class="d-block" th:text="${history.visits}"></strong></div><div class="col"><small th:text="#{care.nights}"></small><strong class="d-block" th:text="${history.nights}"></strong></div><div class="col"><small th:text="#{care.spent}"></small><strong class="d-block" th:text="${#numbers.formatDecimal(history.spent,1,'POINT',0,'COMMA')+' VND'}"></strong></div></div>
<p class="small text-muted" th:text="#{care.historyHint}"></p>
<form method="post" sec:authorize="hasAuthority('customer.update')" th:action="@{/admin/customers/{id}/notes(id=${target.id})}"><input name="expected" type="hidden" th:value="${target.notes}"><label class="form-label d-block"><span th:text="#{care.preferences}"></span><textarea name="notes" class="form-control" maxlength="5000" th:text="${target.notes}"></textarea></label><label class="form-label"><span th:text="#{ops.reason}"></span><input name="reason" class="form-control" maxlength="500" required></label><button class="btn btn-primary" th:text="#{cms.save}"></button></form>
<div class="table-responsive mt-4"><table class="table table-sm"><thead><tr><th th:text="#{ops.booking}"></th><th th:text="#{ops.status}"></th><th th:text="#{care.spent}"></th><th th:text="#{ops.balance}"></th><th th:text="#{ops.invoice}"></th></tr></thead><tbody><tr th:each="b:${history.orders}"><td><a sec:authorize="hasAuthority('booking.read.any')" th:href="@{/admin/bookings/{id}(id=${b.id('id')})}" th:text="${b.s('booking_code')}"></a><span sec:authorize="!hasAuthority('booking.read.any')" th:text="${b.s('booking_code')}"></span></td><td th:text="#{${'ops.'+b.s('status')}}"></td><td th:text="${b.money('net_paid')}"></td><td th:text="${b.money('total').subtract(b.money('net_paid'))}"></td><td><a th:if="${b.id('invoice')!=null}" sec:authorize="hasAuthority('invoice.manage')" th:href="@{/admin/invoices/{id}/pdf(id=${b.id('invoice')})}" th:text="#{stay.download}"></a></td></tr></tbody></table></div>
<h6 th:text="#{care.roomsStayed}"></h6><div th:each="r:${history.rooms}" class="small mb-2"><strong th:text="${r.s('booking_code')+' · '+r.s('room_number')+' · '+r.s('room_type_name_snapshot')}"></strong><span th:text="${' · '+r.s('from_date')+' → '+r.s('to_date')}"></span></div>
<h6 class="mt-3" th:text="#{cashier.services}"></h6><p class="small" th:each="s:${history.services}" th:text="${s.s('booking_code')+' · '+s.s('service_name_snapshot')+' · '+s.s('quantity')+' '+s.s('unit_snapshot')+' · '+s.s('status')}"></p>
</section>
</body></html>
