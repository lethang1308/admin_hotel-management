<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{hotel.types.title}, ~{::#hotel-page}, ~{::#hotel-scripts})}"><body><div id="hotel-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{hotel.workspace}"></p><h3 th:text="#{hotel.types.title}"></h3><p class="text-muted mb-0" th:text="#{hotel.types.subtitle}"></p></div><div class="d-flex gap-2 flex-wrap"><a class="btn btn-primary" th:href="@{/admin/room-types/create}" th:text="#{hotel.add}"></a></div></div><div class="row g-4"><div th:if="${#lists.isEmpty(rows)}" class="col-12"><div class="card card-body text-center py-5 text-muted" th:text="#{cms.empty}"></div></div><div class="col-md-6 col-xxl-4" th:each="t:${rows}"><article class="card hotel-type-card h-100"><img th:if="${t.coverUrl}" class="hotel-type-cover" th:src="${t.coverUrl}" th:alt="${t.name}" loading="lazy" referrerpolicy="no-referrer"><div th:unless="${t.coverUrl}" class="hotel-type-placeholder"><i class="bi bi-image" aria-hidden="true"></i><span th:text="#{hotel.noImages}"></span></div><div class="card-body"><div class="d-flex justify-content-between mb-2"><span class="badge bg-light-primary" th:text="${t.code}"></span><span class="badge" th:classappend="${t.active?'bg-light-success':'bg-light-secondary'}" th:text="${t.active}?#{hotel.active}:#{hotel.inactive}"></span></div><h5 th:text="${t.name}"></h5><div class="hotel-price"><span th:text="${#numbers.formatDecimal(t.basePrice,0,'COMMA',0,'POINT')}"></span><small th:text="#{hotel.perNight}"></small></div><p class="text-muted small mt-2"><i class="bi bi-people me-2"></i><span th:text="#{hotel.capacityLabel(${t.maxOccupancy},${t.maxAdults},${t.maxChildren})}"></span><span th:if="${t.areaSqm}" th:text="' · '+${t.areaSqm}+' m²'"></span></p><p class="small" th:text="${t.bedDescription}"></p><div class="d-flex flex-wrap gap-2 mb-3"><span th:each="a:${t.amenities}" class="hotel-amenity"><i class="bi" th:classappend="${a.icon}" aria-hidden="true"></i> <span th:text="${a.name}"></span></span></div><div class="d-flex gap-2"><a class="btn btn-outline-primary btn-sm" th:href="@{/admin/room-types/{id}/edit(id=${t.id})}" th:text="#{cms.manage}"></a><form method="post" th:action="@{/admin/room-types/{id}/delete(id=${t.id})}" data-confirm-delete th:attr="data-confirm-message=#{hotel.confirmDelete}"><button class="btn btn-outline-danger btn-sm" th:text="#{hotel.delete}"></button></form></div></div></article></div></div></div><th:block id="hotel-scripts"><script th:src="@{/admin/assets/static/js/cms-hotel.js}"></script></th:block></body></html>
