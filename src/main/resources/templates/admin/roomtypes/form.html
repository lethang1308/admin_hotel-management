<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/layouts/main :: layout(#{hotel.types.title}, ~{::#hotel-page}, ~{::#hotel-scripts})}"><body><div id="hotel-page"><div class="hotel-heading"><div><p class="hotel-eyebrow" th:text="#{hotel.workspace}"></p><h3 th:text="#{hotel.types.title}"></h3><p class="text-muted mb-0" th:text="#{hotel.types.subtitle}"></p></div><div class="d-flex gap-2 flex-wrap"><a class="btn btn-light" th:href="@{/admin/room-types}" th:text="#{hotel.back}"></a></div></div><div class="card"><div class="card-body"><form method="post" th:action="@{${formAction}}" th:object="${form}"><div class="alert alert-light-danger" th:if="${formError}" th:text="${formError}"></div><div class="alert alert-light-danger" th:if="${#fields.hasErrors('*')}"><ul class="mb-0"><li th:each="err:${#fields.errors('*')}" th:text="${err}"></li></ul></div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="code" th:text="#{hotel.code}"></label><input class="form-control" type="text" id="code" th:field="*{code}" required maxlength="30" pattern="[A-Za-z0-9_-]+"><small class="text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></small></div><div class="col-md-6"><label class="form-label" for="name" th:text="#{hotel.name}"></label><input class="form-control" type="text" id="name" th:field="*{name}" required maxlength="100"><small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small></div><div class="col-md-6"><label class="form-label" for="basePrice" th:text="#{hotel.basePrice}"></label><input class="form-control" type="number" id="basePrice" th:field="*{basePrice}" required min="0" step="0.01"><small class="text-danger" th:if="${#fields.hasErrors('basePrice')}" th:errors="*{basePrice}"></small></div><div class="col-md-6"><label class="form-label" for="areaSqm" th:text="#{hotel.areaSqm}"></label><input class="form-control" type="number" id="areaSqm" th:field="*{areaSqm}" min="0.01" step="0.01"><small class="text-danger" th:if="${#fields.hasErrors('areaSqm')}" th:errors="*{areaSqm}"></small></div><div class="col-md-6"><label class="form-label" for="maxAdults" th:text="#{hotel.maxAdults}"></label><input class="form-control" type="number" id="maxAdults" th:field="*{maxAdults}" required min="1" max="100"><small class="text-danger" th:if="${#fields.hasErrors('maxAdults')}" th:errors="*{maxAdults}"></small></div><div class="col-md-6"><label class="form-label" for="maxChildren" th:text="#{hotel.maxChildren}"></label><input class="form-control" type="number" id="maxChildren" th:field="*{maxChildren}" required min="0" max="100"><small class="text-danger" th:if="${#fields.hasErrors('maxChildren')}" th:errors="*{maxChildren}"></small></div><div class="col-md-6"><label class="form-label" for="maxOccupancy" th:text="#{hotel.maxOccupancy}"></label><input class="form-control" type="number" id="maxOccupancy" th:field="*{maxOccupancy}" required min="1" max="200"><small class="text-danger" th:if="${#fields.hasErrors('maxOccupancy')}" th:errors="*{maxOccupancy}"></small></div><div class="col-md-6"><label class="form-label" for="bedDescription" th:text="#{hotel.bedDescription}"></label><input class="form-control" type="text" id="bedDescription" th:field="*{bedDescription}" maxlength="200"><small class="text-danger" th:if="${#fields.hasErrors('bedDescription')}" th:errors="*{bedDescription}"></small></div><div class="col-12"><label class="form-label" for="description" th:text="#{hotel.description}"></label><textarea class="form-control" rows="4" id="description" th:field="*{description}" maxlength="20000"></textarea><small class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small></div><div class="col-md-6"><div class="form-check mt-3"><input class="form-check-input" type="checkbox" id="featured" th:field="*{featured}"><label class="form-check-label" for="featured" th:text="#{hotel.featured}"></label></div></div><div class="col-md-6"><div class="form-check mt-3"><input class="form-check-input" type="checkbox" id="active" th:field="*{active}"><label class="form-check-label" for="active" th:text="#{hotel.active}"></label></div></div><div class="col-12"><h6 th:text="#{hotel.amenities.title}"></h6><div class="row g-2"><div class="col-md-4" th:each="a:${amenities}"><div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{amenityIds}" th:value="${a.id}" th:disabled="${!a.active and !form.amenityIds.contains(a.id)}"><label class="form-check-label" th:for="${#ids.prev('amenityIds')}"><i class="bi me-1" th:classappend="${a.icon}" aria-hidden="true"></i><span th:text="${a.name}"></span><small th:unless="${a.active}" th:text="#{hotel.inactive}"></small></label></div></div></div></div><div class="col-12 d-flex gap-2 mt-4"><button class="btn btn-primary" th:text="#{cms.save}"></button><a class="btn btn-light" th:href="@{/admin/room-types}" th:text="#{hotel.back}"></a></div></div></form></div></div><section class="card" id="gallery" th:if="${targetId != null}"><div class="card-header"><h5 th:text="#{hotel.gallery}"></h5><p class="text-muted small mb-0" th:text="#{hotel.galleryHint}"></p></div><div class="card-body"><form method="post" enctype="multipart/form-data" th:action="@{/admin/room-types/{id}/images(id=${targetId})}" class="row g-3 mb-4"><div class="col-md-6"><label class="form-label" for="urls" th:text="#{hotel.imageUrls}"></label><textarea id="urls" name="urls" rows="3" class="form-control" maxlength="25000" placeholder="https://..."></textarea></div><div class="col-md-6"><label class="form-label" for="files" th:text="#{hotel.imageUpload}"></label><input id="files" type="file" name="files" class="form-control" accept="image/png,image/jpeg" multiple><small class="text-muted" th:text="#{hotel.imageHint}"></small><label class="form-label mt-2" for="altText" th:text="#{hotel.altText}"></label><input id="altText" name="altText" maxlength="200" class="form-control"></div><div class="col-12"><button class="btn btn-primary" th:text="#{hotel.addImages}"></button></div></form><div class="row g-3"><div class="col-12 text-muted" th:if="${#lists.isEmpty(images)}" th:text="#{hotel.noImages}"></div><div class="col-md-4 col-xl-3" th:each="img,iter:${images}"><div class="hotel-gallery-item"><img th:src="${img.imageUrl}" th:alt="${img.altText}" loading="lazy" referrerpolicy="no-referrer"><span class="badge bg-primary hotel-cover-badge" th:if="${iter.first}" th:text="#{hotel.cover}"></span><div class="p-3"><form class="d-flex gap-2 mb-2" method="post" th:action="@{/admin/room-types/{id}/images/{imageId}/move(id=${targetId},imageId=${img.id})}"><label class="visually-hidden" th:for="'position-'+${img.id}" th:text="#{hotel.sortOrder}"></label><input type="number" class="form-control form-control-sm" name="position" th:id="'position-'+${img.id}" th:value="${img.sortOrder}" min="0" th:max="${#lists.size(images)-1}"><button class="btn btn-sm btn-outline-primary" th:text="#{hotel.move}"></button></form><div class="d-flex gap-2"><form method="post" th:action="@{/admin/room-types/{id}/images/{imageId}/move(id=${targetId},imageId=${img.id})}"><input type="hidden" name="position" value="0"><button class="btn btn-sm btn-light" th:text="#{hotel.makeCover}"></button></form><form method="post" th:action="@{/admin/room-types/{id}/images/{imageId}/delete(id=${targetId},imageId=${img.id})}" data-confirm-delete th:attr="data-confirm-message=#{hotel.confirmDelete}"><button class="btn btn-sm btn-outline-danger" th:text="#{hotel.delete}"></button></form></div></div></div></div></div></div></section><div class="hotel-note" th:if="${targetId == null}" th:text="#{hotel.saveBeforeImages}"></div></div><th:block id="hotel-scripts"><script th:src="@{/admin/assets/static/js/cms-hotel.js}"></script></th:block></body></html>
